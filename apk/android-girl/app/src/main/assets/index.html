  } else if(q.type==='judge'){
    const t=document.getElementById('dq-opt-'+idx+'-t'), f=document.getElementById('dq-opt-'+idx+'-f');
    if(t) t.classList.toggle('sel', val===true);
    if(f) f.classList.toggle('sel', val===false);
    const sb=document.getElementById('dq-submit-'+idx); if(sb) sb.disabled=false;
  }
}
function dailyFillMatch(user, correct){
  const c = String(correct).toLowerCase().replace(/\s/g,'');
  const u = String(user).toLowerCase().replace(/\s/g,'');
  if(!u) return null;
  if(c.indexOf(u)>=0 || u.indexOf(c)>=0) return true;
  if(typeof checkFillAnswer==='function') return checkFillAnswer(u,c);
  return false;
}
function dailySubmit(idx){
  const dt = getDailyTraining();
  const item = dt.items[idx];
  const q = dailyFindQuestion(item.id);
  let isCorrect = false;
  let userVal = _dailySel;
  if(q.type==='choice'){ if(typeof _dailySel==='number') isCorrect = (_dailySel===q.answer); }
  else if(q.type==='judge'){ if(typeof _dailySel==='boolean') isCorrect = (_dailySel===q.answer); }
  else {
    const inp=document.getElementById('dq-fill-'+idx);
    const v=inp?inp.value.trim():'';
    const r=dailyFillMatch(v, q.answer);
    if(r===null){ toast('请输入答案','warning'); return; }
    isCorrect=r; userVal=v;
  }
  if(q.type!=='fill' && _dailySel===undefined){ toast('请先选择答案','warning'); return; }
  practiceState.answered.add(item.id);
  practiceState.answeredMap[item.id] = (q.type==='fill') ? userVal : _dailySel;
  if(isCorrect) practiceState.correctIds.add(item.id); else practiceState.wrongIds.add(item.id);
  savePracticeState();
  addStudyLog(item.subject, 'practice', 5);
  if(isCorrect){
    const pts = q.difficulty==='基础'?5:q.difficulty==='中等'?8:12;
    addPoints(pts, 'practice_correct', '每日训练答对('+q.subject+')');
  } else {
    addPoints(2, 'practice_wrong', '每日训练答错(鼓励分)');
  }
  dailyUpdateMistake(item.id, item.subject, isCorrect);
  dt.results[item.id] = {correct:isCorrect, choice:_dailySel};
  const answered = Object.keys(dt.results).length;
  if(answered>=dt.items.length){
    dt.completed = true;
    if(!dt.awarded){ dt.score = (dt.score||0)+10; dt.awarded=true; addPoints(10,'daily_complete','完成今日训练'); }
  }
  save(SK.dailyTraining, dt);
  checkPerfectDay();
  const fb = document.getElementById('dq-feedback-'+idx);
  let hintHtml = '';
  if(q.hint){
    hintHtml = '<div class="dq-hint"><div class="dqh-title">📖 解析</div>'
      + '<div><b>思路：</b>'+dqEscape(q.hint.approach||'')+'</div>'
      + '<div><b>易错点：</b>'+dqEscape(q.hint.pitfall||'')+'</div>'
      + (q.hint.extension?'<div><b>拓展：</b>'+dqEscape(q.hint.extension)+'</div>':'')
      + '</div>';
  }
  const correctAns = q.type==='choice' ? String.fromCharCode(65+q.answer)+'. '+q.options[q.answer] : (q.type==='judge'?(q.answer?'正确':'错误'):q.answer);
  let fbHtml = '<div class="dq-result '+(isCorrect?'ok':'bad')+'">'
    + '<div class="dqr-line">'+(isCorrect?'✅ 回答正确！':'❌ 回答错误')+'</div>'
    + '<div class="dqr-ans">正确答案：'+dqEscape(correctAns)+'</div>'
    + hintHtml
    + (!isCorrect?'<button class="btn btn-outline btn-sm" onclick="addToErrorsFromPractice(\''+item.id+'\',\''+item.subject+'\')">📝 加入错题本</button>':'')
    + (idx+1<dt.items.length
        ? '<button class="btn btn-primary btn-sm" onclick="renderDailyModal('+(idx+1)+')">下一题 →</button>'
        : '<button class="btn btn-primary btn-sm" onclick="finishDailyTraining()">完成今日训练 🎉</button>')
    + '</div>';
  if(fb) fb.innerHTML = fbHtml;
}

      const isCorrect = practiceState.correctIds.has(q.id);
      const userAnswer = practiceState.answeredMap[q.id];
      const subjClass = getSubjectClass(subj);
      const diffClass = getDifficultyClass(q.difficulty);

      html += `<div class="question-card ${subjClass}" id="q-${q.id}">`;
      html += `<div class="question-meta">`;
      html += `<span class="qm-subject" style="color:${color}">第${idx+1}题</span>`;
      html += `<span class="qm-type">${q.type==='choice'?'选择题':q.type==='fill'?'填空题':'判断题'}</span>`;
      html += `<span class="qm-difficulty ${diffClass}">${q.difficulty}</span>`;
      html += `<span class="qm-type">知识点：${escHtml(q.knowledgePoint)}</span>`;
      if(isAnswered){
        html += isCorrect?'<span class="tag tag-green">✓ 已答对</span>':'<span class="tag tag-red">✗ 待复习</span>';
      }
      html += `</div>`;
      html += `<div class="question-text">${escHtml(q.question)}</div>`;

      if(q.type==='choice'){
        html += '<div class="option-list">';
        q.options.forEach((opt, oi)=>{
          let cls = 'option-item';
          if(isAnswered){
            if(oi===q.answer) cls += ' correct-answer';
            else if(oi===userAnswer) cls += ' wrong-answer';
          }
          const letter = String.fromCharCode(65+oi);
          html += `<div class="${cls}" ${!isAnswered?`onclick="answerChoice('${q.id}',${oi})"`:''}>`;
          html += `<div class="option-letter">${letter}</div>`;
          html += `<div class="option-text">${escHtml(opt)}</div>`;
          if(isAnswered && oi===q.answer) html += '<span style="color:var(--c-accent);font-size:18px;margin-left:auto">✓</span>';
          if(isAnswered && oi===userAnswer && oi!==q.answer) html += '<span style="color:var(--c-danger);font-size:18px;margin-left:auto">✗</span>';
          html += '</div>';
        });
        html += '</div>';
      } else if(q.type==='fill'){
        if(!isAnswered){
          html += `<div class="fill-input-area"><input type="text" id="fill-${q.id}" placeholder="输入你的答案..." onkeydown="if(event.key==='Enter')answerFill('${q.id}')"><button class="btn btn-primary btn-sm" onclick="answerFill('${q.id}')">提交</button></div>`;
        } else {
          html += `<div style="background:var(--c-bg);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:8px"><span style="font-size:12px;color:var(--c-text-light)">你的答案：</span><span style="font-size:14px;${isCorrect?'color:var(--c-accent)':'color:var(--c-danger)'}">${escHtml(userAnswer||'未填写')}</span></div>`;
          html += `<div style="background:var(--c-accent-light);padding:10px 14px;border-radius:var(--radius-sm)"><span style="font-size:12px;color:var(--c-accent)">正确答案：</span><span style="font-size:14px;color:var(--c-accent);font-weight:600">${escHtml(q.answer)}</span></div>`;
        }
      } else if(q.type==='judge'){
        html += '<div class="judge-options">';
        let correctVal = q.answer;
        [true,false].forEach(val=>{
          let cls = 'judge-btn';
          if(isAnswered){
            if(val===correctVal) cls += ' correct-answer';
            else if(val===userAnswer) cls += ' wrong-answer';
          }
          html += `<div class="${cls}" ${!isAnswered?`onclick="answerJudge('${q.id}',${val})"`:''}>${val?'✓ 正确':'✗ 错误'}</div>`;
        });
        html += '</div>';
      }

      // Feedback and hint
      if(isAnswered){
        html += `<div class="answer-feedback ${isCorrect?'correct':'wrong'}">`;
        html += `<div class="feedback-header ${isCorrect?'correct':'wrong'}">`;
        html += isCorrect ?
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>回答正确！' :
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>回答错误，看看下面的综合提示';
        html += '</div>';
        if(!isCorrect && q.type==='choice'){
          html += `<div style="font-size:13px">正确答案是 <strong style="color:var(--c-accent)">${String.fromCharCode(65+q.answer)}. ${escHtml(q.options[q.answer])}</strong></div>`;
        }
        html += '</div>';

        // Comprehensive hint
        html += '<div class="hint-panel">';
        html += '<div class="hint-panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>错题综合提示</div>';
        html += `<div class="hint-section"><div class="hint-label">📝 解题思路</div><div class="hint-content">${escHtml(q.hint.approach)}</div></div>`;
        html += `<div class="hint-section"><div class="hint-label">⚠️ 易错点提醒</div><div class="hint-content">${escHtml(q.hint.pitfall)}</div></div>`;
        html += `<div class="hint-section"><div class="hint-label">💡 知识拓展</div><div class="hint-content">${escHtml(q.hint.extension)}</div></div>`;
        html += '</div>';

        // Actions
        html += '<div class="question-actions">';
        if(!isCorrect){
          html += `<button class="btn btn-primary btn-sm" onclick="addToErrorsFromPractice('${q.id}','${subj}')">📝 加入错题本</button>`;
          html += `<button class="btn btn-outline btn-sm" onclick="resetQuestion('${q.id}')">重新作答</button>`;
        }
        html += '</div>';
      }
      html += '</div>';
    });
  }
  pc.innerHTML = html;
}

function getSubjectEmoji(s){
  const map = {'语文':'📖','数学':'🔢','英语':'🔤','物理':'⚡','化学':'⚗️','生物':'🧬','地理':'🌍','历史':'📜','道法':'⚖️'};
  return map[s]||'📚';
}

function selectPracticeSubject(s){
  practiceState.subject = s;
  practiceState.difficulty = 'all';
  renderPractice();
}

function setPracticeDifficulty(d){
  practiceState.difficulty = d;
  renderPractice();
}

function answerChoice(qid, optIdx){
  if(practiceState.answered.has(qid)) return;
  const subj = practiceState.subject;
  const q = (QUESTION_BANK[subj]||[]).find(x=>x.id===qid);
  if(!q) return;
  const isCorrect = optIdx===q.answer;
  practiceState.answered.add(qid);
  practiceState.answeredMap[qid] = optIdx;
  if(isCorrect) practiceState.correctIds.add(qid);
  else practiceState.wrongIds.add(qid);
  savePracticeState();
  addStudyLog(subj, 'practice', 5);
  // Award points based on difficulty
  if(isCorrect){
    const pts = q.difficulty==='基础'?5:q.difficulty==='中等'?8:12;
    addPoints(pts, 'practice_correct', subj+'答题正确('+q.difficulty+')');
    toast('回答正确！+'+pts+'积分','success');
  } else {
    addPoints(2, 'practice_wrong', subj+'答题错误(鼓励分)');
    toast('回答错误，+2鼓励分，查看综合提示','error');
  }
  checkPerfectDay();
  renderPractice();
  setTimeout(()=>{ document.getElementById('q-'+qid)?.scrollIntoView({behavior:'smooth',block:'center'}); },100);
}

function answerFill(qid){
  if(practiceState.answered.has(qid)) return;
  const subj = practiceState.subject;
  const q = (QUESTION_BANK[subj]||[]).find(x=>x.id===qid);
  if(!q) return;
  const input = document.getElementById('fill-'+qid);
  const userAns = (input.value||'').trim();
  if(!userAns){ toast('请输入答案','warning'); return; }
  // Flexible matching: check if key parts of answer are present
  const correctAns = q.answer.toLowerCase().replace(/\s/g,'');
  const userLower = userAns.toLowerCase().replace(/\s/g,'');
  const isCorrect = correctAns.includes(userLower) || userLower.includes(correctAns) || checkFillAnswer(userLower, correctAns);
  practiceState.answered.add(qid);
  practiceState.answeredMap[qid] = userAns;
  if(isCorrect) practiceState.correctIds.add(qid);
  else practiceState.wrongIds.add(qid);
  savePracticeState();
  addStudyLog(subj, 'practice', 5);
  // Award points
  if(isCorrect){
    const pts = q.difficulty==='基础'?5:q.difficulty==='中等'?8:12;
    addPoints(pts, 'practice_correct', subj+'填空正确('+q.difficulty+')');
    toast('回答正确！+'+pts+'积分','success');
  } else {
    addPoints(2, 'practice_wrong', subj+'填空错误(鼓励分)');
    toast('回答错误，+2鼓励分，查看综合提示','error');
  }
  checkPerfectDay();
  renderPractice();
  setTimeout(()=>{ document.getElementById('q-'+qid)?.scrollIntoView({behavior:'smooth',block:'center'}); },100);
}

function checkFillAnswer(user, correct){
  // Extract key content between markers like ① ② or key numbers/words
  const correctParts = correct.split(/[①②③④⑤]/).filter(s=>s.length>1);
  if(correctParts.length>1){
    return correctParts.every(p=>user.includes(p.trim().toLowerCase()));
  }
  return false;
}

function answerJudge(qid, val){
  if(practiceState.answered.has(qid)) return;
  const subj = practiceState.subject;
  const q = (QUESTION_BANK[subj]||[]).find(x=>x.id===qid);
  if(!q) return;
  const isCorrect = val===q.answer;
  practiceState.answered.add(qid);
  practiceState.answeredMap[qid] = val;
  if(isCorrect) practiceState.correctIds.add(qid);
  else practiceState.wrongIds.add(qid);
  savePracticeState();
  addStudyLog(subj, 'practice', 5);
  // Award points
  if(isCorrect){
    const pts = q.difficulty==='基础'?5:q.difficulty==='中等'?8:12;
    addPoints(pts, 'practice_correct', subj+'判断正确('+q.difficulty+')');
    toast('回答正确！+'+pts+'积分','success');
  } else {
    addPoints(2, 'practice_wrong', subj+'判断错误(鼓励分)');
    toast('回答错误，+2鼓励分，查看综合提示','error');
  }
  checkPerfectDay();
  renderPractice();
  setTimeout(()=>{ document.getElementById('q-'+qid)?.scrollIntoView({behavior:'smooth',block:'center'}); },100);
}

function resetQuestion(qid){
  practiceState.answered.delete(qid);
  practiceState.correctIds.delete(qid);
  practiceState.wrongIds.delete(qid);
  delete practiceState.answeredMap[qid];
  savePracticeState();
  renderPractice();
  toast('已重置，可以重新作答','info');
}

function addToErrorsFromPractice(qid, subj){
  const q = (QUESTION_BANK[subj]||[]).find(x=>x.id===qid);
  if(!q) return;
  const errors = load(SK.errors, []);
  // Check if already added
  if(errors.some(e=>e.practiceId===qid)){
    toast('该题已在错题本中','warning');
    return;
  }
  const today = todayStr();
  const userAns = practiceState.answeredMap[qid];
  let userAnsStr = '';
  if(q.type==='choice') userAnsStr = String.fromCharCode(65+userAns)+'. '+q.options[userAns];
  else if(q.type==='judge') userAnsStr = userAns?'正确':'错误';
  else userAnsStr = String(userAns||'');

  const correctAnsStr = q.type==='choice' ? String.fromCharCode(65+q.answer)+'. '+q.options[q.answer] : q.answer;

  errors.push({
    id: uid(),
    subject: subj,
    knowledgePoint: q.knowledgePoint,
    question: q.question + '\n（你的答案：'+userAnsStr+'）',
    answer: '正确答案：'+correctAnsStr + '\n\n【解题思路】'+q.hint.approach + '\n【易错点】'+q.hint.pitfall,
    errorType: '练习错题',
    reviewCount: 0,
    nextReviewDate: today,
    status: 'reviewing',
    practiceId: qid,
    createdAt: new Date().toISOString()
  });
  save(SK.errors, errors);
  addPoints(3, 'add_error_practice', '从练习加入错题：'+q.knowledgePoint);
  toast('已加入错题本 +3积分，含综合提示','success');
}

function addStudyLog(subject, type, duration){
  const logs = load(SK.logs, []);
  const today = todayStr();
  // Find today's log for this subject
  let existing = logs.find(l=>l.date===today && l.subject===subject && l.type===type);
  if(existing){
    existing.duration += duration;
  } else {
    logs.push({id:uid(), date:today, subject, duration, type, createdAt:new Date().toISOString()});
  }
  save(SK.logs, logs);
  updateStreak();
}

// ===== Data Export/Import =====
function exportData(){
  const data = {};
  Object.values(SK).forEach(k=>{
    const v = _lsGet(k);
    if(v) data[k] = JSON.parse(v);
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '学习工作台备份_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('备份已导出','success');
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      Object.entries(data).forEach(([k,v])=>{
        if(Object.values(SK).includes(k)){
          _lsSet(k, JSON.stringify(v));
        }
      });
      toast('数据已恢复','success');
      switchTab('today');
    }catch(err){
      toast('文件格式错误','error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

let NEWS_POOL = NEWS_ITEMS;
let KNOWLEDGE_POOL = KNOWLEDGE_ARTICLES;
const INFO_BOARDS = {
  news: { pool:NEWS_POOL, tips:NEWS_TIPS, cats:NEWS_CATS, catColor:NEWS_CAT_COLOR, readSK:SK.newsRead, emoji:'📰', bannerLabel:'今日新闻精选', tipLabel:'今日看新闻小提示' },
  knowledge: { pool:KNOWLEDGE_POOL, tips:KNOWLEDGE_TIPS, cats:KNOWLEDGE_CATS, catColor:NEWS_CAT_COLOR, readSK:SK.knowledgeRead, emoji:'💡', bannerLabel:'今日常识', tipLabel:'今日小常识' }
};
const infoState = { news:{cat:'全部',search:''}, knowledge:{cat:'全部',search:''} };

function seededNewsShuffle(arr, seed){
  const a = arr.slice();
  let s = seed >>> 0;
  for(let i=a.length-1;i>0;i--){
    s = (Math.imul(s,1664525) + 1013904223) >>> 0;
    const j = s % (i+1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function getDailyInfo(kind){
  const cfg = INFO_BOARDS[kind];
  const dateStr = todayStr();
  let h = 2166136261;
  for(let i=0;i<dateStr.length;i++){ h ^= dateStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  h = h >>> 0;
  const picks = seededNewsShuffle(cfg.pool, h);
  return { date:dateStr, featured:picks[0], tip:cfg.tips[h % cfg.tips.length] };
}
function renderInfoBoard(kind){
  const cfg = INFO_BOARDS[kind];
  const st = infoState[kind];
  const dn = getDailyInfo(kind);
  const read = load(cfg.readSK, []);

  let html = '<div class="news-daily-banner">'
    + '<div class="ndb-left"><span class="ndb-badge">'+cfg.emoji+' '+escHtml(cfg.bannerLabel)+'</span>'
    + '<div style="min-width:0"><div class="ndb-title">'+escHtml(dn.featured.title)+'</div>'
    + '<div class="ndb-meta">'+dn.featured.category+' · 约'+dn.featured.readMin+'分钟 · 今日已读 '+todayRead+' 篇</div>'
    + '<div class="ndb-tip">'+escHtml(dn.tip)+'</div></div></div>'
    + '<button class="btn btn-primary btn-sm" onclick="openInfoArticle(\''+kind+'\',\''+dn.featured.id+'\')">开始阅读</button>'
    + '</div>';

  html += '<div class="news-toolbar">'
    + '<input class="news-search" id="'+kind+'-search" placeholder="🔍 搜索感兴趣的内容…" value="'+escAttr(st.search)+'" oninput="infoState[\''+kind+'\'].search=this.value;renderInfoGrid(\''+kind+'\')">'
    + '<div class="news-cats">';
  ['全部'].concat(cfg.cats).forEach(c=>{
    html += '<button class="news-cat" data-cat="'+escAttr(c)+'" data-kind="'+kind+'" onclick="infoState[\''+kind+'\'].cat=\''+escAttr(c)+'\';renderInfoGrid(\''+kind+'\')">'+escHtml(c)+'</button>';
  });
  html += '</div></div>';

  html += '<div class="news-grid" id="'+kind+'-grid"></div>';
  const root = document.getElementById('tab-'+kind);
  root.innerHTML = html;
  renderInfoGrid(kind);
}
function renderInfoGrid(kind){
  const cfg = INFO_BOARDS[kind];
  const st = infoState[kind];
  const dn = getDailyInfo(kind);
  const read = load(cfg.readSK, []);
  const readSet = new Set(read.map(r=>r.id));

  let list = cfg.pool.slice();
  if(st.cat!=='全部') list = list.filter(a=>a.category===st.cat);
  if(st.search){
    const q = st.search.toLowerCase();
    list = list.filter(a=>(a.title+a.summary+a.category).toLowerCase().includes(q));
  }
  list.sort((a,b)=> (b.id===dn.featured.id?1:0) - (a.id===dn.featured.id?1:0));

  let html = '';
  if(list.length===0){
    html = '<div class="empty-state" style="grid-column:1/-1"><p>没有找到相关内容，换个关键词试试～</p></div>';
  } else {
    list.forEach(a=>{
      const isRead = readSet.has(a.id);
      const isFeat = a.id===dn.featured.id;
      html += '<div class="news-card '+(isFeat?'featured':'')+'" onclick="openInfoArticle(\''+kind+'\',\''+a.id+'\')">'
        + '<div class="news-card-top"><span class="news-tag" style="background:'+cfg.catColor[a.category]+'">'+escHtml(a.category)+'</span>'
        + (isFeat?'<span class="news-feat-flag">今日推荐</span>':'')
        + (isRead?'<span class="news-read-flag">✓ 已读</span>':'')
        + '</div>'
        + '<div class="news-card-title">'+escHtml(a.title)+'</div>'
        + '<div class="news-card-summary">'+escHtml(a.summary)+'</div>'
        + '<div class="news-card-foot">⏱ 约'+a.readMin+'分钟阅读</div>'
        + '</div>';
    });
  }
  const grid = document.getElementById(kind+'-grid');
  if(grid) grid.innerHTML = html;
  document.querySelectorAll('.news-cat[data-kind="'+kind+'"]').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-cat')===st.cat);
  });
}
function openInfoArticle(kind, id){
  const cfg = INFO_BOARDS[kind];
  const a = cfg.pool.find(x=>x.id===id);
  if(!a) return;
  const read = load(cfg.readSK, []);
  const isRead = read.some(r=>r.id===id);
  let body = '';
  (a.paras||[]).forEach(p=> body += '<p>'+escHtml(p)+'</p>');
  const html = '<div class="modal-header"><h3>'+escHtml(a.title)+'</h3><button class="modal-close" onclick="closeModal()">×</button></div>'
    + '<div class="news-detail-meta"><span class="news-tag" style="background:'+cfg.catColor[a.category]+'">'+escHtml(a.category)+'</span> · 约'+a.readMin+'分钟阅读</div>'
    + '<div class="news-detail-body">'+body+'</div>'
    + '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">'
    + '<button class="btn btn-outline" onclick="closeModal()">关闭</button>'
    + '<button class="btn btn-primary" onclick="markInfoRead(\''+kind+'\',\''+a.id+'\')">'+(isRead?'已读 ✓ 再读一遍':'标记已读 +5积分')+'</button>'
    + '</div>';
  showModal(html);
}
function markInfoRead(kind, id){
  const cfg = INFO_BOARDS[kind];
  const a = cfg.pool.find(x=>x.id===id);
  const read = load(cfg.readSK, []);
  if(!read.some(r=>r.id===id)){
    read.unshift({date:todayStr(), id:id, category:a?a.category:''});
    save(cfg.readSK, read);
    addPoints(5, 'info_read', '阅读：'+(a?a.title:id));
    toast('阅读完成，+5 积分 '+(kind==='news'?'📰':'💡'),'success');
  } else {
    toast('这篇你已经读过啦，温故而知新～','info');
  }
  closeModal();
  if(kind==='news') renderNews(); else renderKnowledge();
}
function renderNews(){ renderInfoBoard('news'); }
function renderKnowledge(){ renderInfoBoard('knowledge'); }

// ===== 联网自动更新内容（Remote Content Update） =====
// 机制：安装包内置一份内容池；应用每次启动会联网拉取最新内容(JSON)并合并（同 id 覆盖、新 id 追加）。
// 联网失败或离线时，自动回退到内置内容，不影响使用。
// 原生 Android 层负责联网下载，再调用 window.__applyRemoteContent(json) 合并并刷新界面。
// 网页自身也会尝试用 CONTENT_URL 拉取（需服务器允许跨域 Access-Control-Allow-Origin:*），作为免编程打包的备选。
let REMOTE = null;
const CONTENT_URL = 'https://example.com/study/content-girl.json';
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _sanitizeNode(v){
  if(typeof v==='string') return escHtml(v);
  if(Array.isArray(v)) return v.map(_sanitizeNode);
  if(v && typeof v==='object'){ var o={}; for(var k in v){ o[k]=_sanitizeNode(v[k]); } return o; }
  return v;
}
function mergeById(base, extra){
  var arr=(base||[]).slice(), map={};
  arr.forEach(function(x){ if(x&&x.id) map[x.id]=x; });
  (extra||[]).forEach(function(x){ if(x&&x.id) map[x.id]=x; });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function mergeStrings(base, extra){
  var set={};
  (base||[]).forEach(function(s){ if(s!=null) set[s]=1; });
  (extra||[]).forEach(function(s){ if(s!=null) set[s]=1; });
  return Object.keys(set);
}
function mergeQuestions(base, extra){
  var out={}; for(var k in (base||{})) out[k]=(base[k]||[]).slice();
  for(var k2 in (extra||{})){
    if(!out[k2]) out[k2]=[];
    var map={}; out[k2].forEach(function(q){ if(q&&q.id) map[q.id]=q; });
    (extra[k2]||[]).forEach(function(q){ if(q&&q.id) map[q.id]=q; });
    out[k2]=Object.keys(map).map(function(id){ return map[id]; });
  }
  return out;
}
function applyRemoteContent(d, doRender){
  if(!d || typeof d!=='object') return;
  REMOTE = d;
  save(SK.remote, d);
  // 新闻：远程提供了来自人民日报的新闻则整池替换；否则沿用内置 NEWS_ITEMS 作为离线兜底
  NEWS_POOL = (d.news && d.news.length) ? d.news : NEWS_ITEMS;
  KNOWLEDGE_POOL = mergeById(KNOWLEDGE_ARTICLES, d.knowledge);
  QUESTION_BANK = mergeQuestions(QB_EMBED, d.questions);
  NEWS_TIPS = mergeStrings(NT_EMBED, d.newsTips);
  KNOWLEDGE_TIPS = mergeStrings(KT_EMBED, d.knowledgeTips);
  HOME_WELCOME = mergeStrings(HW_EMBED, d.homeWelcome);
  COOK_TIPS = mergeStrings(CT_EMBED, d.cookTips);
  DEFAULT_RECIPES = mergeById(DR_EMBED, d.recipes);
  mergeRemoteRecipesIntoStore(d.recipes);
  // 同步到展示配置（INFO_BOARDS 持有初始引用，必须显式回写，否则界面不刷新）
  INFO_BOARDS.news.pool = NEWS_POOL;
  INFO_BOARDS.news.tips = NEWS_TIPS;
  INFO_BOARDS.knowledge.pool = KNOWLEDGE_POOL;
  INFO_BOARDS.knowledge.tips = KNOWLEDGE_TIPS;
  if(doRender){ safeRerender(); }
}
function safeRerender(){
  try{ renderToday(); }catch(e){}
  try{ if(typeof renderNews==='function') renderNews(); }catch(e){}
  try{ if(typeof renderKnowledge==='function') renderKnowledge(); }catch(e){}
  try{ if(typeof renderCooking==='function') renderCooking(); }catch(e){}
}
function mergeRemoteRecipesIntoStore(remoteRecipes){
  if(!remoteRecipes || !remoteRecipes.length) return;
  var store = load(SK.recipes, DEFAULT_RECIPES);
  var map={}; store.forEach(function(r){ if(r&&r.id) map[r.id]=r; });
  remoteRecipes.forEach(function(r){ if(r&&r.id) map[r.id]=r; });
  save(SK.recipes, Object.keys(map).map(function(k){ return map[k]; }));
}
window.__applyRemoteContent = function(jsonStr){
  try{ var d=_sanitizeNode(JSON.parse(jsonStr)); applyRemoteContent(d, true); }
  catch(e){ console.error('applyRemoteContent parse', e); }
};
function webFetchRemote(){
  if(typeof fetch!=='function' || !CONTENT_URL) return;
  try{
    var _u = CONTENT_URL + (CONTENT_URL.indexOf('?')>=0 ? '&' : '?') + '_=' + Date.now();
    fetch(_u, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      applyRemoteContent(_sanitizeNode(d), true);
    }).catch(function(){});
  }catch(e){}
}
// 内置内容引用（每次都从内置重新合并，保证幂等）
const QB_EMBED = QUESTION_BANK;
const NT_EMBED = NEWS_TIPS;
const KT_EMBED = KNOWLEDGE_TIPS;
const HW_EMBED = HOME_WELCOME;
const DR_EMBED = DEFAULT_RECIPES;
const CT_EMBED = COOK_TIPS;

// 启动：先合并已缓存的远程内容（不重渲染），再尝试联网拉取最新
(function(){
  var cached = load(SK.remote, null);
  if(cached) applyRemoteContent(cached, false);
  webFetchRemote();
})();
initDefaultData();
renderToday();
updatePointsBadge();
checkAchievements();
checkDailyChallenges();

if(allErrors.length >= 30){
  setTimeout(()=>toast('数据已积累'+allErrors.length+'条错题，建议导出备份','warning'), 2000);
}
