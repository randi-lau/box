0,"hint":{"approach":"问“什么科目”用What。回答是Math（数学），说明问的是事物。","pitfall":"What问事物，Where问地点，Who问人，When问时间，根据答句判断。","extension":"疑问词选择看答句：答事物→What，答地点→Where，答人→Who，答时间→When。"}}],"科学":[{"id":"s1","type":"choice","difficulty":"基础","knowledgePoint":"植物与光合作用","question":"植物进行光合作用的主要场所是？","options":["根","茎","叶","花"],"answer":2,"hint":{"approach":"叶肉细胞中的叶绿体是光合作用的场所，叶片是主要器官。","pitfall":"光合作用在叶绿体（叶）中进行，不是根；呼吸作用在几乎所有活细胞进行。","extension":"光合作用：二氧化碳+水→（光/叶绿体）→有机物+氧气，是地球上氧气的主要来源。"}},{"id":"s2","type":"choice","difficulty":"基础","knowledgePoint":"声音","question":"声音不能在下列哪种环境中传播？","options":["空气","水","铁管","真空"],"answer":3,"hint":{"approach":"声音传播需要介质，真空不能传声。","pitfall":"固体、液体、气体都能传声，且固体传声最快；真空不行。","extension":"声速：固体大于液体大于气体；真空不传声，所以太空里听不到声音。"}},{"id":"s3","type":"choice","difficulty":"中等","knowledgePoint":"地球运动","question":"地球上产生昼夜交替现象的原因是？","options":["地球公转","地球自转","月球挡光","太阳发光"],"answer":1,"hint":{"approach":"地球自转（约24小时一圈）使地球表面昼夜不断交替。","pitfall":"昼夜交替是自转造成的；公转造成四季变化和正午太阳高度变化。","extension":"自转→昼夜交替、时差；公转→四季、五带。"}},{"id":"s4","type":"choice","difficulty":"中等","knowledgePoint":"物质变化","question":"下列变化属于化学变化的是？","options":["冰融化","纸撕碎","铁钉生锈","水蒸发"],"answer":2,"hint":{"approach":"化学变化有新物质生成，铁生锈生成氧化铁是新物质。","pitfall":"状态、形状改变（熔化、撕碎、蒸发）一般是物理变化，无新物质。","extension":"判断物理/化学变化关键看是否生成新物质。"}},{"id":"s5","type":"choice","difficulty":"中等","knowledgePoint":"食物链","question":"“草→兔→狐”这条食物链中，生产者是？","options":["草","兔","狐","都不是"],"answer":0,"hint":{"approach":"食物链从绿色植物（生产者）开始，草能光合作用制造有机物，是生产者。","pitfall":"生产者一定是植物（能自己制造食物），兔和狐是消费者。","extension":"食物链：生产者→初级消费者→次级消费者；箭头表示能量流动方向。"}}],"道法":[{"id":"d1","type":"choice","difficulty":"基础","knowledgePoint":"宪法","question":"我国的根本法是？","options":["刑法","宪法","未成年人保护法","民法典"],"answer":1,"hint":{"approach":"宪法是根本法，具有最高法律效力，是其他法律的立法基础。","pitfall":"宪法不是普通法律，它的效力最高，其他法律不能和它相抵触。","extension":"宪法规定国家根本制度和公民基本权利，是“母法”。"}},{"id":"d2","type":"choice","difficulty":"基础","knowledgePoint":"公民权利与义务","question":"下列属于公民基本权利的是？","options":["依法纳税","受教育","保守国家秘密","遵守法律"],"answer":1,"hint":{"approach":"受教育既是权利也是义务；纳税、保密、守法都是义务。","pitfall":"分清权利和义务：权利可以“享有”，义务必须“履行”。","extension":"权利与义务一致：享受权利的同时必须履行义务。"}},{"id":"d3","type":"choice","difficulty":"中等","knowledgePoint":"国家机关","question":"我国最高国家权力机关是？","options":["国务院","全国人民代表大会","最高人民法院","中央军事委员会"],"answer":1,"hint":{"approach":"全国人民代表大会是最高国家权力机关，行使立法权等。","pitfall":"国务院是最高行政机关，不是权力机关；法院是审判机关。","extension":"人大（权力机关）产生政府（行政）、法院（审判）、检察院（检察），并监督它们。"}},{"id":"d4","type":"choice","difficulty":"中等","knowledgePoint":"环境保护","question":"“绿水青山就是金山银山”强调？","options":["多砍树多赚钱","保护环境就是保护生产力","经济发展比环境重要","少种树多建厂"],"answer":1,"hint":{"approach":"这句话强调生态保护与经济发展可以共赢，保护环境就是保护生产力。","pitfall":"不能把环境和经济对立起来，也不是只要经济不要环境。","extension":"生态文明理念：坚持绿色发展，人与自然和谐共生。"}}],"音乐":[{"id":"mu1","type":"choice","difficulty":"基础","knowledgePoint":"音符时值","question":"下列音符中时值最长的是？","options":["四分音符","二分音符","八分音符","全音符"],"answer":3,"hint":{"approach":"全音符时值最长（4拍），依次是二分（2拍）、四分（1拍）、八分（半拍）。","pitfall":"音符“尾巴”越多时值越短；全音符没有符干时值最短。","extension":"时值关系：全=2个二分=4个四分=8个八分。"}},{"id":"mu2","type":"choice","difficulty":"基础","knowledgePoint":"拍号","question":"4/4拍表示？","options":["每小节4拍，四分音符为一拍","每小节2拍","每小节3拍","强弱弱循环"],"answer":0,"hint":{"approach":"拍号分母表示以什么音符为一拍（4=四分音符），分子表示每小节几拍（4拍）。","pitfall":"分母不是“每小节几拍”，分子才是；4/4读“四四拍”。","extension":"常见拍号：2/4（进行曲感）、3/4（圆舞曲感）、4/4（平稳）。"}},{"id":"mu3","type":"choice","difficulty":"中等","knowledgePoint":"民族乐器","question":"下列属于民族乐器的是？","options":["小提琴","钢琴","二胡","萨克斯"],"answer":2,"hint":{"approach":"二胡是中国传统拉弦乐器，属于民族乐器。","pitfall":"小提琴、钢琴、萨克斯都是西洋乐器。","extension":"民族乐器分类：拉弦（二胡、京胡）、弹拨（古筝、琵琶）、吹管（笛子、唢呐）、打击（鼓、锣）。"}}],"美术":[{"id":"ar1","type":"choice","difficulty":"基础","knowledgePoint":"三原色","question":"美术中的颜料三原色是？","options":["红黄蓝","红绿蓝","黑白灰","橙紫绿"],"answer":0,"hint":{"approach":"颜料三原色是红、黄、蓝，能调配出大部分颜色。","pitfall":"光的三原色是红绿蓝（RGB），颜料三原色是红黄蓝，别混淆。","extension":"红+黄=橙，黄+蓝=绿，红+蓝=紫，三原色两两混合得三间色。"}},{"id":"ar2","type":"choice","difficulty":"基础","knowledgePoint":"透视","question":"画一条笔直的马路向远方延伸，路面看起来会？","options":["越来越宽","越来越窄最终汇于一点","保持不变","先宽后窄"],"answer":1,"hint":{"approach":"近大远小、近宽远窄，平行线最终汇聚于“消失点”，这是透视现象。","pitfall":"不是越来越宽，也不是不变；越远越窄并汇聚。","extension":"透视让画面有空间感和纵深感，是绘画表现立体感的重要方法。"}},{"id":"ar3","type":"choice","difficulty":"中等","knowledgePoint":"中国画","question":"下列属于中国画特点的是？","options":["讲究明暗光影如照片","以线条和水墨为主，讲究意境","只用油画颜料","必须画得很写实"],"answer":1,"hint":{"approach":"中国画以笔墨线条造型，重神似和意境，与西方写实油画不同。","pitfall":"中国画不追求像照片般的明暗光影，而重“气韵生动”。","extension":"中国画工具：毛笔、宣纸、墨；题材分山水、花鸟、人物。"}}],"体育":[{"id":"pe1","type":"choice","difficulty":"基础","knowledgePoint":"田径项目","question":"下列项目中属于田赛（比高度或远度）的是？","options":["100米跑","跳高","400米跑","接力跑"],"answer":1,"hint":{"approach":"田赛是以高度或远度计算成绩的项目（跳高、跳远、投掷）；径赛是跑。","pitfall":"100米、400米、接力都是径赛（比速度），跳高是田赛。","extension":"田径分径赛（跑、走）和田赛（跳、投），全能包含二者。"}},{"id":"pe2","type":"choice","difficulty":"基础","knowledgePoint":"运动安全","question":"体育锻炼前做准备活动的主要目的是？","options":["消耗体力","活动关节、预防受伤","少出汗","拖延时间"],"answer":1,"hint":{"approach":"准备活动让肌肉、关节活动开，提高协调性，预防运动损伤。","pitfall":"不是为消耗体力或拖延，而是科学热身保护身体。","extension":"运动三步曲：准备活动→正式锻炼→放松整理，缺一不可。"}},{"id":"pe3","type":"choice","difficulty":"中等","knowledgePoint":"篮球规则","question":"篮球比赛中，普通两分投篮（三分线内）命中一般得几分？","options":["1分","2分","3分","4分"],"answer":1,"hint":{"approach":"三分线内普通投篮命中得2分，三分线外得3分，罚球得1分。","pitfall":"不是所有进球都3分；只有三分线外命中才是3分。","extension":"篮球得分：三分线内2分、线外3分、罚球1分；犯规会影响罚球。"}}],"信息技术":[{"id":"it1","type":"choice","difficulty":"基础","knowledgePoint":"计算机组成","question":"计算机中负责运算和控制的“大脑”是？","options":["显示器","中央处理器(CPU)","键盘","音箱"],"answer":1,"hint":{"approach":"CPU（中央处理器）是计算机的核心，负责运算和控制。","pitfall":"显示器是输出设备，键盘是输入设备，都不负责运算。","extension":"计算机硬件：运算器+控制器(CPU)、存储器、输入设备、输出设备。"}},{"id":"it2","type":"choice","difficulty":"基础","knowledgePoint":"信息辨别","question":"在网上看到“转发就送手机”的信息，正确做法是？","options":["立刻转发","先核实来源，不轻信","填上个人信息领奖","拉黑好友"],"answer":1,"hint":{"approach":"网络信息良莠不齐，应先核实来源、辨别真伪，不盲目转发或泄露个人信息。","pitfall":"天上不会掉馅饼，这类多为诈骗或谣言，勿轻信、勿泄露隐私。","extension":"网络安全：不轻信、不泄露个人信息、不传播谣言、防诈骗。"}},{"id":"it3","type":"choice","difficulty":"中等","knowledgePoint":"文件管理","question":"把“报告.docx”重命名为“总结.docx”后，文件内容会？","options":["丢失","不变","变成图片","自动删除"],"answer":1,"hint":{"approach":"重命名只改变文件名称，不改变文件内容和类型。","pitfall":"改名不会破坏内容；只有删除、覆盖才会丢失数据。","extension":"文件管理好习惯：分类建文件夹、命名清晰、重要文件及时备份。"}}],"五年级复习":[{"id":"r5_1","type":"choice","difficulty":"基础","knowledgePoint":"复习·小数分数运算","question":"计算 0.25 + 3/4 = ？","options":["1","0.9","1.1","0.75"],"answer":0,"hint":{"approach":"0.25=1/4，1/4+3/4=1。","pitfall":"小数和分数混算要先统一形式，别直接把数字相加。","extension":"五年级重点：小数、分数、整数的四则混合运算与简便运算。"}},{"id":"r5_2","type":"choice","difficulty":"基础","knowledgePoint":"复习·面积周长","question":"边长4厘米的正方形，面积和周长分别是？","options":["16平方厘米、16厘米","16平方厘米、8厘米","8平方厘米、16厘米","16平方厘米、4厘米"],"answer":0,"hint":{"approach":"面积=边长×边长=16平方厘米；周长=4×边长=16厘米。","pitfall":"面积和周长单位不同（平方厘米 vs 厘米），数值可能相同但意义不同。","extension":"长方形面积=长×宽，周长=2×(长+宽)。"}},{"id":"r5_3","type":"choice","difficulty":"中等","knowledgePoint":"复习·英语时态","question":"She usually ___ her homework in the evening.","options":["do","does","did","doing"],"answer":1,"hint":{"approach":"usually 表经常，主语 She 三单，动词 do→does。","pitfall":"别忘了第三人称单数加 -es。","extension":"五年级重点：一般现在时三单、There be、常见介词。"}},{"id":"r5_4","type":"choice","difficulty":"基础","knowledgePoint":"复习·古诗默写","question":"苏轼《饮湖上初晴后雨》中'欲把西湖比西子'的下一句是？","options":["淡妆浓抹总相宜","山色空蒙雨亦奇","水光潋滟晴方好","欲把西湖比西子"],"answer":0,"hint":{"approach":"苏轼写西湖的名句，把西湖比作美人西施。","pitfall":"“抹”不要写成“墨”；“相宜”不要写成“相依”。","extension":"五年级要背熟的课内古诗文，是六年级文言文学习的基础。"}}],"六年级预习":[{"id":"r6_1","type":"choice","difficulty":"中等","knowledgePoint":"预习·分数乘除","question":"3/4 × 2/3 = ？","options":["1/2","5/7","6/7","1/4"],"answer":0,"hint":{"approach":"分子乘分子、分母乘分母：3×2 / 4×3 = 6/12 = 1/2。","pitfall":"分数乘法是“分子分母分别乘”，不是加减那样通分。","extension":"六年级上册重点：分数乘除法、比和比例、百分数。"}},{"id":"r6_2","type":"choice","difficulty":"中等","knowledgePoint":"预习·圆","question":"直径6厘米的圆，周长是？（π取3.14）","options":["9.42厘米","18.84厘米","28.26厘米","37.68厘米"],"answer":1,"hint":{"approach":"半径=3厘米，周长=2πr=2×3.14×3=18.84厘米。","pitfall":"注意给的是直径，要先除以2得半径；别把周长和面积公式混了。","extension":"圆是新内容：周长C=2πr=πd，面积S=πr²。"}},{"id":"r6_3","type":"choice","difficulty":"中等","knowledgePoint":"预习·一般过去时","question":"He ___ to the park yesterday.","options":["go","goes","went","going"],"answer":2,"hint":{"approach":"yesterday 表过去，go 的过去式是 went。","pitfall":"规则动词加 -ed，但 go 是不规则变化 went。","extension":"六年级会学更多时态：一般过去时、现在进行时等。"}},{"id":"r6_4","type":"choice","difficulty":"提高","knowledgePoint":"预习·比和比例","question":"若 2:3 = 4:x，则 x = ？","options":["5","6","8","9"],"answer":1,"hint":{"approach":"内项积=外项积：2x=3×4=12，x=6。","pitfall":"解比例用“交叉相乘相等”，别直接加减。","extension":"比和比例是六年级上册重点，也是初中函数的基础。"}}]},"初中":{"数学":[{"id":"m1","type":"choice","difficulty":"基础","knowledgePoint":"一次函数","question":"已知一次函数 y = 2x - 3，当 y = 5 时，x 的值为？","options":["x = 1","x = 4","x = 3","x = 2"],"answer":1,"hint":{"approach":"将 y = 5 代入 y = 2x - 3，得到方程 2x - 3 = 5，移项得 2x = 8，x = 4。","pitfall":"移项时必须变号！2x - 3 = 5 → 2x = 5 + 3 = 8，不是 2x = 5 - 3 = 2。常见错误：忘记变号导致 x = 1（误选A）。","extension":"一次函数 y = kx + b 中，k 决定斜率（倾斜方向），b 决定与 y 轴交点。求 x 值本质是解一元一次方程。"}},{"id":"m2","type":"choice","difficulty":"基础","knowledgePoint":"勾股定理","question":"直角三角形两直角边分别为 3 和 4，斜边长为？","options":["5","6","7","√7"],"answer":0,"hint":{"approach":"勾股定理：a² + b² = c²，即 3² + 4² = 9 + 16 = 25，c = √25 = 5。","pitfall":"注意是两直角边的平方和等于斜边的平方，不是直接相加（3+4=7是错的）。必须先平方、再相加、最后开方。","extension":"勾股数常见的有：(3,4,5)、(5,12,13)、(6,8,10)、(8,15,17)。记住这些常用组合可以加快计算速度。"}},{"id":"m3","type":"choice","difficulty":"基础","knowledgePoint":"实数","question":"下列各数中，属于无理数的是？","options":["√4","22/7","√2","3.14"],"answer":2,"hint":{"approach":"无理数是无限不循环小数。√4 = 2（有理数），22/7 是分数（有理数），3.14 是有限小数（有理数），√2 ≈ 1.414... 是无限不循环小数（无理数）。","pitfall":"不要把 22/7 当作无理数！虽然 22/7 ≈ 3.142857... 看起来像 π，但它是分数，是有理数。同样 3.14 ≠ π，3.14 是有理数。","extension":"无理数常见类型：①含π的式子（如π/2）②开方开不尽的数（如√2、√3）③无限不循环小数（如0.1010010001...）。"}},{"id":"m4","type":"choice","difficulty":"中等","knowledgePoint":"一次函数图像","question":"一次函数 y = -2x + 4 的图象经过哪几个象限？","options":["第一、二、四象限","第一、二、三象限","第二、三、四象限","第一、三、四象限"],"answer":0,"hint":{"approach":"k = -2 < 0，图象从左到右下降；b = 4 > 0，与 y 轴交于正半轴。过点 (0,4) 和 (2,0)，图象经过第一、二、四象限。","pitfall":"判断象限要看 k 和 b 的符号：k > 0 且 b > 0 → 一二三象限；k < 0 且 b > 0 → 一二四象限；k > 0 且 b < 0 → 一三四象限；k < 0 且 b < 0 → 二三四象限。","extension":"快速判断法：k 决定走向（正上坡/负下坡），b 决定截距位置。画草图是最直观的验证方法。"}},{"id":"m5","type":"choice","difficulty":"中等","knowledgePoint":"二次根式","question":"若 √(x-2) 有意义，则 x 的取值范围是？","options":["x ≥ 2","x > 2","x ≤ 2","x ≥ 0"],"answer":0,"hint":{"approach":"二次根式 √a 有意义的条件是被开方数 a ≥ 0。这里 a = x - 2，所以 x - 2 ≥ 0，解得 x ≥ 2。","pitfall":"注意是\"大于等于\"不是\"大于\"！√(x-2) 当 x = 2 时，√0 = 0 是有意义的。不要漏掉等号。","extension":"分式有意义的条件是分母≠0；二次根式有意义的条件是被开方数≥0；两者结合时要同时满足所有条件。"}},{"id":"m6","type":"choice","difficulty":"基础","knowledgePoint":"二元一次方程组","question":"方程组 x + y = 5，x - y = 1 的解是？","options":["x = 3，y = 2","x = 2，y = 3","x = 4，y = 1","x = 1，y = 4"],"answer":0,"hint":{"approach":"两式相加：(x+y) + (x-y) = 5+1 → 2x = 6 → x = 3。代入 x+y=5 → 3+y=5 → y = 2。","pitfall":"加减消元时注意符号！两式相加时 (x+y)+(x-y) = 2x，y 被消掉；如果相减则消掉 x。验证：3+2=5 ✓，3-2=1 ✓。","extension":"消元法有加减消元和代入消元两种。当系数简单时用加减消元更快；当某个变量系数为1时，代入消元也很方便。"}},{"id":"m7","type":"choice","difficulty":"中等","knowledgePoint":"平行四边形","question":"平行四边形不具有的性质是？","options":["对边相等","对角相等","对角线互相平分","对角线相等"],"answer":3,"hint":{"approach":"平行四边形的性质：对边平行且相等、对角相等、对角线互相平分。对角线相等是矩形的性质，不是一般平行四边形的性质。","pitfall":"容易混淆各种四边形的性质！平行四边形→对角线互相平分；矩形→对角线互相平分且相等；菱形→对角线互相垂直平分；正方形→兼具以上所有性质。","extension":"四边形关系链：平行四边形 → 矩形/菱形 → 正方形。每增加一个条件，性质就多一层。"}},{"id":"m8","type":"choice","difficulty":"提高","knowledgePoint":"一次函数应用","question":"甲乙两人从A地出发去B地，甲速度4km/h，乙速度6km/h。甲先出发1小时，乙出发后几小时能追上甲？","options":["2小时","3小时","1.5小时","2.5小时"],"answer":0,"hint":{"approach":"设乙出发 t 小时后追上甲。此时甲已走了 (t+1) 小时，路程 = 4(t+1)；乙走了 t 小时，路程 = 6t。追上时路程相等：4(t+1) = 6t → 4t+4 = 6t → 2t = 4 → t = 2。","pitfall":"注意甲比乙多走了1小时！甲的时间是 (t+1) 不是 t。追及问题的核心是：两人路程相等时追上。","extension":"追及问题公式：追及时间 = 路程差 ÷ 速度差。这里路程差 = 甲先走的4km，速度差 = 6-4 = 2km/h，t = 4/2 = 2小时。"}},{"id":"m9","type":"judge","difficulty":"基础","knowledgePoint":"数据的分析","question":"一组数据的中位数一定等于这组数据中的某个数。","answer":false,"hint":{"approach":"中位数是将数据按大小排列后，位于最中间的数。当数据个数为偶数时，中位数是中间两个数的平均值，可能不是原数据中的任何一个。","pitfall":"当数据个数是偶数时，中位数是中间两个数的平均值！例如 {1,2,3,4} 的中位数 = (2+3)/2 = 2.5，2.5 不在原数据中。","extension":"平均数、中位数、众数都是描述数据集中趋势的统计量。平均数受极端值影响大，中位数不受极端值影响，众数可能出现多个或没有。"}},{"id":"m10","type":"choice","difficulty":"提高","knowledgePoint":"因式分解","question":"多项式 x² - 5x + 6 因式分解的结果是？","options":["(x-2)(x-3)","(x+2)(x+3)","(x-1)(x-6)","(x-2)(x+3)"],"answer":0,"hint":{"approach":"对于 x² + bx + c 型，找两个数 p、q 使得 p+q = b 且 p×q = c。这里需要 p+q = -5，p×q = 6，即 p = -2，q = -3。所以 x² - 5x + 6 = (x-2)(x-3)。","pitfall":"符号容易错！-5x 意味着两个数都是负的，6 是正的说明同号。验证：(x-2)(x-3) = x²-3x-2x+6 = x²-5x+6 ✓。","extension":"十字相乘法是因式分解的核心方法。对于 ax²+bx+c 型，要找 pq = ac 且 p+q = b 的两个数，然后分组分解。"}}],"语文":[{"id":"y1","type":"choice","difficulty":"基础","knowledgePoint":"文言文虚词","question":"下列句子中\"之\"的用法与其他三项不同的是？","options":["何陋之有","水陆草木之花","予独爱莲之出淤泥而不染","无丝竹之乱耳"],"answer":0,"hint":{"approach":"\"何陋之有\"中\"之\"是宾语前置的标志，无实义；其余三项\"之\"均为结构助词\"的\"或用于主谓之间取消句子独立性。","pitfall":"\"之\"的常见用法：①代词（他/它）②结构助词\"的\"③宾语前置标志④主谓之间取消独立性⑤动词\"去/往\"。要结合语境逐一分析。","extension":"文言虚词\"之\"是中考高频考点。建议整理课文中所有含\"之\"的句子，分类标注用法，形成系统的知识网络。"}},{"id":"y2","type":"choice","difficulty":"基础","knowledgePoint":"古诗词鉴赏","question":"\"感时花溅泪，恨别鸟惊心\"运用的修辞手法是？","options":["比喻","拟人","夸张","对偶"],"answer":1,"hint":{"approach":"\"花溅泪\"\"鸟惊心\"赋予了花和鸟人的情感和动作，这是拟人手法。花不会流泪，鸟不会心惊，诗人借花鸟表达感时伤别之情。","pitfall":"这首诗中既有拟人也有对偶（花溅泪对鸟惊心），但题目问的是主要的修辞效果。拟人是核心手法，对偶是形式上的对称。如果题目问\"形式上的特点\"则选对偶。","extension":"杜甫《春望》全诗：\"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。\"表达了忧国思家之情。"}},{"id":"y3","type":"choice","difficulty":"基础","knowledgePoint":"古诗文默写","question":"《桃花源记》中描写桃源人生活和谐、安乐的句子是？","options":["黄发垂髫，并怡然自乐","土地平旷，屋舍俨然","阡陌交通，鸡犬相闻","芳草鲜美，落英缤纷"],"answer":0,"hint":{"approach":"①桃花源记中描写老人和小孩都快乐自在：黄发垂髫，并怡然自乐。②陋室铭开篇点题：斯是陋室，惟吾德馨。","pitfall":"易错字：①\"髫\"字容易写错（tiáo，儿童下垂的头发），\"怡\"不要写成\"治\"。②\"馨\"字下面是\"香\"，不要写成\"罄\"（空的意思）。\"惟\"不要写成\"唯\"。","extension":"古诗文默写是中考必考题，重点注意：①生僻字写法②同音字区分③句意理解。建议每天默写5句，错题反复练习。"}},{"id":"y4","type":"choice","difficulty":"中等","knowledgePoint":"现代文阅读","question":"《背影》中，作者多次写到父亲的背影，其主要作用是？","options":["表现父亲年迈体衰","作为线索贯穿全文，寄托深情","说明父亲不善言辞","为了引起读者同情"],"answer":1,"hint":{"approach":"朱自清《背影》中，\"背影\"是全文的线索，四次写到背影：第一次点题、第二次买橘时的背影（重点）、第三次离别时的背影、第四次泪光中的背影。每次都寄托着作者对父亲深沉的爱。","pitfall":"不能只看到表面的\"年迈体衰\"。文学作品中反复出现的意象通常具有线索作用和象征意义。要从结构和情感两个层面分析。","extension":"散文中\"线索\"的作用：①贯穿全文结构②寄托情感③推动叙事。《背影》以\"背影\"为线索，将四次回忆串联，情感层层递进。"}},{"id":"y5","type":"choice","difficulty":"基础","knowledgePoint":"成语运用","question":"下列句子中成语使用正确的是？","options":["他做事总是虎头蛇尾，从不敷衍了事","这段文章语句不通顺，简直是不刊之论","他的成绩一落千丈，令人刮目相看","博物馆里陈列的文物琳琅满目，美不胜收"],"answer":3,"hint":{"approach":"A\"虎头蛇尾\"指做事有始无终，与\"从不敷衍\"矛盾；B\"不刊之论\"指不可更改的言论（正确言论），不能用来形容语句不通；C\"刮目相看\"指用新眼光看人，不能用于成绩下降；D\"琳琅满目\"\"美不胜收\"都形容美好的事物很多，使用正确。","pitfall":"望文生义是成语题最大陷阱！\"不刊之论\"的\"刊\"是\"更改\"不是\"刊登\"，指不可更改的正确言论，不是\"不值得刊登的言论\"。","extension":"成语常见误用类型：①望文生义②褒贬误用③对象不当④语境不合。建议积累易错成语，特别是含有\"不\"字的成语（如不刊之论、不寒而栗、不以为然等）。"}},{"id":"y6","type":"choice","difficulty":"中等","knowledgePoint":"文言文翻译","question":"\"予独爱莲之出淤泥而不染\"的正确的翻译是？","options":["我唯独喜爱莲花从淤泥中长出却不被污染","我独自喜爱莲花出淤泥却不染色","我只爱莲花从泥里出来没有染上颜色","我单独喜欢莲花开在淤泥外面很干净"],"answer":0,"hint":{"approach":"\"予\"=我，\"独\"=唯独，\"爱\"=喜爱，\"之\"=主谓之间取消独立性（无实义），\"出淤泥\"=从淤泥中长出，\"而\"=却（转折），\"不染\"=不被污染（沾染）。整句：我唯独喜爱莲花从淤泥中长出却不被污染。","pitfall":"\"之\"在这里不是\"的\"而是用于主谓之间取消句子独立性，翻译时不译出！\"而\"表转折关系译为\"却\"不是\"而且\"。不能逐字死译，要理解整体句意。","extension":"文言翻译六字诀：\"留、删、换、调、补、意\"。留（保留专有名词）、删（删去虚词）、换（替换古今异义）、调（调整语序）、补（补充省略）、意（意译）。"}},{"id":"y7","type":"choice","difficulty":"中等","knowledgePoint":"病句修改","question":"修改病句：'通过这次实践活动，使我深受教育。' 正确的一项是？","options":["通过这次实践活动，我深受教育。","通过实践活动，使我深受教育。","这次实践活动，使我深受教育。","通过这次实践活动，深受教育。"],"answer":0,"hint":{"approach":"\"通过……使……\"是典型的缺主语病句。\"通过\"和\"使\"都是介词，导致句子没有主语。修改方法：删去\"通过\"或删去\"使\"，让句子有明确的主语。","pitfall":"这是中考高频病句类型！常见缺主语的句式：①\"通过……使……\"②\"经过……使……\"③\"由于……使……\"。修改时删去其中一个介词即可。","extension":"病句常见类型：①语序不当②搭配不当③成分残缺④结构混乱⑤表意不明⑥不合逻辑。识别病句要从语法结构入手，先找主谓宾再看修饰成分。"}},{"id":"y8","type":"choice","difficulty":"中等","knowledgePoint":"说明文阅读","question":"《中国石拱桥》中，作者说明赵州桥\"大拱\"的特点时使用的主要说明方法是？","options":["作比较","列数字","打比方","下定义"],"answer":1,"hint":{"approach":"课文原文：\"赵州桥非常雄伟，全长五十点八二米，两端宽九点六米，中部略窄，宽九米。\"使用了大量具体数据，这是列数字的说明方法。","pitfall":"不要把\"打比方\"和\"列数字\"混淆。打比方是用比喻来说明（如\"桥洞像虹\"），列数字是用具体数据说明。赵州桥部分以列数字为主，也有打比方。","extension":"常见说明方法及作用：①列数字——准确具体②作比较——突出特征③打比方——生动形象④举例子——具体可信⑤分类别——条理清楚。答题时要结合具体内容分析作用。"}}],"英语":[{"id":"e1","type":"choice","difficulty":"基础","knowledgePoint":"现在完成时","question":"He ___ (live) here since 2010. 选择正确形式：","options":["lived","has lived","is living","lives"],"answer":1,"hint":{"approach":"since 2010 表示从过去持续到现在，用现在完成时。主语 He 是第三人称单数，所以用 has + 过去分词 lived → has lived。","pitfall":"since + 时间点用现在完成时，for + 时间段也用现在完成时！不要用一般过去时（lived），因为动作持续到现在。区分：since 2010（时间点）vs for 13 years（时间段）。","extension":"现在完成时标志词：since + 过去时间点、for + 时间段、already/yet/just/ever/never。结构：have/has + 过去分词。"}},{"id":"e2","type":"choice","difficulty":"基础","knowledgePoint":"形容词比较级","question":"This box is ___ than that one.","options":["heavy","heavier","heaviest","more heavy"],"answer":1,"hint":{"approach":"than 是比较级标志词，需要用比较级。heavy 是重读闭音节结尾（辅音+y），变 y 为 i 加 er → heavier。","pitfall":"heavy 的比较级是 heavier 不是 more heavy！规则：①单音节词加 -er ②以 -y 结尾变 y 为 i 加 -er ③多音节词前加 more。heavy 虽然有两个音节但属于规则②。","extension":"比较级特殊变化：good→better，bad→worse，many→more，little→less，far→farther/further。这些需要单独记忆。"}},{"id":"e3","type":"choice","difficulty":"中等","knowledgePoint":"宾语从句","question":"Could you tell me ___?","options":["where is the post office","where the post office is","where was the post office","where the post office was"],"answer":1,"hint":{"approach":"宾语从句用陈述语序（主语+谓语），排除A和C。主句 Could you tell me 是委婉请求（并非过去时），从句用现在时即可，选 B。","pitfall":"宾语从句两大考点：①语序——必须用陈述语序（主语在前）②时态——主句现在时，从句按需要选；主句过去时，从句变相应过去时。Could you tell me 中的 could 是委婉用法不是过去时！","extension":"宾语从句连接词：①that（陈述句，可省略）②if/whether（一般疑问句）③wh-词（特殊疑问句）。语序永远是陈述语序。"}},{"id":"e4","type":"choice","difficulty":"基础","knowledgePoint":"词汇运用","question":"用所给词的适当形式填空：It is ___ (sun) today. Let's go out. 横线上应填？","options":["sunny","sun","suny","sunly"],"answer":0,"hint":{"approach":"①be动词后接形容词作表语，sun 的形容词形式是 sunny。②be interested in 是固定搭配，表示\"对……感兴趣\"，用 -ed 形式。","pitfall":"②区分 interested 和 interesting！interested 形容人的感受（感到有趣的），interesting 形容事物的特征（令人感兴趣的）。\"我对科学感兴趣\" → I am interested in science。\"科学很有趣\" → Science is interesting。","extension":"-ed 结尾形容词形容人（感到...的），-ing 结尾形容词形容物（令人...的）。如：bored/boring，excited/exciting，surprised/surprising。"}},{"id":"e5","type":"choice","difficulty":"中等","knowledgePoint":"被动语态","question":"The bridge ___ in 1980.","options":["built","was built","is built","has built"],"answer":1,"hint":{"approach":"桥是被建造的，用被动语态（be + 过去分词）。时间 1980 是过去时，所以用 was built。主语 The bridge 是单数。","pitfall":"注意主动还是被动！桥不能自己建造，是被建造的，所以用被动语态。时间点是过去（1980），用过去时的被动 was/were + 过去分词。","extension":"被动语态时态公式：①一般现在时 am/is/are + done ②一般过去时 was/were + done ③现在完成时 have/has been done ④含情态动词 can/must + be done。"}},{"id":"e6","type":"choice","difficulty":"中等","knowledgePoint":"动词不定式","question":"The teacher told us ___ in class.","options":["not to talk","to not talk","not talk","don't talk"],"answer":0,"hint":{"approach":"tell sb to do sth（告诉某人做某事），否定形式是 tell sb not to do sth。所以选 not to talk。","pitfall":"否定词 not 必须放在 to 的前面！不是 to not talk。这是常考固定结构。","extension":"后接 to do 的动词：want/decide/hope/plan/agree/offer/refuse + to do。后接 sb to do 的动词：tell/ask/allow/invite/want/teach + sb + to do。否定都在 to 前加 not。"}},{"id":"e7","type":"choice","difficulty":"提高","knowledgePoint":"定语从句","question":"The book ___ I bought yesterday is very interesting.","options":["that","what","who","where"],"answer":0,"hint":{"approach":"先行词 The book 是物，用 that 或 which 引导。what 不能引导定语从句，who 修饰人，where 修饰地点。选 that。","pitfall":"what 不能引导定语从句！what 只能引导名词性从句。先行词是物时用 that/which，是人时用 who/that，是地点时用 where，是时间时用 when。","extension":"只能用 that 的情况：①先行词被最高级修饰 ②先行词被 the only/the very 修饰 ③先行词是不定代词(all/everything等) ④先行词既包含人也包含物。"}},{"id":"e8","type":"choice","difficulty":"中等","knowledgePoint":"句型转换","question":"将 'People speak English in many countries.' 改为被动语态，正确的是？","options":["English is spoken in many countries.","English speaks in many countries.","English is speak in many countries.","English spoken in many countries."],"answer":0,"hint":{"approach":"原句一般现在时，主语 people 是复数。被动语态：English (主语) + is (be动词) + spoken (speak的过去分词)。English 是不可数名词，视为单数，用 is。","pitfall":"speak 的过去分词是 spoken 不是 spoked！不规则动词的过去分词需要单独记忆。另外注意主语变化后 be 动词的单复数：English → is，books → are。","extension":"被动语态转换步骤：①找出主动句的宾语→作被动句主语②判断时态→选择be动词形式③把主动词变为过去分词④必要时用by引出动作执行者。"}},{"id":"e9","type":"choice","difficulty":"基础","knowledgePoint":"日常交际","question":"— Would you mind my opening the window?\n— ___. It's a bit hot here.","options":["Of course not","Yes, please","You're welcome","Never mind"],"answer":0,"hint":{"approach":"\"Would you mind...\" 是委婉请求。回答\"不介意\"用 Of course not / Certainly not / Not at all。后文\"It's a bit hot\"表示同意开窗，所以不介意。","pitfall":"Would you mind 的回答容易搞反！不介意 → Of course not / Not at all（同意对方做）；介意 → Yes, you'd better not / I'm afraid...（不同意）。不能回答 Yes, please（矛盾）。","extension":"常见交际用语：①How about...? → Good idea/Sounds great ②May I...? → Sure/Of course ③Would you mind...? → Not at all/Of course not"}}],"物理":[{"id":"p1","type":"choice","difficulty":"基础","knowledgePoint":"力的合成","question":"两个力 F₁ = 3N 和 F₂ = 4N 同方向作用在同一物体上，合力为？","options":["1N","7N","5N","12N"],"answer":1,"hint":{"approach":"同方向的两个力，合力等于两个力之和：F = F₁ + F₂ = 3N + 4N = 7N。","pitfall":"同方向相加，反方向相减！如果两力方向相反，合力 = |F₁ - F₂| = |3-4| = 1N。不要混淆同向和反向的合力计算方法。","extension":"合力范围：|F₁ - F₂| ≤ F合 ≤ F₁ + F₂。当两力同向时合力最大，反向时合力最小。两力互相垂直时合力用勾股定理：F = √(F₁² + F₂²)。"}},{"id":"p2","type":"choice","difficulty":"基础","knowledgePoint":"重力","question":"一个质量为 5kg 的物体，受到的重力约为？（g取10N/kg）","options":["0.5N","5N","50N","500N"],"answer":2,"hint":{"approach":"重力公式 G = mg，m = 5kg，g = 10N/kg，G = 5 × 10 = 50N。","pitfall":"注意单位！质量的单位是 kg，重力的单位是 N，不要混淆。g = 10N/kg（或9.8N/kg）表示质量1kg的物体受到的重力是10N。","extension":"质量与重力的区别：①质量是物体含物质的多少，单位kg，不随位置变化②重力是地球对物体的吸引力，单位N，随位置（纬度、高度）变化。G = mg 是连接两者的桥梁。"}},{"id":"p3","type":"choice","difficulty":"中等","knowledgePoint":"牛顿第一定律","question":"关于惯性，下列说法正确的是？","options":["只有运动的物体才有惯性","惯性大小与速度有关","一切物体都有惯性","静止的物体没有惯性"],"answer":2,"hint":{"approach":"惯性是物体保持原有运动状态不变的性质，一切物体（无论运动还是静止）都有惯性。惯性大小只与质量有关，与速度无关。","pitfall":"惯性不是力！不能说\"受到惯性作用\"，应该说\"具有惯性\"。惯性大小只与质量有关，速度大不代表惯性大。静止的物体同样有惯性（保持静止的趋势）。","extension":"牛顿第一定律（惯性定律）：一切物体在没有受到外力作用时，总保持匀速直线运动状态或静止状态。惯性是物体的固有属性，质量越大惯性越大。"}},{"id":"p4","type":"choice","difficulty":"中等","knowledgePoint":"压强","question":"将一块砖平放、侧放、竖放在地面上，哪种放法对地面压强最大？","options":["平放","侧放","竖放","一样大"],"answer":2,"hint":{"approach":"压强公式 p = F/S。砖的重力不变，F 相同。竖放时受力面积 S 最小，所以压强 p 最大。","pitfall":"压力相同的情况下，受力面积越小，压强越大！不要认为压力大了压强就大——如果受力面积也大，压强不一定大。压强由压力和受力面积共同决定。","extension":"增大压强的方法：①增大压力②减小受力面积。减小压强的方法：①减小压力②增大受力面积。生活中：刀刃磨得很薄（减小面积增大压强）、铁轨铺枕木（增大面积减小压强）。"}},{"id":"p5","type":"choice","difficulty":"基础","knowledgePoint":"声现象","question":"下列关于声音的说法，正确的是？","options":["声音可以在真空中传播","声音的传播需要介质","声音在空气中传播最快","声音的音调与振幅有关"],"answer":1,"hint":{"approach":"声音的传播需要介质（气体、液体、固体），真空不能传声。声音在固体中传播最快、液体次之、气体最慢。音调与频率有关，响度与振幅有关。","pitfall":"区分音调、响度、音色！音调由频率决定（高低），响度由振幅决定（大小），音色由发声体材料决定（特色）。不要把音调和响度混淆。","extension":"声速：空气中约340m/s（15°C），水中约1500m/s，钢铁中约5200m/s。回声测距：s = vt/2（声波往返，距离要除以2）。"}},{"id":"p6","type":"choice","difficulty":"中等","knowledgePoint":"浮力","question":"一个物体漂浮在液面上，下列说法正确的是？","options":["浮力大于重力","浮力等于重力","浮力小于重力","浮力与重力无关"],"answer":1,"hint":{"approach":"漂浮条件：物体静止在液面上时，浮力等于重力（F浮 = G）。此时物体处于平衡状态，竖直方向合力为零。","pitfall":"漂浮和悬浮的区别：漂浮是物体部分露出液面，悬浮是物体完全浸没在液体中。但两种状态下都是 F浮 = G。下沉时 F浮 < G，上浮时 F浮 > G。","extension":"阿基米德原理：F浮 = ρ液 × g × V排。物体浮沉条件：①F浮 > G 上浮②F浮 = G 漂浮/悬浮③F浮 < G 下沉。也可以用密度判断：ρ物 < ρ液 上浮，ρ物 > ρ液 下沉。"}},{"id":"p7","type":"choice","difficulty":"中等","knowledgePoint":"速度计算","question":"汽车以 72 km/h 匀速行驶 10 分钟，通过的路程约为？","options":["12000 米","720 米","1200 米","43200 米"],"answer":0,"hint":{"approach":"①统一单位：72km/h = 72÷3.6 = 20m/s；10分钟 = 600秒。②路程 s = vt = 20 × 600 = 12000m。","pitfall":"单位换算是最常见的失分点！km/h → m/s 除以 3.6（即乘5/18）。1km/h = 1000m/3600s = 1/3.6 m/s。或者换算：72km/h = 72000m/3600s = 20m/s。时间也要换算成秒。","extension":"速度单位换算口诀：km/h 变 m/s，除以 3.6；m/s 变 km/h，乘以 3.6。如 36km/h = 10m/s，15m/s = 54km/h。"}},{"id":"p8","type":"choice","difficulty":"提高","knowledgePoint":"杠杆","question":"使用杠杆撬重物，动力臂是阻力臂的3倍，若阻力为150N，则动力至少为？","options":["50N","150N","450N","100N"],"answer":0,"hint":{"approach":"杠杆平衡条件：F₁ × L₁ = F₂ × L₂。动力臂 L₁ = 3L₂，阻力 F₂ = 150N。F₁ × 3L₂ = 150 × L₂ → F₁ = 150/3 = 50N。","pitfall":"动力臂越长越省力！不要反过来算成 F₁ = 150 × 3 = 450N。动力臂是阻力臂的几倍，动力就是阻力的几分之一。","extension":"杠杆分类：①省力杠杆（动力臂>阻力臂）：钳子、撬棍②费力杠杆（动力臂<阻力臂）：镊子、筷子③等臂杠杆（动力臂=阻力臂）：天平。省力杠杆费距离，费力杠杆省距离。"}}],"化学":[{"id":"c1","type":"choice","difficulty":"基础","knowledgePoint":"物质变化","question":"下列变化属于化学变化的是？","options":["冰融化成水","汽油挥发","铁生锈","石蜡熔化"],"answer":2,"hint":{"approach":"化学变化的本质是有新物质生成。铁生锈生成了氧化铁（Fe₂O₃），是新物质。其余三项只是状态变化，没有新物质生成，是物理变化。","pitfall":"判断物理变化还是化学变化的关键是\"是否有新物质生成\"！状态变化（熔化、凝固、汽化等）一般是物理变化。燃烧、生锈、腐败、发酵等一般是化学变化。","extension":"物理变化与化学变化的区别：物理变化只是形态/状态改变（如冰融化），化学变化有新物质生成（如铁生锈）。化学变化常伴随发光、放热、变色、产生气体、生成沉淀等现象。"}},{"id":"c2","type":"choice","difficulty":"基础","knowledgePoint":"化学式","question":"水的化学式是？","options":["H₂O","HO₂","H₂O₂","OH"],"answer":0,"hint":{"approach":"水由氢元素和氧元素组成，一个水分子含2个氢原子和1个氧原子，化学式为 H₂O。","pitfall":"区分 H₂O（水）和 H₂O₂（过氧化氢/双氧水）！H₂O₂ 多一个氧原子，是不同的物质。下标表示原子个数，不能随意改变。","extension":"常见化学式：O₂氧气、CO₂二氧化碳、NaCl食盐、CaCO₃碳酸钙、HCl盐酸、NaOH氢氧化钠。化学式中元素符号右下角的数字表示该原子的个数。"}},{"id":"c3","type":"choice","difficulty":"中等","knowledgePoint":"元素符号","question":"\"O₂\"中的\"2\"表示的意义是？","options":["2个氧分子","每个氧分子中有2个氧原子","2个氧元素","氧气是双原子分子"],"answer":1,"hint":{"approach":"化学式中元素符号右下角的数字表示一个分子中含有该原子的个数。\"O₂\"中的\"2\"表示每个氧分子中含有2个氧原子。","pitfall":"区分不同位置的数字含义！①元素符号前面的数字表示原子个数（如 2O 表示2个氧原子）②元素符号右下角的数字表示一个分子中的原子个数（如 O₂ 中的2）③化学式前面的数字表示分子个数（如 2O₂ 表示2个氧分子）。","extension":"化学用语中的数字：①系数（化学式前）→微粒个数②下标（元素符号右下）→分子内原子个数③上标（右上角）→离子电荷数④左上角→质量数。"}},{"id":"c4","type":"choice","difficulty":"基础","knowledgePoint":"空气成分","question":"空气中体积含量最多的气体是？","options":["氧气","氮气","二氧化碳","稀有气体"],"answer":1,"hint":{"approach":"空气成分按体积计算：氮气(N₂)约78%，氧气(O₂)约21%，稀有气体约0.94%，二氧化碳(CO₂)约0.03%，其他气体和杂质约0.03%。氮气含量最多。","pitfall":"是按体积分数不是质量分数！氮气78%、氧气21%是最基本的记忆数据。注意二氧化碳只有0.03%，虽然量少但对生命活动至关重要。","extension":"空气是混合物，各成分体积分数固定：N₂ 78%、O₂ 21%、稀有气体0.94%、CO₂ 0.03%、其他0.03%。氧气用途：呼吸、燃烧、医疗急救；氮气用途：保护气、制氮肥。"}},{"id":"c5","type":"choice","difficulty":"中等","knowledgePoint":"化学反应类型","question":"下列反应属于化合反应的是？","options":["CaCO₃ → CaO + CO₂","2H₂ + O₂ → 2H₂O","Fe + CuSO₄ → FeSO₄ + Cu","HCl + NaOH → NaCl + H₂O"],"answer":1,"hint":{"approach":"化合反应是两种或两种以上物质生成一种物质的反应（多变一）。2H₂ + O₂ → 2H₂O 是两种物质生成一种物质，属于化合反应。A是分解反应（一变多），C是置换反应，D是复分解反应。","pitfall":"四种基本反应类型要区分清楚！①化合反应：A + B → AB（多变一）②分解反应：AB → A + B（一变多）③置换反应：A + BC → AC + B④复分解反应：AB + CD → AD + CB。","extension":"注意：化合反应不一定是氧化还原反应（如 CaO + H₂O → Ca(OH)₂ 不是氧化还原反应），但燃烧反应既是化合反应也是氧化还原反应。反应类型可以从不同角度分类。"}},{"id":"c6","type":"choice","difficulty":"基础","knowledgePoint":"化学方程式","question":"配平化学方程式 H₂ + O₂ → H₂O，正确的系数（按 H₂、O₂、H₂O 顺序）是？","options":["2，1，2","1，2，2","2，2，1","1，1，1"],"answer":0,"hint":{"approach":"配平原则：等号两边各原子总数相等。右边H₂O有2个H和1个O。左边H₂有2个H，需2个H₂才能产生4个H，对应2个H₂O。2个H₂O含2个O，需要1个O₂。所以：2H₂ + O₂ → 2H₂O。","pitfall":"配平时不能改化学式中的下标！只能添加化学式前面的系数。如不能把H₂O改成H₂O₂来配平——那变成了不同的物质。","extension":"配平方法：①观察法②最小公倍数法③奇数配偶法。配平后检查：①各原子总数两边相等②遵守质量守恒定律③系数一般取最简整数比。"}},{"id":"c7","type":"choice","difficulty":"中等","knowledgePoint":"金属活动性","question":"下列金属中，活动性最强的是？","options":["铁","铜","锌","银"],"answer":2,"hint":{"approach":"金属活动性顺序（由强到弱）：K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au。锌(Zn)在铁(Fe)之前，铁在铜(Cu)之前，铜在银(Ag)之前。所以锌活动性最强。","pitfall":"记忆口诀：钾钙钠镁铝、锌铁锡铅(氢)、铜汞银铂金。排在前面的金属能把排在后面的金属从其盐溶液中置换出来。氢前的金属能与酸反应产生氢气。","extension":"金属活动性应用：①判断金属能否与酸反应（H前能，H后不能）②判断金属间能否发生置换反应（活泼金属置换不活泼金属）③判断金属在自然界中的存在形式（活泼金属以化合态存在）。"}},{"id":"c8","type":"choice","difficulty":"提高","knowledgePoint":"溶液","question":"将50g溶质质量分数为10%的氯化钠溶液稀释为5%，需加水？","options":["25g","50g","100g","10g"],"answer":1,"hint":{"approach":"稀释前后溶质质量不变。原溶质 = 50g × 10% = 5g。稀释后溶液质量 = 5g ÷ 5% = 100g。需加水 = 100g - 50g = 50g。","pitfall":"稀释时溶质质量不变！不要直接用50g × (10%-5%) = 2.5g来算加水量。正确思路：溶质不变 → 设加水x克 → 5g/(50+x) = 5% → x = 50g。","extension":"溶液稀释公式：C₁ × m₁ = C₂ × m₂（浓溶液浓度×浓溶液质量 = 稀溶液浓度×稀溶液质量）。稀释就是加溶剂，溶质质量始终不变。"}}],"生物":[{"id":"b1","type":"choice","difficulty":"基础","knowledgePoint":"细胞结构","question":"植物细胞区别于动物细胞的最显著特征是？","options":["有细胞膜","有细胞核","有细胞壁和液泡","有线粒体"],"answer":2,"hint":{"approach":"植物细胞特有的结构：细胞壁、叶绿体、大液泡。动物细胞没有这些结构。两者共有的结构：细胞膜、细胞核、线粒体、细胞质。","pitfall":"线粒体是动植物细胞共有的，不是植物特有！叶绿体虽然也是植物特有，但不是所有植物细胞都有（如根部细胞无叶绿体）。细胞壁和液泡是植物细胞最普遍的区分特征。","extension":"细胞各结构功能：①细胞壁——保护和支持②细胞膜——控制物质进出③细胞核——遗传信息库④叶绿体——光合作用⑤线粒体——呼吸作用⑥液泡——储存物质。"}},{"id":"b2","type":"choice","difficulty":"基础","knowledgePoint":"光合作用","question":"光合作用的场所是？","options":["线粒体","叶绿体","细胞核","液泡"],"answer":1,"hint":{"approach":"光合作用在叶绿体中进行。叶绿体含有叶绿素，能吸收光能，将二氧化碳和水合成有机物（葡萄糖），并释放氧气。","pitfall":"区分光合作用和呼吸作用的场所！光合作用在叶绿体中进行（需要光），呼吸作用在线粒体中进行（所有活细胞都能进行，不需要光）。两者是相反但不是对立的过程。","extension":"光合作用公式：CO₂ + H₂O →(光能/叶绿体) 有机物 + O₂。呼吸作用公式：有机物 + O₂ →(酶) CO₂ + H₂O + 能量。光合作用储存能量，呼吸作用释放能量。"}},{"id":"b3","type":"choice","difficulty":"中等","knowledgePoint":"人体系统","question":"人体进行气体交换的主要器官是？","options":["鼻腔","气管","肺","心脏"],"answer":2,"hint":{"approach":"肺是气体交换的主要器官。肺泡壁很薄（只有一层细胞），周围有丰富的毛细血管，氧气透过肺泡壁进入血液，二氧化碳从血液进入肺泡排出体外。","pitfall":"鼻腔和气管只是气体的通道，不进行气体交换！心脏是血液循环的动力器官，不直接参与气体交换。气体交换发生在肺泡与血液之间，以及血液与组织细胞之间。","extension":"呼吸过程：①肺通气（肺与外界）②肺泡内的气体交换（肺泡与血液）③气体在血液中的运输④组织内的气体交换（血液与组织细胞）。四个环节缺一不可。"}},{"id":"b4","type":"choice","difficulty":"中等","knowledgePoint":"遗传与变异","question":"人的体细胞中含有多少对染色体？","options":["23对","46对","22对","24对"],"answer":0,"hint":{"approach":"人体细胞中含有23对（46条）染色体。其中22对是常染色体，1对是性染色体（女性XX，男性XY）。","pitfall":"是23对（46条），不是46对！体细胞染色体成对存在，23对 = 46条。生殖细胞（精子、卵细胞）中染色体减半，为23条。","extension":"染色体、DNA、基因的关系：染色体由DNA和蛋白质组成，DNA上有遗传效应的片段就是基因。体细胞染色体成对（23对），生殖细胞染色体减半（23条），受精后恢复为23对。"}},{"id":"b5","type":"choice","difficulty":"基础","knowledgePoint":"生态系统","question":"在一个生态系统中，能量流动的特点是？","options":["循环往复","单向流动、逐级递减","双向流动","不流动"],"answer":1,"hint":{"approach":"生态系统能量流动是单向的、逐级递减的。能量沿食物链传递，每一级生物只能获得上一级能量的10%-20%，其余能量在呼吸作用中以热能散失。","pitfall":"物质是循环的，能量是单向流动的！不要混淆。物质（如碳、氧、水）可以在生物与环境之间循环，但能量流动是单向的，不能循环。","extension":"食物链起点是生产者（植物），依次是初级消费者→次级消费者→...。能量传递效率约10%-20%，所以食物链一般不超过5个营养级。营养级越高，能量越少。"}},{"id":"b6","type":"judge","difficulty":"中等","knowledgePoint":"血液循环","question":"动脉血是含氧丰富、颜色鲜红的血液，静脉血是含氧较少、颜色暗红的血液。","answer":true,"hint":{"approach":"动脉血和静脉血的区别在于含氧量和颜色：动脉血含氧丰富、颜色鲜红；静脉血含氧较少、颜色暗红。这是正确的描述。","pitfall":"注意：动脉血不一定在动脉中，静脉血不一定在静脉中！肺动脉中流的是静脉血（含CO₂多），肺静脉中流的是动脉血（含O₂多）。区分动脉血/静脉血看含氧量，区分动脉/静脉看血流方向（从心脏流出的是动脉，流回心脏的是静脉）。","extension":"血液循环路线：体循环：左心室→主动脉→全身毛细血管→上下腔静脉→右心房（动脉血变静脉血）。肺循环：右心室→肺动脉→肺泡毛细血管→肺静脉→左心房（静脉血变动脉血）。"}},{"id":"b7","type":"choice","difficulty":"基础","knowledgePoint":"动物运动","question":"人体的运动系统主要由什么组成？","options":["骨骼和肌肉","骨骼和关节","肌肉和关节","骨骼、关节和肌肉"],"answer":3,"hint":{"approach":"人体的运动系统由骨、骨连结（关节）和骨骼肌三部分组成。骨起杠杆作用，关节起支点作用，骨骼肌提供动力。","pitfall":"运动系统三要素缺一不可：骨（杠杆）、关节（支点）、肌肉（动力）。不能漏掉任何一个。运动还需要神经系统的调节。","extension":"运动原理：骨骼肌收缩→牵动骨绕关节活动→产生运动。屈肘时肱二头肌收缩、肱三头肌舒张；伸肘时相反。一个动作的完成需要多组肌肉的协调配合。"}},{"id":"b8","type":"choice","difficulty":"提高","knowledgePoint":"微生物","question":"细菌和真菌在生态系统中的主要角色是？","options":["生产者","消费者","分解者","以上都是"],"answer":2,"hint":{"approach":"细菌和真菌营腐生生活，将动植物遗体分解为无机物，归还给环境供植物再利用，在生态系统中担任分解者角色。","pitfall":"大多数细菌和真菌是分解者，但也有例外！有些细菌是生产者（如蓝细菌能光合作用），有些细菌是消费者（如结核杆菌寄生在人体内）。但题目问\"主要角色\"，则是分解者。","extension":"生态系统成分：①非生物部分——阳光、空气、水、温度等②生物部分——生产者（植物）、消费者（动物）、分解者（细菌、真菌）。分解者将有机物分解为无机物，是物质循环的关键环节。"}}],"地理":[{"id":"g1","type":"choice","difficulty":"基础","knowledgePoint":"中国疆域","question":"我国领土最南端位于？","options":["黑龙江省漠河","新疆帕米尔高原","海南省南沙群岛曾母暗沙","黑龙江省黑龙江主航道"],"answer":2,"hint":{"approach":"中国领土四至点：最北——漠河以北黑龙江主航道中心线；最南——南沙群岛曾母暗沙；最东——黑龙江与乌苏里江汇合处；最西——新疆帕米尔高原。","pitfall":"四至点要准确记忆！最北和最东都在黑龙江省，容易混淆。最南是曾母暗沙不是海南岛本岛。最西是帕米尔高原不是西藏。","extension":"中国领土面积约960万平方公里，居世界第三。南北跨度约5500km，东西跨度约5200km，跨5个时区。陆上邻国14个，隔海相望国家6个。"}},{"id":"g2","type":"choice","difficulty":"中等","knowledgePoint":"气候类型","question":"广州的气候类型属于？","options":["温带季风气候","亚热带季风气候","热带季风气候","温带海洋性气候"],"answer":1,"hint":{"approach":"广州位于北回归线附近，属于亚热带季风气候。夏季高温多雨，冬季温和少雨。年平均气温约21-22°C，年降水量约1600-1800mm。","pitfall":"区分三种季风气候！①热带季风气候——全年高温，分旱雨两季（如海南南部）②亚热带季风气候——夏季高温多雨，冬季温和少雨（如广州）③温带季风气候——夏季高温多雨，冬季寒冷干燥（如北京）。","extension":"中国气候特征：气候复杂多样、季风气候显著。季风区与非季风区分界线：大兴安岭—阴山—贺兰山—巴颜喀拉山—冈底斯山。季风区内雨热同期，有利于农业生产。"}},{"id":"g3","type":"choice","difficulty":"基础","knowledgePoint":"地形","question":"下列地形中，海拔一般在200米以下，地势平坦的是？","options":["高原","山地","平原","丘陵"],"answer":2,"hint":{"approach":"五种基本地形：①平原——海拔<200m，平坦广阔②高原——海拔>500m，面积广大，顶部平坦③山地——海拔>500m，坡度陡峻④丘陵——海拔200-500m，起伏和缓⑤盆地——四周高、中间低。","pitfall":"平原和高原都是地势平坦，区别在海拔！平原<200m，高原>500m。丘陵和山地区别在坡度：丘陵起伏和缓，山地坡度陡峻。","extension":"中国地形特征：西高东低，呈阶梯状分布。第一级阶梯——青藏高原（4000m以上）；第二级阶梯——盆地和高原（1000-2000m）；第三级阶梯——平原和丘陵（500m以下）。"}},{"id":"g4","type":"choice","difficulty":"中等","knowledgePoint":"河流","question":"下列关于长江的说法，正确的是？","options":["长江是中国第一长河，注入渤海","长江发源于唐古拉山，注入东海","长江流经10个省区","长江全长约5400千米"],"answer":1,"hint":{"approach":"长江发源于青藏高原唐古拉山脉，流经11个省区，全长约6300千米，是中国第一长河，最终注入东海。","pitfall":"注意区分长江和黄河！黄河注入渤海（不是东海），全长约5464千米，流经9个省区。长江注入东海，流经11个省区，全长约6300千米。","extension":"长江流经省区：青、藏、川、滇、渝、鄂、湘、赣、皖、苏、沪（11个）。上中游分界点——湖北宜昌；中下游分界点——江西湖口。长江被誉为\"黄金水道\"。"}},{"id":"g5","type":"choice","difficulty":"基础","knowledgePoint":"省级行政区","question":"下列省级行政区中，纬度最高的是？","options":["广东省","黑龙江省","海南省","新疆维吾尔自治区"],"answer":1,"hint":{"approach":"纬度最高即最北。黑龙江省是中国最北的省份，漠河被称为\"中国的北极\"。广东和海南在南方，新疆虽然在西边但纬度没有黑龙江高。","pitfall":"区分纬度（南北）和经度（东西）！新疆是最西的省区之一，但不是最北的。黑龙江省既是中国最北也是最东的省份。","extension":"中国34个省级行政区：23个省、5个自治区、4个直辖市、2个特别行政区。口诀记忆：\"两湖两广两河山，五江云贵福吉安，四西二宁青甘陕，海内台北上重天，港澳特别行政区。\""}},{"id":"g6","type":"choice","difficulty":"中等","knowledgePoint":"人口","question":"我国人口分布的特点是？","options":["东部多西部少","西部多东部少","均匀分布","北方多南方少"],"answer":0,"hint":{"approach":"中国人口分布以黑河—腾冲线（胡焕庸线）为界：东南半壁人口密集（约94%），西北半壁人口稀疏（约6%）。总体特征是东部多西部少。","pitfall":"人口分界线是黑河—腾冲线（胡焕庸线），不是其他线！这条线是1935年地理学家胡焕庸提出的，至今仍然适用。线东南人口稠密，线西北人口稀疏。","extension":"人口稠密的原因：东部地形平坦（平原多）、气候适宜（季风气候）、经济发达、交通便利。西部地形复杂（高原山地）、气候干旱、交通不便、经济相对落后。"}},{"id":"g7","type":"choice","difficulty":"中等","knowledgePoint":"板块构造","question":"世界上两大火山地震带是？","options":["环太平洋火山地震带和地中海—喜马拉雅火山地震带","环太平洋火山地震带和大西洋火山地震带","地中海火山地震带和印度洋火山地震带","太平洋火山地震带和北冰洋火山地震带"],"answer":0,"hint":{"approach":"世界两大火山地震带：①环太平洋火山地震带（集中了全球约80%的地震）②地中海-喜马拉雅火山地震带（集中了约15%的地震）。","pitfall":"名称要准确！\"地中海-喜马拉雅\"不能只写\"地中海\"或只写\"喜马拉雅\"。环太平洋带不是\"太平洋沿岸\"而是\"环太平洋\"。","extension":"板块构造学说：地球岩石圈分为六大板块——亚欧板块、非洲板块、美洲板块、太平洋板块、印度洋板块、南极洲板块。板块交界处地壳活跃，多火山地震。中国位于亚欧板块东部，受太平洋板块和印度洋板块挤压。"}}],"历史":[{"id":"h1","type":"choice","difficulty":"基础","knowledgePoint":"鸦片战争","question":"鸦片战争爆发于哪一年？","options":["1839年","1840年","1842年","1856年"],"answer":1,"hint":{"approach":"1840年6月，英国舰队封锁珠江口，鸦片战争正式爆发。1842年签订《南京条约》，鸦片战争结束。","pitfall":"区分鸦片战争的开始和结束！1840年爆发，1842年结束（签《南京条约》）。1856年是第二次鸦片战争爆发的年份。1839年是林则徐虎门销烟的年份。","extension":"鸦片战争的影响：中国从封建社会逐步沦为半殖民地半封建社会，是中国近代史的开端。《南京条约》是中国近代第一个不平等条约，内容包括割香港岛、赔款2100万银元、五口通商（广厦福宁上）、协定关税。"}},{"id":"h2","type":"choice","difficulty":"中等","knowledgePoint":"洋务运动","question":"洋务运动的口号是\"自强\"和\"求富\"，其中\"求富\"主要体现在？","options":["创办军事工业","创办民用工业","建立新式海军","兴办新式学堂"],"answer":1,"hint":{"approach":"洋务运动前期（60年代起）以\"自强\"为口号创办军事工业（如安庆内军械所、江南制造总局）；后期（70年代起）以\"求富\"为口号创办民用工业（如轮船招商局、汉阳铁厂）。","pitfall":"\"自强\"对应军事工业，\"求富\"对应民用工业！不要搞混。军事工业需要大量资金，所以后期创办民用工业来\"求富\"以支持军事工业。","extension":"洋务运动代表人物：中央——奕訢；地方——曾国藩、李鸿章、左宗棠、张之洞。洋务运动引进了西方先进技术，创办了一批近代企业，培养了一批技术人才，但没有触动封建制度根本，最终在甲午中日战争中宣告破产。"}},{"id":"h3","type":"choice","difficulty":"基础","knowledgePoint":"辛亥革命","question":"辛亥革命最大的历史功绩是？","options":["推翻了清朝统治","结束了君主专制制度","建立了共和国","实现了民族独立"],"answer":1,"hint":{"approach":"辛亥革命最大的功绩是推翻了延续两千多年的封建君主专制制度（帝制），使民主共和观念深入人心。虽然建立了中华民国，但没有实现真正的民族独立（半殖民地性质未变）。","pitfall":"\"推翻清朝\"和\"结束君主专制\"有区别！清朝只是一个朝代，君主专制是一种制度。辛亥革命不仅推翻了清朝，更重要的是结束了整个君主专制制度，这是根本性的变革。","extension":"辛亥革命局限性：没有完成反帝反封建的任务，没有改变中国半殖民地半封建社会的性质。胜利果实被袁世凯窃取。但它开启了中国近代民主革命的先河。"}},{"id":"h4","type":"choice","difficulty":"中等","knowledgePoint":"新文化运动","question":"新文化运动的两面旗帜（口号）是？","options":["自强与求富","民主与科学","自由与平等","独立与民主"],"answer":1,"hint":{"approach":"新文化运动高举\"民主\"（德先生 Democracy）和\"科学\"（赛先生 Science）两面大旗，反对封建文化，提倡新文化。代表人物：陈独秀、李大钊、胡适、鲁迅。","pitfall":"不同运动的口号不同！洋务运动——自强、求富；新文化运动——民主、科学。不要混淆。\"德先生\"和\"赛先生\"是新文化运动的标志性称呼。","extension":"新文化运动分两个阶段：①前期（1915-1917）——提倡民主与科学，反对专制与迷信；提倡新道德，反对旧道德；提倡新文学，反对旧文学。②后期（1917后）——传播马克思主义，李大钊发表《我的马克思主义观》。"}},{"id":"h5","type":"choice","difficulty":"基础","knowledgePoint":"五四运动","question":"五四运动发生的直接原因是？","options":["俄国十月革命的影响","巴黎和会上中国外交失败","北洋军阀的黑暗统治","新文化运动的推动"],"answer":1,"hint":{"approach":"五四运动的直接导火索是巴黎和会上中国外交的失败——列强将德国在山东的权益转交给日本，中国作为战胜国却遭到不公正待遇，引发学生抗议。","pitfall":"直接原因和背景原因不同！直接原因是巴黎和会外交失败（导火索）；背景原因包括北洋军阀统治、新文化运动的思想启蒙、十月革命的影响等。题目问\"直接原因\"要选巴黎和会。","extension":"五四运动意义：①是一次彻底的反帝反封建的爱国运动②青年学生起了先锋作用③无产阶级开始登上政治舞台④标志着中国新民主主义革命的开端。五四精神：爱国、进步、民主、科学。"}},{"id":"h6","type":"choice","difficulty":"中等","knowledgePoint":"抗日战争","question":"中国人民抗日战争开始的标志是？","options":["1931 年九一八事变","1937 年七七事变","1936 年西安事变","1945 年日本投降"],"answer":0,"hint":{"approach":"抗日战争始于1931年9月18日的九一八事变（局部抗战开始），1937年7月7日七七事变（全面抗战开始），1945年8月15日日本宣布无条件投降，9月2日正式签署投降书。","pitfall":"注意区分局部抗战和全面抗战！九一八事变（1931）是14年抗战的开始，七七事变（1937）是全面抗战的开始。不要只从1937年算起——2017年教材已将抗战改为14年（1931-1945）。","extension":"抗战重大事件：①九一八事变(1931.9.18)——局部抗战开始②七七事变(1937.7.7)——全面抗战开始③台儿庄战役(1938)——正面战场重大胜利④百团大战(1940)——敌后战场主动出击⑤日本投降(1945.8.15)——抗战胜利。"}},{"id":"h7","type":"choice","difficulty":"中等","knowledgePoint":"改革开放","question":"我国改革开放首先从哪里开始？","options":["城市","农村","沿海","经济特区"],"answer":1,"hint":{"approach":"改革开放首先从农村开始。1978年安徽凤阳小岗村率先实行家庭联产承包责任制，随后在全国推广。农村改革成功后，改革才推向城市。","pitfall":"改革先农村后城市！农村实行家庭联产承包责任制，城市进行国企改革。开放先沿海后内陆——先设深圳等经济特区，再开放沿海城市，最后开放内陆。","extension":"改革开放历程：①1978年十一届三中全会——改革开放的决策②农村：家庭联产承包责任制③1980年设深圳、珠海、汕头、厦门经济特区④1984年开放14个沿海城市⑤城市经济体制改革。改革开放是决定当代中国命运的关键抉择。"}}],"道法":[{"id":"d1","type":"choice","difficulty":"基础","knowledgePoint":"宪法","question":"我国的根本大法是？","options":["刑法","民法典","宪法","行政法"],"answer":2,"hint":{"approach":"宪法是我国的根本大法，具有最高的法律效力。宪法规定了国家生活中最根本、最重要的问题，是其他法律的立法基础和立法依据。","pitfall":"宪法是根本大法，不是普通法律！宪法的法律效力最高，一切法律都不能与宪法相抵触。宪法的制定和修改程序比普通法律更严格。","extension":"宪法的特征：①内容上——规定国家根本制度②效力上——最高法律效力③程序上——制定修改更严格（全国人大2/3以上多数通过）。宪法核心价值追求：规范国家权力运行以保障公民权利。"}},{"id":"d2","type":"choice","difficulty":"基础","knowledgePoint":"公民权利","question":"下列属于公民基本权利的是？","options":["依法纳税","受教育权","保守国家秘密","遵守宪法和法律"],"answer":1,"hint":{"approach":"公民基本权利包括：政治权利和自由、人身自由、社会经济权利、文化教育权利等。受教育权属于文化教育权利，是基本权利。A、C、D都是公民的基本义务而非权利。","pitfall":"区分权利和义务！权利是\"可以做什么\"（国家保障），义务是\"必须做什么\"（国家强制）。受教育既是权利也是义务（九年义务教育）。纳税、服兵役、保守秘密、遵守宪法法律都是义务。","extension":"公民基本义务：①维护国家统一和民族团结②遵守宪法和法律③保守国家秘密④依法服兵役⑤依法纳税。权利与义务具有一致性：享受权利的同时必须履行义务。"}},{"id":"d3","type":"choice","difficulty":"中等","knowledgePoint":"国家安全","question":"全民国家安全教育日是每年的？","options":["4月15日","3月15日","12月4日","11月1日"],"answer":0,"hint":{"approach":"2015年7月通过的《国家安全法》将每年4月15日确定为全民国家安全教育日。3月15日是消费者权益日，12月4日是国家宪法日，11月1日是反间谍法颁布日。","pitfall":"各个重要日期不要混淆！4月15日——国家安全教育日；12月4日——国家宪法日；3月15日——消费者权益日。这些都是中考常考时间点。","extension":"国家安全包括：政治安全、国土安全、军事安全、经济安全、文化安全、社会安全、科技安全、网络安全、生态安全、资源安全、核安全等11个领域。维护国家安全是每个公民的义务。"}},{"id":"d4","type":"choice","difficulty":"中等","knowledgePoint":"人民代表大会制度","question":"我国的政体（根本政治制度）是？","options":["人民代表大会制度","社会主义制度","民族区域自治制度","中国共产党领导的多党合作和政治协商制度"],"answer":0,"hint":{"approach":"人民代表大会制度是我国的根本政治制度（政体）。社会主义制度是我国的根本制度。民族区域自治制度和多党合作政治协商制度是基本政治制度。","pitfall":"根本制度和根本政治制度不同！根本制度——社会主义制度；根本政治制度——人民代表大会制度。基本政治制度有三个：①中国共产党领导的多党合作和政治协商制度②民族区域自治制度③基层群众自治制度。","extension":"国家机构组织原则：民主集中制。全国人民代表大会是最高国家权力机关，行使立法权、决定权、任免权、监督权。国务院是最高国家行政机关，对全国人大负责。"}},{"id":"d5","type":"choice","difficulty":"基础","knowledgePoint":"未成年人保护","question":"《未成年人保护法》规定，未成年人是指未满___周岁的公民。","options":["14周岁","16周岁","18周岁","20周岁"],"answer":2,"hint":{"approach":"《未成年人保护法》第二条规定：未成年人是指未满十八周岁的公民。18周岁是成年的界限，18周岁以下享受未成年人保护法的特殊保护。","pitfall":"18周岁不是18虚岁！是满18周岁的实岁。注意不同法律中的年龄界限：①未满18周岁——未成年人②已满14周岁——可能承担刑事责任（八种严重犯罪）③已满16周岁——完全刑事责任能力。","extension":"未成年人保护六道防线：家庭保护、学校保护、社会保护、网络保护、政府保护、司法保护。2021年修订新增了\"网络保护\"和\"政府保护\"，体现了对未成年人全方位的保护。"}},{"id":"d6","type":"choice","difficulty":"中等","knowledgePoint":"社会主义核心价值观","question":"社会主义核心价值观中，属于国家层面的价值目标是？","options":["自由、平等、公正、法治","爱国、敬业、诚信、友善","富强、民主、文明、和谐","自由、民主、平等、公正"],"answer":2,"hint":{"approach":"社会主义核心价值观24字：①国家层面——富强、民主、文明、和谐②社会层面——自由、平等、公正、法治③个人层面——爱国、敬业、诚信、友善。","pitfall":"三个层面12个词24个字要分清！国家层面是\"富强、民主、文明、和谐\"（国家要怎么样）；社会层面是\"自由、平等、公正、法治\"（社会要怎么样）；个人层面是\"爱国、敬业、诚信、友善\"（个人要怎么样）。","extension":"记忆口诀：国家\"富民文和\"（富强、民主、文明、和谐）；社会\"自平公法\"（自由、平等、公正、法治）；个人\"爱敬诚友\"（爱国、敬业、诚信、友善）。社会主义核心价值观是当代中国精神的集中体现。"}},{"id":"d7","type":"choice","difficulty":"提高","knowledgePoint":"民族团结","question":"处理民族关系的基本原则是？","options":["民族团结","民族平等、团结、共同繁荣","民族互助","民族融合"],"answer":1,"hint":{"approach":"我国处理民族关系的基本原则是民族平等、民族团结、各民族共同繁荣。民族区域自治制度是基本政治制度。","pitfall":"基本原则有三个：民族平等、民族团结、共同繁荣，不能只选其中一个！民族平等是前提，民族团结是保证，共同繁荣是目标。三者缺一不可。","extension":"民族区域自治制度：在国家统一领导下，在少数民族聚居的地方实行区域自治，设立自治机关，行使自治权。我国有5个省级自治区：内蒙古、新疆、广西、宁夏、西藏。"}}]},"高中":{"数学":[{"id":"h_m1","type":"choice","difficulty":"基础","knowledgePoint":"函数与导数","question":"函数 f(x)=x³-3x 的极小值点为？","options":["x=-1","x=0","x=1","x=2"],"answer":2,"hint":{"approach":"f′(x)=3x²-3，令 f′(x)=0 得 x=±1。f′(x)<0 当 -1<x<1，故 x=1 处由减转增，为极小值点；x=-1 为极大值点。","pitfall":"极小值点是横坐标 x=1，不是函数值！先求导找驻点，再用导数符号变化判断极大/极小。","extension":"导数判极值：f′(x) 左正右负→极大值；左负右正→极小值。二阶导数 f″(x) 大于 0 也可判极小。"}},{"id":"h_m2","type":"choice","difficulty":"中等","knowledgePoint":"等差数列","question":"等差数列 {aₙ} 中 a₁=2，a₅=10，则公差 d 为？","options":["1","2","3","4"],"answer":1,"hint":{"approach":"a₅=a₁+4d → 10=2+4d → 4d=8 → d=2。","pitfall":"第 n 项公式 aₙ=a₁+(n-1)d，a₅ 对应 4d 不是 5d。","extension":"等差数列求和 Sₙ=n(a₁+aₙ)/2=na₁+n(n-1)d/2。"}},{"id":"h_m3","type":"choice","difficulty":"提高","knowledgePoint":"立体几何","question":"棱长为 a 的正方体，其体对角线长为？","options":["√2 a","√3 a","2a","3a"],"answer":1,"hint":{"approach":"体对角线 = √(a²+a²+a²)=√3 a。","pitfall":"面对角线是 √2 a，体对角线是 √3 a，别混淆。","extension":"长方体体对角线 √(a²+b²+c²)；正方体是特例。"}}],"语文":[{"id":"h_y1","type":"choice","difficulty":"基础","knowledgePoint":"文言文《劝学》","question":"\"君子博学而日参省乎己\"中\"参\"的意思是？","options":["参加","检验","参考","参与"],"answer":1,"hint":{"approach":"\"参\"通\"叁\"，此处意为检验、检查。\"日参省乎己\"即每天检验反省自己。","pitfall":"\"参\"在文言中有\"检验\"义（参省），不是参加。荀子《劝学》强调后天积累与自省。","extension":"《劝学》名句：\"青取之于蓝而青于蓝\"\"锲而不舍，金石可镂\"均强调学习积累。"}},{"id":"h_y2","type":"choice","difficulty":"中等","knowledgePoint":"诗歌鉴赏","question":"\"大江东去，浪淘尽，千古风流人物\"的作者是？","options":["辛弃疾","苏轼","李清照","柳永"],"answer":1,"hint":{"approach":"出自苏轼《念奴娇·赤壁怀古》，豪放派代表作。","pitfall":"辛弃疾亦豪放派但此句为苏轼。注意苏辛并称但作品不同。","extension":"宋词两派：豪放（苏、辛）与婉约（柳永、李清照、晏殊）。"}},{"id":"h_y3","type":"choice","difficulty":"提高","knowledgePoint":"现代文阅读","question":"下列修辞手法判断正确的是：\"问君能有几多愁？恰似一江春水向东流。\"","options":["比喻","设问","夸张","对偶"],"answer":1,"hint":{"approach":"自问自答，是设问；同时把愁比作春水，含比喻。题干问\"修辞手法判断\"，此句最典型特征是设问。","pitfall":"该句同时有设问和比喻，但\"问君能有几多愁？恰似…\"自问自答，核心修辞是设问。","extension":"李煜《虞美人》以江水喻愁，化抽象为具体，是千古名句。"}}],"英语":[{"id":"h_e1","type":"choice","difficulty":"基础","knowledgePoint":"定语从句","question":"This is the school ___ I studied for three years.","options":["which","that","where","when"],"answer":2,"hint":{"approach":"先行词 school 表地点，从句 I studied 主谓宾完整，缺地点状语，用 where（=in which）。","pitfall":"若从句缺主语/宾语用 which/that；此处不缺主宾，缺地点状语，用 where。","extension":"定语从句关系词：人 who/whom，物 which/that，地点 where，时间 when，原因 why。"}},{"id":"h_e2","type":"choice","difficulty":"中等","knowledgePoint":"虚拟语气","question":"If I ___ you, I would take the job.","options":["am","was","were","be"],"answer":2,"hint":{"approach":"与现在事实相反的虚拟语气：If + 主语 + were，主句 would do。be 动词统一用 were。","pitfall":"虚拟语气不论人称都用 were，不用 was。","extension":"与过去相反：If + had done，主句 would have done。"}},{"id":"h_e3","type":"choice","difficulty":"提高","knowledgePoint":"非谓语动词","question":"___ the letter, he went to bed.","options":["Writing","Having written","Write","To write"],"answer":1,"hint":{"approach":"写信发生在睡觉之前，且主语 he 与 write 主动，用现在分词的完成式 Having written 表先于谓语的动作。","pitfall":"分词作状语注意时态与主动/被动；先于谓语用 having done。","extension":"非谓语：doing 主动进行，done 被动完成，to do 目的将来。"}}],"物理":[{"id":"h_p1","type":"choice","difficulty":"基础","knowledgePoint":"牛顿定律","question":"关于牛顿第一定律，正确的是？","options":["力是维持运动的原因","物体不受力时保持静止或匀速直线运动","速度越大惯性越大","加速度与速度成正比"],"answer":1,"hint":{"approach":"牛顿第一定律：一切物体总保持匀速直线运动或静止状态，直到外力迫使它改变。力是改变运动状态的原因，不是维持。","pitfall":"惯性只与质量有关，与速度无关。伽利略理想实验奠基。","extension":"牛顿第二定律 F=ma；第三定律作用力反作用力等大反向。"}},{"id":"h_p2","type":"choice","difficulty":"中等","knowledgePoint":"电场","question":"真空中两点电荷间库仑力大小为 F，若两电荷量均加倍、距离不变，则力变为？","options":["F","2F","4F","F/4"],"answer":2,"hint":{"approach":"库仑力 F=kq₁q₂/r²，q₁、q₂ 均加倍 → F 变为 4 倍。","pitfall":"力与电荷量乘积成正比、与距离平方成反比；两个都加倍是 2×2=4 倍。","extension":"点电荷模型适用条件：电荷可视为点；电场强度 E=F/q。"}},{"id":"h_p3","type":"choice","difficulty":"提高","knowledgePoint":"电磁感应","question":"闭合线圈中磁通量变化产生感应电流，这一定律是？","options":["欧姆定律","法拉第电磁感应定律","楞次定律","安培定律"],"answer":1,"hint":{"approach":"法拉第电磁感应定律：感应电动势大小与磁通量变化率成正比。楞次定律判断方向。","pitfall":"法拉第定律定大小，楞次定律定方向（阻碍变化），二者配合。","extension":"E=nΔΦ/Δt；发电机原理即电磁感应。"}}],"化学":[{"id":"h_c1","type":"choice","difficulty":"基础","knowledgePoint":"氧化还原反应","question":"下列反应中，属于氧化还原反应的是？","options":["NaCl+AgNO₃=AgCl↓+NaNO₃","2H₂+O₂=2H₂O","NaOH+HCl=NaCl+H₂O","CaCO₃=CaO+CO₂↑"],"answer":1,"hint":{"approach":"氧化还原反应有化合价升降。2H₂+O₂=2H₂O 中 H 由 0 升到 +1、O 由 0 降到 -2，是氧化还原。其余为复分解/非氧化还原。","pitfall":"判断氧化还原看有无元素化合价变化，不是看有无气体/沉淀。","extension":"氧化剂得电子价降，还原剂失电子价升；口诀\"升失氧、降得还\"。"}},{"id":"h_c2","type":"choice","difficulty":"中等","knowledgePoint":"元素周期律","question":"同周期主族元素从左到右，最外层电子数，原子半径，金属性如何变化？","options":["递增；递减；减弱","递减；递增；增强","不变；递增；增强","递增；递增；减弱"],"answer":0,"hint":{"approach":"同周期从左到右：最外层电子数递增、原子半径递减、金属性减弱非金属性增强。","pitfall":"原子半径同周期递减（核电荷增大吸引增强）；金属性递减。","extension":"同主族从上到下：半径递增、金属性增强。"}},{"id":"h_c3","type":"choice","difficulty":"提高","knowledgePoint":"有机化学","question":"甲烷与氯气在光照下发生的是？","options":["加成反应","取代反应","消去反应","聚合反应"],"answer":1,"hint":{"approach":"甲烷光照下与 Cl₂ 发生取代反应，生成 CH₃Cl 等氯代烃和 HCl。","pitfall":"烷烃特征反应是取代（光照）；不饱和烃才是加成。","extension":"取代：有机物中 H 被其他原子/基团替代；加成：双键/三键打开加原子。"}}],"生物":[{"id":"h_b1","type":"choice","difficulty":"基础","knowledgePoint":"细胞结构","question":"真核细胞中，控制遗传和代谢的中心是？","options":["线粒体","核糖体","细胞核","高尔基体"],"answer":2,"hint":{"approach":"细胞核是遗传信息库，是细胞代谢和遗传的控制中心。","pitfall":"线粒体是\"动力车间\"（供能），核糖体是蛋白质合成场所，均非控制中心。","extension":"细胞核含染色质（DNA+蛋白质），核膜具核孔（大分子通道）。"}},{"id":"h_b2","type":"choice","difficulty":"中等","knowledgePoint":"光合作用" // ===== 题库数据模型升级（支撑实时更新：改题不丢历史、按学期排期、课标对齐）=====
// 规范化题目：补齐 version/status/grade/chapter/standard/author/effectiveFrom-To/cognitiveLevel，旧题向后兼容。
function normQuestion(q){
  if(!q || typeof q!=='object') return q;
  if(typeof q.version!=='number') q.version = 1;
  if(!q.status) q.status = 'published';
  if(!('grade' in q)) q.grade = null;
  if(!('chapter' in q)) q.chapter = null;
  if(!('standard' in q)) q.standard = null;
  if(!('author' in q)) q.author = null;
  if(!('effectiveFrom' in q)) q.effectiveFrom = null;
  if(!('effectiveTo' in q)) q.effectiveTo = null;
  if(!q.cognitiveLevel){
    q.cognitiveLevel = q.difficulty==='基础' ? '记忆' : (q.difficulty==='中等' ? '理解' : (q.difficulty==='hard' ? '应用' : '理解'));
  }
  return q;
}

// ===== Daily Training (每日训练) =====
// 每天自动生成一组新题：容易题 + 难题 + 易错题，三类齐全
let _dailySel = undefined;

function dailySeed(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){
    h ^= h<<13; h ^= h>>>17; h ^= h<<5;
    return ((h>>>0)/4294967296);
  };
}
function dailyShuffle(arr, rnd){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function dailyAllQuestions(){
  const out = [];
  Object.keys(activeBank()).forEach(subj=>{
    (activeBank()[subj]||[]).forEach(q=> out.push({id:q.id, subject:subj, difficulty:q.difficulty}));
  });
  return out;
}
function dailyFindQuestion(id){
  for(const subj in activeBank()){
    const f = (activeBank()[subj]||[]).find(x=>x.id===id);
    if(f) return Object.assign({subject:subj}, f);
  }
  return null;
}
function dailyMistakePool(){
  return loadArr(SK.mistakePool, [])||[];
}
function dailyUpdateMistake(id, subject, correct){
  let pool = loadArr(SK.mistakePool, [])||[];
  let e = pool.find(x=>x.id===id);
  if(!e){ e = {id:id, subject:subject, wrong:0}; pool.push(e); }
  e.subject = subject;
  e.wrong = correct ? Math.max(0,(e.wrong||0)-1) : (e.wrong||0)+1;
  save(SK.mistakePool, pool);
}
function dailyErrorProneCandidates(){
  const errors = loadArr(SK.errors, [])||[];
  const ids = new Set(dailyAllQuestions().map(q=>q.id));
  const out = [];
  errors.forEach(e=>{
    const qid = e.practiceId || e.questionId;
    if(qid && ids.has(qid)){
      let subj = e.subject;
      if(!(activeBank()[subj]||[]).some(x=>x.id===qid)){
        for(const s in activeBank()){ if((activeBank()[s]||[]).some(x=>x.id===qid)){ subj=s; break; } }
      }
      if(subj) out.push({id:qid, subject:subj, wrong:9999});
    }
  });
  dailyMistakePool().forEach(p=>{ if(ids.has(p.id)) out.push({id:p.id, subject:p.subject, wrong:p.wrong||0}); });
  const map = {};
  out.forEach(o=>{ if(!map[o.id] || o.wrong>map[o.id].wrong) map[o.id]=o; });
  return Object.values(map);
}
function dailyGenerate(today){
  const all = dailyAllQuestions();
  const rnd = dailySeed(today);
  const easyPool = all.filter(q=>q.difficulty==='基础');
  const hardPool = all.filter(q=>q.difficulty==='提高' || q.difficulty==='中等');
  const hardReal = all.filter(q=>q.difficulty==='提高');
  const candidates = dailyErrorProneCandidates();
  const used = new Set();
  const picked = [];
  function pick(pool, n, kind){
    let arr = dailyShuffle(pool.filter(q=>!used.has(q.id)), rnd);
    const t = arr.slice(0, n);
    t.forEach(q=>{ used.add(q.id); picked.push({id:q.id, subject:q.subject, kind:kind}); });
    return t.length;
  }
  // 容易题 3 (基础)
  let ne = pick(easyPool, 3, 'easy');
  if(ne<3) pick(all, 3-ne, 'easy');
  // 难题 3 (优先提高，再中等)
  let nh = pick(hardReal, 3, 'hard');
  if(nh<3) nh += pick(hardPool, 3-nh, 'hard');
  if(nh<3) pick(all, 3-nh, 'hard');
  // 易错题 3 (错题本/错题库优先，不足用中等/提高补充)
  let nm = pick(candidates, 3, 'mistake');
  if(nm<3) nm += pick(hardPool, 3-nm, 'mistake');
  if(nm<3) pick(all, 3-nm, 'mistake');
  const items = dailyShuffle(picked, rnd);
  return { date:today, items:items, results:{}, completed:false, score:0, awarded:false };
}
function getDailyTraining(){
  const today = todayStr();
  let dt = load(SK.dailyTraining, null);
  if(!dt || dt.date!==today){
    dt = dailyGenerate(today);
    save(SK.dailyTraining, dt);
  }
  return dt;
}

  if(dt.completed){

      + '<button class="btn btn-primary btn-sm" onclick="startDailyTraining()">查看 / 重新挑战</button>'
      + '</div>';
  }
  return '<div class="daily-banner">'
    + '<div class="db-left">📅 <b>今日训练</b> · ' + today + '</div>'
    + '<div class="db-mid">'
    + '<span class="daily-pill easy">🌱 容易题 ' + easyN + '</span>'
    + '<span class="daily-pill hard">🔥 难题 ' + hardN + '</span>'
    + '<span class="daily-pill mistake">⚠️ 易错题 ' + misN + '</span>'
    + '<span class="db-progress">进度 ' + answered + '/' + total + '</span>'
    + '</div>'
    + '<button class="btn btn-primary btn-sm" onclick="startDailyTraining()">' + (answered>0?'继续今日训练':'开始今日训练') + '</button>'
    + '</div>';
}
function startDailyTraining(){
  const dt = getDailyTraining();
  let idx = dt.items.findIndex(i=> !(dt.results && dt.results[i.id]));
  if(idx<0) idx = 0;
  renderDailyModal(idx);
}
function renderDailyModal(idx){
  const dt = getDailyTraining();
  const item = dt.items[idx];
  const q = dailyFindQuestion(item.id);
  if(!q){ closeModal(); return; }
  if(practiceState.shownAt[item.id]==null) practiceState.shownAt[item.id]=Date.now();
  const total = dt.items.length;
  const answered = dt.results && dt.results[item.id];
  const saved = answered ? dt.results[item.id] : null;
  _dailySel = answered ? saved.choice : undefined;
  const kindMap = {easy:'容易题', hard:'难题', mistake:'易错题'};
  const kindCss = {easy:'dq-tag-easy', hard:'dq-tag-hard', mistake:'dq-tag-mistake'};
  const kindIcon = {easy:'🌱', hard:'🔥', mistake:'⚠️'};
  let body = '';
  if(q.type==='choice'){
    q.options.forEach((o,i)=>{
      const cls = 'dq-opt' + (answered && saved.choice===i ? ' sel' : '');
      const dis = answered ? ' disabled' : '';
      body += '<button class="'+cls+'" id="dq-opt-'+idx+'-'+i+'" onclick="dailySelect('+idx+','+i+')"'+dis+'><span class="dq-key">'+String.fromCharCode(65+i)+'</span>'+dqEscape(o)+'</button>';
    });
  } else if(q.type==='judge'){
    const clsT = 'dq-opt' + (answered && saved.choice===true ? ' sel' : '');
    const clsF = 'dq-opt' + (answered && saved.choice===false ? ' sel' : '');
    const dis = answered ? ' disabled' : '';
    body += '<button class="'+clsT+'" id="dq-opt-'+idx+'-t" onclick="dailySelect('+idx+',true)"'+dis+'>✓ 正确</button>';
    body += '<button class="'+clsF+'" id="dq-opt-'+idx+'-f" onclick="dailySelect('+idx+',false)"'+dis+'>✗ 错误</button>';
  } else {
    if(answered){
      body += '<div style="background:var(--c-bg);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:8px"><span style="font-size:12px;color:var(--c-text-light)">你的答案：</span><span style="font-size:14px;'+(saved.correct?'color:var(--c-accent)':'color:var(--c-danger)')+'">'+dqEscape(saved.choice||'未填写')+'</span></div>';
      body += '<div style="background:var(--c-accent-light);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:8px"><span style="font-size:12px;color:var(--c-accent)">正确答案：</span><span style="font-size:14px;color:var(--c-accent);font-weight:600">'+dqEscape(q.answer)+'</span></div>';
    } else {
      body += '<input class="dq-fill" id="dq-fill-'+idx+'" placeholder="输入你的答案…" oninput="var s=document.getElementById(\'dq-submit-'+idx+'\');if(s)s.disabled=false" onkeydown="if(event.key===\'Enter\')dailySubmit('+idx+')">';
    }
  }
  const dots = dt.items.map((it,i)=>'<span class="dq-dot '+(i===it.id?'cur':'')+' '+((dt.results&&dt.results[it.id])?(dt.results[it.id].correct?'ok':'bad'):'')+'"></span>').join('');
  const html = '<div class="dq-modal">'
    + '<div class="dq-head">'
    + '<div><span class="dq-tag '+kindCss[item.kind]+'">'+kindIcon[item.kind]+' '+kindMap[item.kind]+'</span> <span class="dq-subj">'+dqEscape(q.subject)+' · '+dqEscape(q.knowledgePoint)+'</span></div>'
    + '<div class="dq-count">'+(idx+1)+' / '+total+'</div>'
    + '</div>'
    + '<div class="dq-dots">'+dots+'</div>'
    + '<div class="dq-q">'+dqEscape(q.question)+'</div>'
    + '<div class="dq-opts">'+body+'</div>'
    + '<div class="dq-actions">'
    + '<button class="btn btn-ghost btn-sm" onclick="dailyShowHint('+idx+')">💡 看提示</button>'
    + '<button class="btn btn-primary btn-sm" id="dq-submit-'+idx+'" onclick="dailySubmit('+idx+')" disabled>'+(answered?'已提交':'提交')+'</button>'
    + '</div>'
    + '<div id="dq-feedback-'+idx+'"></div>'
    + '</div>';
  showModal(html);
  if(answered && q) renderDailyFeedback(idx, q, saved.correct, true);
}
function dailySelect(idx, val){
  const dt = getDailyTraining();
  if(dt.results && dt.results[dt.items[idx].id]) return;
  _dailySel = val;
  const q = dailyFindQuestion(getDailyTraining().items[idx].id);
  if(q.type==='choice'){
    q.options.forEach((o,i)=>{ const el=document.getElementById('dq-opt-'+idx+'-'+i); if(el) el.classList.toggle('sel', i===val); });
    const sb=document.getElementById('dq-submit-'+idx); if(sb) sb.disabled=false;
  } else if(q.type==='judge'){
    const t=document.getElementById('dq-opt-'+idx+'-t'), f=document.getElementById('dq-opt-'+idx+'-f');
    if(t) t.classList.toggle('sel', val===true);
    if(f) f.classList.toggle('sel', val===false);
    const sb=document.getElementById('dq-submit-'+idx); if(sb) sb.disabled=false;
  }
}
function dailyFillMatch(user, correct){
  const c = String(correct).toLowerCase().replace(/\s/g,'');
  const u = String(user).toLowerCase().replace(/\s/g,'');
  if(!u) return null;
  if(c.indexOf(u)>=0 || u.indexOf(c)>=0) return true;
  if(typeof checkFillAnswer==='function') return checkFillAnswer(u,c);
  return false;
}
function dailySubmit(idx){
  const dt = getDailyTraining();
  const item = dt.items[idx];
  if(dt.results && dt.results[item.id]){
    const q = dailyFindQuestion(item.id);
    if(q) renderDailyFeedback(idx, q, dt.results[item.id].correct, true);
    return;
  }
  const q = dailyFindQuestion(item.id);
  let isCorrect = false;
  let userVal = _dailySel;
  if(q.type==='choice'){ if(typeof _dailySel==='number') isCorrect = (_dailySel===q.answer); }
  else if(q.type==='judge'){ if(typeof _dailySel==='boolean') isCorrect = (_dailySel===q.answer); }
  else {
    const inp=document.getElementById('dq-fill-'+idx);
    const v=inp?inp.value.trim():'';
    const r=dailyFillMatch(v, q.answer);
    if(r===null){ toast('请输入答案','warning'); return; }
    isCorrect=r; userVal=v;
  }
  if(q.type!=='fill' && _dailySel===undefined){ toast('请先选择答案','warning'); return; }
  practiceState.answered.add(item.id);
  practiceState.answeredMap[item.id] = (q.type==='fill') ? userVal : _dailySel;
  if(isCorrect){ practiceState.correctIds.add(item.id); practiceState.wrongIds.delete(item.id); }
  else { practiceState.wrongIds.add(item.id); practiceState.correctIds.delete(item.id); }
  recordAttempt(item.id, isCorrect, Date.now()-(practiceState.shownAt[item.id]||Date.now()));
  savePracticeState();
  // 已答过的题（重新挑战/重交）不再重复给分、不重复记学习时长
  const alreadyScored = !!(dt.results && dt.results[item.id]);
  if(!alreadyScored){
    addStudyLog(item.subject, 'practice', 5);
    if(isCorrect){
      const pts = q.difficulty==='基础'?5:q.difficulty==='中等'?8:12;
      addPoints(pts, 'practice_correct', '每日训练答对('+q.subject+')');
    } else {
      addPoints(2, 'practice_wrong', '每日训练答错(鼓励分)');
    }
  }
  dailyUpdateMistake(item.id, item.subject, isCorrect);
  dt.results[item.id] = {correct:isCorrect, choice:_dailySel};
  const answered = Object.keys(dt.results).length;
  if(answered>=dt.items.length){
    dt.completed = true;
    if(!dt.awarded){ dt.score = (dt.score||0)+10; dt.awarded=true; addPoints(10,'daily_complete','完成今日训练'); }
  }
  save(SK.dailyTraining, dt);
  checkPerfectDay();
  // 禁用选项与提交按钮，防止提交后再修改答案
  if(q.type==='choice'){
    q.options.forEach((o,i)=>{ const el=document.getElementById('dq-opt-'+idx+'-'+i); if(el){ el.disabled=true; el.classList.remove('sel'); if(i===_dailySel) el.classList.add('sel'); } });
  } else if(q.type==='judge'){
    const t=document.getElementById('dq-opt-'+idx+'-t'), f=document.getElementById('dq-opt-'+idx+'-f');
    if(t){ t.disabled=true; t.classList.remove('sel'); if(_dailySel===true) t.classList.add('sel'); }
    if(f){ f.disabled=true; f.classList.remove('sel'); if(_dailySel===false) f.classList.add('sel'); }
  } else {
    const inp=document.getElementById('dq-fill-'+idx); if(inp) inp.disabled=true;
  }
  const subBtn=document.getElementById('dq-submit-'+idx); if(subBtn){ subBtn.disabled=true; subBtn.textContent='已提交'; }
  renderDailyFeedback(idx, q, isCorrect, false);
}
function renderDailyFeedback(idx, q, isCorrect, already){
  const dt = getDailyTraining();
  const item = dt.items[idx];
  const fb = document.getElementById('dq-feedback-'+idx);
  if(!fb || !q || !item) return;
  let hintHtml = '';
  if(q.hint){
    hintHtml = '<div class="dq-hint"><div class="dqh-title">📖 解析</div>'
      + '<div><b>思路：</b>'+dqEscape(q.hint.approach||'')+'</div>'
      + '<div><b>易错点：</b>'+dqEscape(q.hint.pitfall||'')+'</div>'
      + (q.hint.extension?'<div><b>拓展：</b>'+dqEscape(q.hint.extension)+'</div>':'')
      + '</div>';
  }
  const correctAns = q.type==='choice' ? String.fromCharCode(65+q.answer)+'. '+q.options[q.answer] : (q.type==='judge'?(q.answer?'正确':'错误'):q.answer);
  const statusLine = already ? (isCorrect?'✅ 已答对':'❌ 已答错') : (isCorrect?'✅ 回答正确！':'❌ 回答错误');
  let fbHtml = '<div class="dq-result '+(isCorrect?'ok':'bad')+'">'
    + '<div class="dqr-line">'+statusLine+'</div>'
    + '<div class="dqr-ans">正确答案：'+dqEscape(correctAns)+'</div>'
    + hintHtml
    + (!isCorrect?'<button class="btn btn-outline btn-sm" onclick="addToErrorsFromPractice(\''+item.id+'\',\''+item.subject+'\')">📝 加入错题本</button>':'')
    + (idx+1<dt.items.length
        ? '<button class="btn btn-primary btn-sm" onclick="renderDailyModal('+(idx+1)+')">下一题 →</button>'
        : '<button class="btn btn-primary btn-sm" onclick="finishDailyTraining()">完成今日训练 🎉</button>')
    + '</div>';
  fb.innerHTML = fbHtml;
}
function dailyShowHint(idx){
  const dt = getDailyTraining();
  const q = dailyFindQuestion(dt.items[idx].id);
  const fb = document.getElementById('dq-feedback-'+idx);
  if(!fb||!q||!q.hint) return;
  fb.innerHTML = '<div class="dq-hint"><div class="dqh-title">💡 提示</div><div>'+dqEscape(q.hint.approach||'')+'</div></div>';
}
function finishDailyTraining(){
  const dt = getDailyTraining();
  closeModal();
  renderPractice();
  const correct = Object.values(dt.results||{}).filter(r=>r&&r.correct).length;
  toast('🎉 今日训练完成！答对 '+correct+'/'+dt.items.length+(dt.awarded?'，+10 积分':''),'success');
}
function dqEscape(s){
  return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

  if(!practiceState.subject){

      const qs = activeBank()[s]||[];
      const answered = qs.filter(q=>practiceState.answered.has(q.id)).length;
      const correct = qs.filter(q=>practiceState.correctIds.has(q.id)).length;

      <div class="practice-stat"><div class="ps-icon total">%</div><div><div class="ps-val">${totalAnswered>0?Math.round(totalCorrect/totalAnswered*100):0}%</div><div class="ps-lbl">总正确率</div></div></div>
    </div>`;

  html += `<button class="btn btn-outline btn-sm" onclick="practiceState.subject=null;renderPractice()">← 返回科目选择</button>`;

function answerChoice(qid, optIdx){
  if(practiceState.answered.has(qid)) return;
  const subj = practiceState.subject;
  const q = (activeBank()[subj]||[]).find(x=>x.id===qid);
  if(!q) return;
  const isCorrect = optIdx===q.answer;
  practiceState.answered.add(qid);
  practiceState.answeredMap[qid] = optIdx;
  if(isCorrect){ practiceState.correctIds.add(qid); practiceState.wrongIds.delete(qid); }
  else { practiceState.wrongIds.add(qid); practiceState.correctIds.delete(qid); }
  recordAttempt(qid, isCorrect, Date.now()-(practiceState.shownAt[qid]||Date.now()));
  const firstScored = !practiceState.scoredIds.has(qid);
  practiceState.scoredIds.add(qid);
  savePracticeState();
  // 每道题积分与学习时长最多记一次：首次作答才给分/计时，重做/重置后重做不再重复
  if(firstScored){
    addStudyLog(subj, 'practice', 5);
    if(isCorrect){
      const pts = q.difficulty==='基础'?5:q.difficulty==='中等'?8:12;
      addPoints(pts, 'practice_correct', subj+'答题正确('+q.difficulty+')');
      toast('回答正确！+'+pts+'积分','success');
    } else {
      addPoints(2, 'practice_wrong', subj+'答题错误(鼓励分)');
      toast('回答错误，+2鼓励分，查看综合提示','error');
    }
  } else {
    toast(isCorrect?'本题已答对过，不再重复积分':'本题已作答过，不再重复积分','info');
  }
  checkPerfectDay();
  renderPractice();
  setTimeout(()=>{ document.getElementById('q-'+qid)?.scrollIntoView({behavior:'smooth',block:'center'}); },100);
}

function answerFill(qid){
  if(practiceState.answered.has(qid)) return;
  const subj = practiceState.subject;
  const q = (activeBank()[subj]||[]).find(x=>x.id===qid);
  if(!q) return;
  const input = document.getElementById('fill-'+qid);
  const userAns = (input.value||'').trim();
  if(!userAns){ toast('请输入答案','warning'); return; }
  // Flexible matching: check if key parts of answer are present
  const correctAns = q.answer.toLowerCase().replace(/\s/g,'');
  const userLower = userAns.toLowerCase().replace(/\s/g,'');
  const isCorrect = correctAns.includes(userLower) || userLower.includes(correctAns) || checkFillAnswer(userLower, correctAns);
  practiceState.answered.add(qid);
  practiceState.answeredMap[qid] = userAns;
  if(isCorrect){ practiceState.correctIds.add(qid); practiceState.wrongIds.delete(qid); }
  else { practiceState.wrongIds.add(qid); practiceState.correctIds.delete(qid); }
  recordAttempt(qid, isCorrect, Date.now()-(practiceState.shownAt[qid]||Date.now()));
  const firstScored = !practiceState.scoredIds.has(qid);
  practiceState.scoredIds.add(qid);
  savePracticeState();
  // 每道题积分与学习时长最多记一次：首次作答才给分/计时，重做/重置后重做不再重复
  if(firstScored){
    addStudyLog(subj, 'practice', 5);

      addPoints(pts, 'practice_correct', subj+'填空正确('+q.difficulty+')');

  }
  checkPerfectDay();
  renderPractice();

function checkFillAnswer(user, correct){
  // Extract key content between markers like ① ② or key numbers/words
  const correctParts = correct.split(/[①②③④⑤]/).filter(s=>s.length>1);
  if(correctParts.length>1){
    return correctParts.every(p=>user.includes(p.trim().toLowerCase()));
  }
  return false;
}

function addToErrorsFromPractice(qid, subj){
  const q = (activeBank()[subj]||[]).find(x=>x.id===qid);
  if(!q) return;
  const errors = loadArr(SK.errors, []);
  // Check if already added
  if(errors.some(e=>e.practiceId===qid)){
    toast('该题已在错题本中','warning');
    return;
  }
  const today = todayStr();
  const userAns = practiceState.answeredMap[qid];
  let userAnsStr = '';
  if(q.type==='choice') userAnsStr = String.fromCharCode(65+userAns)+'. '+q.options[userAns];
  else if(q.type==='judge') userAnsStr = userAns?'正确':'错误';
  else userAnsStr = String(userAns||'');

  const correctAnsStr = q.type==='choice' ? String.fromCharCode(65+q.answer)+'. '+q.options[q.answer] : q.answer;

  errors.push({
    id: uid(),
    subject: subj,
    knowledgePoint: q.knowledgePoint,
    question: q.question + '\n（你的答案：'+userAnsStr+'）',
    answer: '正确答案：'+correctAnsStr + '\n\n【解题思路】'+q.hint.approach + '\n【易错点】'+q.hint.pitfall,
    errorType: '练习错题',
    reviewCount: 0,
    nextReviewDate: today,
    status: 'reviewing',
    practiceId: qid,
    createdAt: new Date().toISOString()
  });
  save(SK.errors, errors);
  addPoints(3, 'add_error_practice', '从练习加入错题：'+q.knowledgePoint);
  toast('已加入错题本 +3积分，含综合提示','success');
}

function addStudyLog(subject, type, duration){
  const logs = loadArr(SK.logs, []);
  const today = todayStr();
  // Find today's log for this subject
  let existing = logs.find(l=>l.date===today && l.subject===subject && l.type===type);
  if(existing){
    existing.duration += duration;
  } else {
    logs.push({id:uid(), date:today, subject, duration, type, createdAt:new Date().toISOString()});
  }
  save(SK.logs, logs);
  updateStreak();
}

function checkGrowthPin(){
const pin = ['gpin-1','gpin-2','gpin-3','gpin-4'].map(function(id){ return document.getElementById(id).value; }).join('');
if(pin.length<4) return;
const settings = load(SK.settings, {});
if(!settings.parentPin){
  settings.parentPin = pin; save(SK.settings, settings);
  toast('密码已设置','success'); statsUnlocked = true;
  closeModal(); renderGrowth();
} else if(settings.parentPin === pin){
  statsUnlocked = true;
  closeModal(); toast('已解锁','success'); renderGrowth();
} else {
  toast('密码错误','error');
  ['gpin-1','gpin-2','gpin-3','gpin-4'].forEach(function(id){ const e=document.getElementById(id); if(e) e.value=''; });
  const e=document.getElementById('gpin-1'); if(e) e.focus();
}
}

// ===== Data Export/Import =====
function exportData(){
  const data = {};
  Object.values(SK).forEach(k=>{
    const v = _lsGet(k);
    if(v) data[k] = JSON.parse(v);
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '学习工作台备份_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('备份已导出','success');
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      Object.entries(data).forEach(([k,v])=>{
        if(Object.values(SK).includes(k)){
          _lsSet(k, JSON.stringify(v));
        }
      });
      toast('数据已恢复','success');
      switchTab('today');
    }catch(err){
      toast('文件格式错误','error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== Modal =====
function showModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-overlay show" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';
}
function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
}

// 自定义确认对话框：替代原生 confirm()，在浏览器与 Android WebView(APK) 中都能正常弹出
function confirmDialog(message, opts){
  opts = opts || {};
  var okText = opts.okText || '确定';
  var cancelText = (opts.cancelText !== undefined) ? opts.cancelText : '取消';
  var danger = opts.danger ? 'btn-danger' : 'btn-primary';
  var root = document.getElementById('modal-root');
  return new Promise(function(resolve){
    function done(v){ root.innerHTML = ''; resolve(v); }
    root.innerHTML =
      '<div class="modal-overlay show" id="cd-overlay">'+
        '<div class="modal modal-confirm">'+
          '<div class="modal-confirm-body">'+escHtml(message)+'</div>'+
          '<div class="modal-confirm-actions">'+
            (cancelText ? '<button class="btn btn-outline" id="cd-cancel">'+escHtml(cancelText)+'</button>' : '')+
            '<button class="btn '+danger+'" id="cd-ok">'+escHtml(okText)+'</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    var overlay = document.getElementById('cd-overlay');
    overlay.addEventListener('click', function(e){ if(e.target===overlay) done(false); });
    document.getElementById('cd-ok').addEventListener('click', function(){ done(true); });
    if(cancelText){ document.getElementById('cd-cancel').addEventListener('click', function(){ done(false); }); }
  });
}

const COOKING_DONE_SK = 'wb_study_cooking_done';
function mergeCooking(d){
  if(!d || typeof d!=='object') return;
  if(Array.isArray(d.recipes)) COOKING_CONTENT.recipes = mergeById(COOKING_CONTENT.recipes, d.recipes);
  if(Array.isArray(d.tips)) COOKING_CONTENT.tips = mergeById(COOKING_CONTENT.tips, d.tips);
}
function dayNumber(){
  const d = todayStr().split('-');
  const y=+d[0], m=+d[1], day=+d[2];
  const a = Math.floor((14-m)/12);
  const yy = y + 4800 - a;
  const mm = m + 12*a - 3;
  return day + Math.floor((153*mm+2)/5) + 365*yy + Math.floor(yy/4) - Math.floor(yy/100) + Math.floor(yy/400) - 32045;
}
// 每天必定变化：用"距纪元天数"做偏移，并以与题数互质的步长(7)分散取菜，
// 保证隔日菜单跨度大、几乎不重复同一天，周期约 18 天一轮。
function cookingDailyList(n){
  const arr = COOKING_CONTENT.recipes;
  const N = arr.length;
  if(!N) return [];
  n = n || 3;
  const day = dayNumber();
  const start = day % N;
  const step = 7;
  const list = [];
  for(let i=0;i<n && i<N;i++) list.push(arr[(start + i*step) % N]);
  return list;
}
function cookingDailyPick(){
  const arr = COOKING_CONTENT.recipes;
  if(!arr.length) return null;
  return cookingDailyList(1)[0] || null;
}

function activeInterests(){
  const ac = getActiveChild();
  const arr = (ac && Array.isArray(ac.interests)) ? ac.interests : [];
  return arr.filter(function(t){ return INTEREST_CONTENT[t]; });
}
function interestNews(){
  const out = [];
  activeInterests().forEach(function(t){ const c = INTEREST_CONTENT[t]; if(c && c.news) out.push.apply(out, c.news); });
  return out;
}
function interestKnowledge(){
  const out = [];
  activeInterests().forEach(function(t){ const c = INTEREST_CONTENT[t]; if(c && c.knowledge) out.push.apply(out, c.knowledge); });
  return out;
}

function regionKnowledge(){ const r = REGION_CONTENT[activeRegion()] || REGION_CONTENT._default; return (r && r.knowledge && r.knowledge.length) ? r.knowledge : REGION_CONTENT._default.knowledge; }
function refreshInfoPools(){
  // 通用大库（NEWS_ITEMS / KNOWLEDGE_ARTICLES）作为基础内容层，确保即使某地区/远程内容缺失也有稳定可读内容
  var baseNews = (Array.isArray(LIVE_NEWS) && LIVE_NEWS.length) ? LIVE_NEWS : NEWS_ITEMS;
  NEWS_POOL = mergeById(mergeById(mergeById(baseNews, regionNews()), REMOTE_NEWS), interestNews());
  KNOWLEDGE_POOL = mergeById(mergeById(mergeById(KNOWLEDGE_ARTICLES, regionKnowledge()), REMOTE_KNOWLEDGE), interestKnowledge());
  NEWS_TIPS = mergeStrings(NT_EMBED, REMOTE_NEWS_TIPS);
  KNOWLEDGE_TIPS = mergeStrings(KT_EMBED, REMOTE_KNOWLEDGE_TIPS);
  if(typeof INFO_BOARDS!=='undefined'){
    INFO_BOARDS.news.pool = NEWS_POOL; INFO_BOARDS.news.tips = NEWS_TIPS;
    INFO_BOARDS.knowledge.pool = KNOWLEDGE_POOL; INFO_BOARDS.knowledge.tips = KNOWLEDGE_TIPS;
  }
}

// 文章配图：按分类取主题 emoji + 分类色渐变，生成离线可用的封面（无需外部图片）
const CAT_EMOJI = {'科学探索':'🔬','科技前沿':'🤖','自然万物':'🌿','历史故事':'📜','社会百科':'🌐','健康生活':'💪','文化艺术':'🎨','趣味常识':'💡'};
function articleCover(a, cfg, variant){
  const color = (cfg && cfg.catColor && cfg.catColor[a.category]) || '#5C9DF5';
  const emoji = CAT_EMOJI[a.category] || '📚';
  if(variant==='card'){
    return '<div class="news-card-cover" style="background:linear-gradient(135deg,'+color+',rgba(0,0,0,.28))"><span class="ncc-emoji">'+emoji+'</span></div>';
  }
  return '<div class="news-detail-cover" style="background:linear-gradient(135deg,'+color+',rgba(0,0,0,.28))"><div class="ndc-emoji">'+emoji+'</div><div class="ndc-cat">'+escHtml(a.category)+'</div></div>';
}

function seededNewsShuffle(arr, seed){
  const a = arr.slice();
  let s = seed >>> 0;
  for(let i=a.length-1;i>0;i--){
    s = (Math.imul(s,1664525) + 1013904223) >>> 0;
    const j = s % (i+1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function getDailyInfo(kind){
  const cfg = INFO_BOARDS[kind];
  const dateStr = todayStr();
  const pool = cfg.pool || [];
  const N = pool.length;
  // 每日版面：按"距纪元天数"取一个确定性滑动窗口，保证隔日不同、整轮后循环
  const DAILY_COUNT = (kind==='news') ? 6 : 5;
  const windowList = [];
  if(N>0){
    const start = dayNumber() % N;
    const count = Math.min(DAILY_COUNT, N);
    for(let i=0;i<count;i++) windowList.push(pool[(start+i)%N]);
  }
  // 头条在当日版面内稳定选取，既每天不同又不会随刷新乱跳
  let h = 2166136261;
  for(let i=0;i<dateStr.length;i++){ h ^= dateStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  h = h >>> 0;
  let featured = windowList.length ? windowList[0] : (pool[0]||null);
  if(kind==='news' && Array.isArray(LIVE_NEWS) && LIVE_NEWS.length) featured = LIVE_NEWS[0];
  const tip = (cfg.tips && cfg.tips.length) ? cfg.tips[h % cfg.tips.length] : '';
  return { date:dateStr, featured:featured, tip:tip, window:windowList };
}

    return;
  }
  const read = loadArr(cfg.readSK, []);

  let html = '<div class="news-daily-banner">'
    + '<div class="ndb-left"><span class="ndb-badge">'+cfg.emoji+' '+escHtml(cfg.bannerLabel)+'</span>'
    + '<div style="min-width:0"><div class="ndb-title">'+escHtml(feat.title)+'</div>'
    + '<div class="ndb-meta">'+feat.category+' · 约'+feat.readMin+'分钟 · 今日已读 '+todayRead+' 篇'+(feat.source?(' · '+escHtml(feat.source)):'')+'</div>'
    + '<div class="ndb-tip">'+escHtml(dn.tip)+'</div></div></div>'
    + '<button class="btn btn-primary btn-sm" onclick="openInfoArticle(\''+kind+'\',\''+feat.id+'\')">开始阅读</button>'
    + '</div>';

  html += '<div class="news-toolbar">'
    + '<input class="news-search" id="'+kind+'-search" placeholder="🔍 搜索感兴趣的内容…" value="'+escAttr(st.search)+'" oninput="infoState[\''+kind+'\'].search=this.value;renderInfoGrid(\''+kind+'\')">'
    + (kind==='news' ? '<button class="news-refresh" style="margin-left:8px" onclick="fetchDailyNews({toast:true})" title="拉取最新新闻">↻ 刷新</button>' : '')
    + '<div class="news-cats">';
  ['全部'].concat(cfg.cats).forEach(c=>{
    html += '<button class="news-cat" data-cat="'+escAttr(c)+'" data-kind="'+kind+'" onclick="infoState[\''+kind+'\'].cat=\''+escAttr(c)+'\';renderInfoGrid(\''+kind+'\')">'+escHtml(c)+'</button>';
  });
  html += '</div></div>';

  html += '<div class="news-grid" id="'+kind+'-grid"></div>';
  const root = document.getElementById('tab-'+kind);
  root.innerHTML = html;
  renderInfoGrid(kind);

function renderInfoGrid(kind){
  const cfg = INFO_BOARDS[kind];
  const st = infoState[kind];
  const dn = getDailyInfo(kind);
  const read = loadArr(cfg.readSK, []);
  const readSet = new Set(read.map(r=>r.id));

  let list = (dn.window && dn.window.length) ? dn.window.slice() : cfg.pool.slice();
  if(st.cat!=='全部') list = list.filter(a=>a.category===st.cat);
  if(st.search){
    const q = st.search.toLowerCase();
    list = list.filter(a=>(a.title+a.summary+a.category).toLowerCase().includes(q));
  }
  list.sort((a,b)=> (b.id===dn.featured.id?1:0) - (a.id===dn.featured.id?1:0));

  let html = '';
  if(list.length===0){
    html = '<div class="empty-state" style="grid-column:1/-1"><p>没有找到相关内容，换个关键词试试～</p></div>';
  } else {
    list.forEach(a=>{
      const isRead = readSet.has(a.id);
      const isFeat = a.id===dn.featured.id;
            html += '<div class="news-card '+(isFeat?'featured':'')+'" onclick="openInfoArticle(\''+kind+'\',\''+a.id+'\')">'
        + articleCover(a, cfg, 'card')
        + '<div class="news-card-top"><span class="news-tag" style="background:'+cfg.catColor[a.category]+'">'+escHtml(a.category)+'</span>'
        + (isFeat?'<span class="news-feat-flag">今日推荐</span>':'')
        + (isRead?'<span class="news-read-flag">✓ 已读</span>':'')
        + '</div>'
        + '<div class="news-card-title">'+escHtml(a.title)+'</div>'
        + '<div class="news-card-summary">'+escHtml(a.summary)+'</div>'
        + '<div class="news-card-foot">⏱ 约'+a.readMin+'分钟阅读</div>'
        + '</div>';
    });
  }
  const grid = document.getElementById(kind+'-grid');
  if(grid) grid.innerHTML = html;
  document.querySelectorAll('.news-cat[data-kind="'+kind+'"]').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-cat')===st.cat);
  });
}
function openInfoArticle(kind, id){
  const cfg = INFO_BOARDS[kind];
  const a = cfg.pool.find(x=>x.id===id);
  if(!a) return;
  const read = loadArr(cfg.readSK, []);
  const isRead = read.some(r=>r.id===id);
  let body = '';
  (a.paras||[]).forEach(p=> body += '<p>'+escHtml(p)+'</p>');
  const html = '<div class="modal-header"><h3>'+escHtml(a.title)+'</h3><button class="modal-close" onclick="closeModal()">×</button></div>'

// ===== 联网自动更新内容（Remote Content Update） =====
// 机制：安装包内置一份内容池；应用每次启动会联网拉取最新内容(JSON)并合并（同 id 覆盖、新 id 追加）。
// 联网失败或离线时，自动回退到内置内容，不影响使用。
// 原生 Android 层负责联网下载，再调用 window.__applyRemoteContent(json) 合并并刷新界面。
// 网页自身也会尝试用 CONTENT_URL 拉取（需服务器允许跨域 Access-Control-Allow-Origin:*），作为免编程打包的备选。
let REMOTE = null;

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _sanitizeNode(v){
  if(typeof v==='string') return escHtml(v);
  if(Array.isArray(v)) return v.map(_sanitizeNode);
  if(v && typeof v==='object'){ var o={}; for(var k in v){ o[k]=_sanitizeNode(v[k]); } return o; }
  return v;
}
function mergeById(base, extra){
  var arr=(base||[]).slice(), map={};
  arr.forEach(function(x){ if(x&&x.id) map[x.id]=x; });
  (extra||[]).forEach(function(x){ if(x&&x.id) map[x.id]=x; });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function mergeStrings(base, extra){
  var set={};
  (base||[]).forEach(function(s){ if(s!=null) set[s]=1; });
  (extra||[]).forEach(function(s){ if(s!=null) set[s]=1; });
  return Object.keys(set);
}
