// 实时新闻：每次打开/每天自动从新闻源拉取最新时事
// 数据源：中国新闻网（中新网）scroll-news RSS —— 真正的当日实时滚动新闻（实测返回 2026-08-16 当天新闻）。
// 该源自带 Access-Control-Allow-Origin:*，浏览器/WebView 可直接跨域抓取，无需代理或部署，打开即每天实时更新。
var NEWS_FEED_URL = 'https://www.chinanews.com/rss/scroll-news.xml';
var LIVE_NEWS = [];          // 实时抓取到的新闻数组（成功后覆盖内置人民日报池）
function decodeEnt(s){ return (s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#(\d+);/g,function(_,n){return String.fromCharCode(+n);}).replace(/&nbsp;/g,' '); }
function parseRssNews(xml){
  var out = [];
  if(!xml || typeof xml!=='string') return out;
  try{
    var doc = new DOMParser().parseFromString(xml, 'text/xml');
    var items = doc.getElementsByTagName('item');
    for(var i=0;i<items.length && out.length<30;i++){
      var it = items[i];
      var g = function(t){ var e = it.getElementsByTagName(t)[0]; return e ? decodeEnt(e.textContent||'').trim() : ''; };
      var title = g('title');
      var link = g('link');
      var desc = g('description').replace(/<[^>]*>/g,'').replace(/^[　\s]+/,'').replace(/\s+/g,' ').trim();
      if(!title) continue;
      var summary = desc.length>72 ? desc.slice(0,72)+'…' : desc;
      var paras = [];
      var re = /[^。！？；]+[。！？；]?/g, mm;
      while((mm = re.exec(desc)) !== null){ var s = mm[0].trim(); if(s){ paras.push(s); if(paras.length>=4) break; } }
      if(!paras.length) paras = [title];
      var id = 'live_' + (link || title).replace(/[^a-zA-Z0-9]/g,'').slice(-22);
      if(!id || id==='live_') id = 'live_' + i;
      out.push({ id:id, category:'时事新闻', title:title, readMin:Math.max(2, Math.round((desc.length||title.length)/120)), summary:(summary||title), paras:paras, source:'中国新闻网', link:link, pubDate:g('pubDate') });
    }
  }catch(e){ console.warn('[实时新闻]解析失败', e); }
  return out;
}
// 拉取当天实时新闻：当天已拉过则使用本地缓存（避免重复请求）；force=true 时强制刷新
function fetchDailyNews(opts){
  opts = opts || {};
  if(typeof fetch!=='function'){ if(opts.toast) toast('当前环境不支持联网更新','error'); return; }

    if(!same){ LIVE_NEWS = cached.items; refreshInfoPools(); }
    if(!opts.force){ return; }
  }
  fetch(NEWS_FEED_URL, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(xml){
      var arr = parseRssNews(xml);
      if(arr.length){
        LIVE_NEWS = arr;
        save(SK.liveNewsCache, {date:today, items:arr});
        refreshInfoPools(); safeRerender();
        if(opts.toast) toast('✅ 今日新闻已更新（'+arr.length+'条）','success');
      } else if(opts.toast){
        toast('⚠️ 新闻源暂未返回内容，显示备用内容','error');
      }
    })
    .catch(function(e){
      if(opts.toast) toast('❌ 新闻更新失败，显示备用内容：'+(e&&e.message?e.message:'网络错误'),'error');
    });
}
var _bankMemo = {};          // 按学段合并后的题库缓存

// 题目结构校验：坏题跳过，避免渲染崩溃
function validateQuestion(q){
  if(!q || typeof q!=='object') return false;
  if(typeof q.id!=='string' && typeof q.id!=='number') return false;
  if(typeof q.question!=='string' || !q.question.trim()) return false;
  if(!Array.isArray(q.options) || q.options.length < 2) return false;
  if(typeof q.answer!=='number' || q.answer < 0 || q.answer >= q.options.length) return false;
  return true;
}
// 合并内置题库与远程题库（按学段、按科目）：同 id 取 version 大者；archived/retire 剔除
function mergeQuestionsMeta(base, extra){
  var out = {};
  for(var k in (base||{})) out[k] = (base[k]||[]).slice();
  for(var k2 in (extra||{})){
    if(!out[k2]) out[k2] = [];
    var map = {}; out[k2].forEach(function(q){ if(q && q.id!=null) map[q.id] = q; });
    (extra[k2]||[]).forEach(function(q){
      if(!validateQuestion(q)){ console.warn('[远程]跳过无效题目', q && q.id); return; }
      q = normQuestion(q);
      if(q.status === 'archived'){ delete map[q.id]; return; }
      var ex = map[q.id];
      if(!ex || (q.version||1) >= (ex.version||1)) map[q.id] = q;
    });
    out[k2] = Object.keys(map).map(function(id){ return map[id]; });
  }
  return out;
}
// 计算某学段的最终题库（内置 + 远程 + 下架过滤），带缓存
function bankForStage(stage){
  stage = stage || '初中';
  if(_bankMemo[stage]) return _bankMemo[stage];
  var base = STAGED_BANK[stage] || STAGED_BANK['初中'];
  var merged = mergeQuestionsMeta(base, REMOTE_QUESTIONS[stage] || {});
  var retire = REMOTE_RETIRE[stage] || [];
  if(retire.length){
    var rs = {}; retire.forEach(function(id){ rs[id] = 1; });
    Object.keys(merged).forEach(function(subj){
      merged[subj] = (merged[subj]||[]).filter(function(q){ return !rs[q.id]; });
    });
  }
  _bankMemo[stage] = merged;
  return merged;
}
function _invalidateBank(){ _bankMemo = {}; }

// 规范化远程 homeWelcome（对象数组或字符串数组）→ {title,sub,emoji}
function _applyHomeWelcome(arr){

  var hw = arr.map(function(x){

    if(typeof x==='string' && x.trim()) return { title:x.trim(), sub:'', emoji:'🌟' };
    return null;
  }).filter(function(x){ return x && typeof x.title==='string' && x.title.trim(); });
  if(hw.length) HOME_WELCOME = hw;
}

function applyRemoteContent(d, doRender){
  if(!d || typeof d!=='object') return;
  REMOTE = d; save(SK.remote, d);
  // 远程题库：按学段分别缓存（legacy 单文件默认写入当前激活学段）
  if(d.questions && typeof d.questions==='object'){

    REMOTE_QUESTIONS[sk] = d.questions;
  }
  if(d.retire && typeof d.retire==='object') REMOTE_RETIRE = d.retire;
  if(d.news) REMOTE_NEWS = d.news;
  if(d.knowledge) REMOTE_KNOWLEDGE = d.knowledge;
  if(d.newsTips) REMOTE_NEWS_TIPS = d.newsTips;
  if(d.knowledgeTips) REMOTE_KNOWLEDGE_TIPS = d.knowledgeTips;
  if(d.interests && typeof d.interests==='object'){
    Object.keys(d.interests).forEach(function(tag){
      INTEREST_CONTENT[tag] = INTEREST_CONTENT[tag] || { news:[], knowledge:[] };
      if(d.interests[tag].news) INTEREST_CONTENT[tag].news = mergeById(INTEREST_CONTENT[tag].news, d.interests[tag].news);
      if(d.interests[tag].knowledge) INTEREST_CONTENT[tag].knowledge = mergeById(INTEREST_CONTENT[tag].knowledge, d.interests[tag].knowledge);

  if(Array.isArray(d.homeWelcome) && d.homeWelcome.length) _applyHomeWelcome(d.homeWelcome);

  if(d.cspLessons) REMOTE_CSP_LESSONS = d.cspLessons;

// 离线安全：先用本地缓存的 manifest + 各学段文件重建远程内容，再尝试联网刷新

    _invalidateBank(); refreshInfoPools();
  } else {

function _baseDir(url){ var i = url.lastIndexOf('/'); return i >= 0 ? url.slice(0, i+1) : ''; }
function _resolveUrl(base, file){ if(/^https?:\/\//.test(file)) return file; return base + file; }
function _stageCacheKey(stage){ return SK.remoteStageCache + ':' + stage; }

function safeRerender(){
  try{ renderToday(); }catch(e){}

// 联网拉取：支持 manifest（分学段按需拉取 + version 门控）与 legacy 单文件回退
function fetchRemoteContent(opts){
  opts = opts || {};
  var url = ((load(SK.contentUrl)||'').trim()) || CONTENT_URL;
  if(typeof fetch!=='function' || !url){ if(opts.toast) toast('当前环境不支持联网更新','error'); return; }
  var base = _baseDir(url);
  fetch(url + (url.indexOf('?')>=0 ? '&' : '?') + '_=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      d = _sanitizeNode(d);
      if(d && d.stages && typeof d.stages==='object'){
        // —— manifest 模式：只拉激活学段，version 未变则走缓存 ——
        save(SK.remoteManifestCache, d);
        save(SK.remoteManifestVer, d.version || 0);
        REMOTE_RETIRE = d.retire || {};
        REMOTE_NEWS = d.news || null; REMOTE_KNOWLEDGE = d.knowledge || null;
        REMOTE_NEWS_TIPS = d.newsTips || null; REMOTE_KNOWLEDGE_TIPS = d.knowledgeTips || null;
        if(Array.isArray(d.homeWelcome) && d.homeWelcome.length) _applyHomeWelcome(d.homeWelcome);
        if(d.cooking && typeof d.cooking==='object') mergeCooking(d.cooking);
        if(d.cspLessons) REMOTE_CSP_LESSONS = d.cspLessons;
        if(d.cspProblems) REMOTE_CSP_PROBLEMS = d.cspProblems;
        var stage = activeStage();
        var sf = d.stages[stage];
        var p = Promise.resolve();
        if(sf && sf.file){
          var cached = load(_stageCacheKey(stage), null);
          if(!cached || cached.version !== sf.version){
            var furl = _resolveUrl(base, sf.file) + '?v=' + (sf.version || Date.now());
            p = p.then(function(){
              return fetch(furl, {cache:'force-cache'}).then(function(r2){ return r2.json(); }).then(function(qd){
                var qmap = (qd && (qd.questions || qd)) || {};
                REMOTE_QUESTIONS[stage] = qmap;
                save(_stageCacheKey(stage), {version:sf.version, data:qmap});
              }).catch(function(e){ console.warn('[远程]学段文件拉取失败', stage, e); });
            });
          } else { REMOTE_QUESTIONS[stage] = cached.data; }
        }
        return p.then(function(){
          _invalidateBank(); refreshInfoPools();
          save(SK.remote, { stage:stage, questions:REMOTE_QUESTIONS[stage], news:REMOTE_NEWS, knowledge:REMOTE_KNOWLEDGE, retire:REMOTE_RETIRE, newsTips:REMOTE_NEWS_TIPS, knowledgeTips:REMOTE_KNOWLEDGE_TIPS, homeWelcome:REMOTE_HOME, cooking:d.cooking||null, cspLessons:REMOTE_CSP_LESSONS, cspProblems:REMOTE_CSP_PROBLEMS });
          save(SK.remoteUpdated, Date.now());
          if(opts.toast) toast('✅ 远程内容已更新（' + stage + '）', 'success');
          if(typeof renderPractice==='function') renderPractice();
          safeRerender();
        });
      } else {
        // —— legacy 单文件模式（兼容旧 content-*.json）——
        applyRemoteContent(d, opts.render !== false);
        save(SK.remoteUpdated, Date.now());
        if(opts.toast) toast('✅ 远程内容已更新', 'success');
      }
    })
    .catch(function(e){ if(opts.toast) toast('❌ 同步失败：' + (e && e.message ? e.message : '网络错误'), 'error'); });
}

function remoteSyncCardHtml(){
  var url = ((load(SK.contentUrl)||'').trim()) || CONTENT_URL;

  var tStr = t ? new Date(t).toLocaleString('zh-CN') : '从未';
  return '<div class="card" style="margin-bottom:12px">'
    + '<div class="card-header"><div class="card-title">🔄 题库/内容 · 远程同步</div></div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">'
    + '<input id="remote-url" value="'+escAttr(url)+'" placeholder="远程 manifest/JSON 地址" style="flex:1;min-width:220px;padding:8px;border:1px solid var(--c-border);border-radius:8px;font-size:13px">'
    + '<button class="btn btn-primary btn-sm" onclick="saveRemoteUrlAndSync()">💾 保存并同步</button>'
    + '<button class="btn btn-outline btn-sm" onclick="syncRemoteNow()">🔄 立即同步</button>'
    + '</div>'
    + '<div style="font-size:12px;color:var(--c-text-light);margin-top:6px">上次成功更新：'+escHtml(tStr)+' ｜ 支持 manifest（分学段）或旧版单文件；离线时自动用本地缓存</div>'
    + analyticsBlockHtml()
    + '</div>';
}
function saveRemoteUrlAndSync(){
  var el = document.getElementById('remote-url');
  if(el) save(SK.contentUrl, el.value.trim());
  syncRemoteNow();
}
function syncRemoteNow(){
  var url = ((load(SK.contentUrl)||'').trim()) || CONTENT_URL;
  if(typeof fetch!=='function'){ toast('当前环境不支持联网更新','error'); return; }
  if(!url){ toast('请先填写远程 JSON 地址','error'); return; }
  toast('正在从远程同步…','info');
  fetchRemoteContent({toast:true, render:true});
}
// 内置内容引用（每次都从内置重新合并，保证幂等）
const NT_EMBED = NEWS_TIPS;
const KT_EMBED = KNOWLEDGE_TIPS;
const HW_EMBED = HOME_WELCOME;

// ===== 学情反馈闭环（本地统计，纯离线，为「实时更新题目」指明方向）=====
function recordAttempt(qid, isCorrect, ms){
  if(qid==null) return;
  var a = load(SK.analytics, {});
  var r = a[qid] || {attempts:0, correct:0, wrong:0, totalMs:0, lastMs:0};
  r.attempts++; if(isCorrect) r.correct++; else r.wrong++;
  r.totalMs += (ms||0); r.lastMs = (ms||0);
  a[qid] = r; save(SK.analytics, a);
}
function _lookupQuestion(qid){
  var bank = activeBank();
  for(var subj in bank){
    var arr = bank[subj]||[];
    for(var i=0;i<arr.length;i++){ if(arr[i].id===qid) return {subject:subj, q:arr[i]}; }
  }
  return null;
}
// 产出「待复核」清单：错率高 或 平均耗时长 的题排在前面
function analyticsReport(topN){
  topN = topN || 12;
  var a = load(SK.analytics, {});
  var rows = [];
  Object.keys(a).forEach(function(qid){
    var r = a[qid]; if(!r || !r.attempts) return;
    var total = r.wrong + r.correct; if(!total) return;
    var wrongRate = r.wrong/total;
    var avgMs = total ? Math.round(r.totalMs/total) : 0;
    if(wrongRate < 0.34 && avgMs < 12000) return; // 准确尚可且不太慢的忽略
    var meta = _lookupQuestion(qid);
    rows.push({
      qid: qid,
      subject: meta ? meta.subject : '',
      knowledgePoint: meta ? (meta.q.knowledgePoint||'') : '',
      chapter: meta ? (meta.q.chapter||'') : '',
      difficulty: meta ? (meta.q.difficulty||'') : '',
      cognitiveLevel: meta ? (meta.q.cognitiveLevel||'') : '',
      version: meta ? (meta.q.version||1) : 1,
      attempts: r.attempts, correct: r.correct, wrong: r.wrong,
      wrongRate: Math.round(wrongRate*100), avgMs: avgMs
    });
  });
  rows.sort(function(x,y){ return (y.wrongRate - x.wrongRate) || (y.avgMs - x.avgMs); });
  return rows.slice(0, topN);
}
function exportAnalytics(){
  var rows = analyticsReport(200);
  var payload = { exportedAt:new Date().toISOString(), stage:activeStage(), child:(getActiveChild()||{}).name||'', items:rows };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'analytics-' + activeStage() + '-' + ((getActiveChild()&&getActiveChild().name)||'child') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast('已导出学情报告（'+rows.length+' 题）','success');
}
function analyticsBlockHtml(){
  var rows = analyticsReport(8);
  var body = rows.length
    ? rows.map(function(r){
        return '<div class="ptr-main" style="margin:6px 0">'
          + '<div class="ptr-content">'+escHtml((r.subject||'')+' · '+(r.knowledgePoint||''))+' <span class="tag tag-red">错率'+r.wrongRate+'%</span></div>'
          + '<div class="ptr-meta"><span class="tag tag-gray">'+escHtml(r.difficulty||'')+'</span><span class="tag tag-purple">'+escHtml(r.cognitiveLevel||'')+'</span><span class="tag tag-gray">'+r.wrong+'/'+r.attempts+'次</span>'+(r.avgMs?('<span class="tag tag-gray">均'+Math.round(r.avgMs/1000)+'s</span>'):'')+'</div></div>';
      }).join('')
    : '<div class="empty-state" style="padding:8px">暂无数据。让孩子多做「题库训练 / 每日训练」，这里会列出高频错题。</div>';
  return '<div style="margin-top:10px;border-top:1px dashed var(--c-border);padding-top:10px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleAnalytics()">'
    + '<div style="font-weight:700;font-size:14px">📊 学情反馈（待复核 Top）</div>'
    + '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();exportAnalytics()">⬇ 导出 JSON</button></div>'
    + '<div id="analytics-detail" style="display:none;margin-top:8px">'+body+'</div>'
    + '<div style="font-size:12px;color:var(--c-text-light);margin-top:6px">纯本地统计，不上传。导出的 JSON 可对照远程题库，决定该改/补哪些题。</div>'
    + '</div>';
}
function toggleAnalytics(){ var el=document.getElementById('analytics-detail'); if(el) el.style.display = el.style.display==='none'?'block':'none'; }

// ===== 孩子档案：引导填写 + 多孩子切换 =====
const REGION_OPTIONS = ['北京','上海','广东','四川','浙江','陕西','其它'];
const INTEREST_OPTIONS = ['编程','美术','科学','音乐','体育','天文','历史','阅读','烹饪'];
function modalHead(title){ return '<div class="modal-header"><div class="modal-title">'+escHtml(title)+'</div><button class="modal-close" onclick="closeModal()">✕</button></div>'; }
function childFormHtml(existing){
  const e = existing || {};
  const today = new Date().toISOString().slice(0,10);
  const regions = REGION_OPTIONS.map(function(r){ return '<option value="'+r+'"'+(e.region===r?' selected':'')+'>'+r+'</option>'; }).join('');
  return '<div class="modal-body">'
    + '  <div class="form-group"><label class="form-label">孩子姓名</label><input id="cf-name" value="'+escAttr(e.name||'')+'" placeholder="如：小明"></div>'
    + '  <div class="form-group"><label class="form-label">性别</label><div style="display:flex;gap:10px">'
    + '    <label class="seg"><input type="radio" name="cf-gender" value="男" '+(e.gender!=='女'?'checked':'')+'> 男</label>'
    + '    <label class="seg"><input type="radio" name="cf-gender" value="女" '+(e.gender==='女'?'checked':'')+'> 女</label></div></div>'
    + '  <div class="form-group"><label class="form-label">出生日期（用于推算年级）</label><input type="date" id="cf-birth" value="'+escAttr(e.birthDate||'2013-09-01')+'" max="'+today+'"></div>'
    + '  <div class="form-group"><label class="form-label">地区（决定本地新闻与常识）</label><select id="cf-region">'+regions+'</select></div>'
    + '  <div class="form-group"><label class="form-label">兴趣（决定个性化内容，可多选）</label><div id="cf-interests" class="interest-chips">'
    + INTEREST_OPTIONS.map(function(t){
        const on = (Array.isArray(e.interests) && e.interests.indexOf(t)>=0) ? ' checked' : '';
        return '<label class="chip"><input type="checkbox" name="cf-interest" value="'+escAttr(t)+'"'+on+'> '+escHtml(t)+'</label>';
      }).join('')
    + '  </div></div>'
    + '  <div id="cf-err" style="color:var(--c-danger);font-size:13px;min-height:18px"></div>'
    + '</div>'
    + '<div class="modal-footer">'
    + '  <button class="btn btn-outline" onclick="closeModal()">取消</button>'
    + '  <button class="btn btn-primary" onclick="submitChildForm('+(existing?('\''+e.id+'\''):'null')+')">保存</button>'
    + '</div>';
}
function submitChildForm(id){
  const name = (document.getElementById('cf-name').value||'').trim();
  const birth = document.getElementById('cf-birth').value;
  const region = document.getElementById('cf-region').value;
  const gen = document.querySelector('input[name=cf-gender]:checked');
  const gender = gen ? gen.value : '男';
  const interests = Array.prototype.slice.call(document.querySelectorAll('input[name=cf-interest]:checked')).map(function(x){ return x.value; });
  const err = document.getElementById('cf-err');
  if(!name){ err.textContent='请填写孩子姓名'; return; }
  if(!birth){ err.textContent='请选择出生日期'; return; }
  const data = { name:name, gender:gender, birthDate:birth, region:region, interests:interests };
  if(id){
    const list = loadArr(SK.children, []).map(function(c){ return c.id===id ? Object.assign({}, c, data) : c; });
    save(SK.children, list);
    const ac = getActiveChild();
    if(ac && ac.id===id){ refreshGrade(); refreshInfoPools(); webFetchRemote(); renderChildBadge(); renderWelcome(); }
    toast('已更新孩子信息','success');
    closeModal();
  } else {
    addChild(data);
    closeModal();
  }
}
function addChild(data){
  const child = Object.assign({ id: uid() }, data);
  const list = loadArr(SK.children, []);
  list.push(child);
  save(SK.children, list);
  save(SK.activeChild, child.id);
  refreshGrade();
  seedChildData(child);
  initDefaultData();
  refreshInfoPools();
  webFetchRemote();
  renderToday();
  updatePointsBadge();
  renderWelcome();
  checkAchievements();
  checkDailyChallenges();
  toast('已添加 '+child.name+'，学习内容已按年级与地区生成','success');
}
function ensureChildData(){
  const ac = getActiveChild();
  if(ac) seedChildData(ac);
}
function switchChild(id){
  const list = loadArr(SK.children, []);
  const child = list.find(function(c){ return c.id===id; });
  if(!child) return;
  save(SK.activeChild, id);
  refreshGrade();
  ensureChildData();
  refreshInfoPools();
  webFetchRemote();
  renderToday();
  updatePointsBadge();
  renderChildBadge();
  renderWelcome();
  closeModal();
  toast('已切换到 '+child.name,'success');
}
function deleteChild(id){
  confirmDialog('确定删除该孩子及其全部学习数据吗？此操作不可恢复。', { danger:true }).then(function(ok){
    if(!ok) return;
    const list = loadArr(SK.children, []).filter(function(c){ return c.id!==id; });
    save(SK.children, list);
    [SK.tasks, SK.errors, SK.logs, SK.dailyTraining, SK.mistakePool, SK.points, SK.streak, SK.practice, SK.pomodoro].forEach(function(k){
      try { _lsDel(k + ':' + id); } catch(e){}
    });
    const ac = getActiveChild();
    if(!ac || ac.id===id){
      if(list.length){ save(SK.activeChild, list[0].id); refreshGrade(); ensureChildData(); }
      else { remove(SK.activeChild); GRADE_INFO = computeGradeInfo(); renderChildBadge(); showOnboarding(); return; }
    }
    refreshGrade();
    refreshInfoPools();
    renderToday();
    renderChildBadge();
  });
}
function childManagerHtml(){
  const list = loadArr(SK.children, []);
  const active = getActiveChild();
  const rows = list.map(function(c){
    const g = computeGradeInfo(c.birthDate);
    const isActive = active && active.id===c.id;
    return '<div class="parent-task-row" style="margin-bottom:10px">'
      + '<div class="ptr-main"><div class="ptr-content">'+escHtml(c.name)+' <span class="tag tag-blue">'+escHtml(c.gender||'')+'</span></div>'
      + '<div class="ptr-meta"><span class="tag tag-gray">'+escHtml(g.displayLabel)+'</span><span class="tag tag-purple">'+escHtml(c.region||'其它')+'</span>'+(isActive?'<span class="tag tag-green">当前</span>':'')+'</div></div>'
      + '<div style="display:flex;gap:6px">'
      + (isActive?'':'<button class="btn btn-primary btn-sm" onclick="switchChild(\''+c.id+'\')">切换</button>')
      + '<button class="btn btn-outline btn-sm" onclick="showChildEditor(\''+c.id+'\')">编辑</button>'
      + '<button class="btn btn-danger btn-sm" onclick="deleteChild(\''+c.id+'\')">删除</button>'
      + '</div></div>';
  }).join('');
  return modalHead('孩子管理')
    + '<div class="modal-body">' + (rows || '<div class="empty-state">还没有添加孩子</div>')
    + '<button class="btn btn-accent" style="margin-top:12px;width:100%" onclick="openAddChild()">＋ 添加孩子</button></div>';
}
function openChildManager(){ showModal(childManagerHtml()); }
function openAddChild(){ showModal(modalHead('添加孩子') + childFormHtml(null)); }
function showChildEditor(id){
  const list = loadArr(SK.children, []);
  const c = list.find(function(x){ return x.id===id; });
  showModal(modalHead('编辑孩子信息') + childFormHtml(c || null));
}
function showOnboarding(){
  showModal(modalHead('欢迎使用学习台')
    + '<div class="modal-body"><p style="margin-bottom:6px;color:var(--c-text-light)">请先填写孩子信息：系统会根据<b>年龄</b>自动推算年级、决定练习题目，根据<b>地区</b>推送本地新闻与常识。</p></div>'
    + childFormHtml(null));
}
function bootstrapApp(){
  const children = loadArr(SK.children, []);
  if(children.length === 0){ showOnboarding(); return; }
  if(!getActiveChild()){ save(SK.activeChild, children[0].id); }
  refreshGrade();
  applyCachedRemote();
  ensureChildData();
  initDefaultData();
  refreshInfoPools();
  renderToday();
  updatePointsBadge();
  checkAchievements();
  checkDailyChallenges();
}

// 启动：先用本地缓存重建远程内容（离线可用），再尝试联网拉取最新
(function(){
  applyCachedRemote();
  webFetchRemote();
})();
bootstrapApp();

fetchDailyNews();

  if(document.visibilityState==='visible'){
    var c = load(SK.liveNewsCache, null);
    if(!c || c.date !== todayStr()) fetchDailyNews();
  }
});

// Check for data backup reminder

if(allErrors.length >= 30){
  setTimeout(()=>toast('数据已积累'+allErrors.length+'条错题，建议导出备份','warning'), 2000);
}
