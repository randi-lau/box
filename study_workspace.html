// ===== C++ Simulator (simplified) =====
function simulateCpp(code){
  const output = [];
  const errors = [];

  // Remove comments
  code = code.replace(/\/\/[^\n]*/g, '');
  code = code.replace(/\/\*[\s\S]*?\*\//g, '');

  // Process #define macros
  const defines = {};
  const defineRegex = /^#\s*define\s+(\w+)\s+(.+)$/gm;
  let dm;
  while((dm = defineRegex.exec(code)) !== null){
    defines[dm[1]] = dm[2].trim();
  }
  Object.keys(defines).forEach(k=>{
    code = code.replace(new RegExp('\\b'+k+'\\b','g'), defines[k]);
  });

  // Remove preprocessor directives
  code = code.replace(/^#\s*[^\n]*/gm, '');

  // Normalize long long, unsigned, size_t
  code = code.replace(/\blong\s+long\b/g, 'longlong');
  code = code.replace(/\bunsigned\s+int\b/g, 'uint');
  code = code.replace(/\bunsigned\b/g, 'uint');
  code = code.replace(/\bsize_t\b/g, 'int');
  code = code.replace(/\blonglong\b/g, 'long');

  // Extract main function body
  const mainMatch = code.match(/int\s+main\s*\(\s*\)\s*\{([\s\S]*)\}/);
  if(!mainMatch){
    // Try with int main() with args
    const mainMatch2 = code.match(/int\s+main\s*\([^)]*\)\s*\{([\s\S]*)\}/);
    if(!mainMatch2){
      errors.push('错误：找不到 main 函数');
      return {output:'', errors};
    }
    var body = mainMatch2[1];
  } else {
    var body = mainMatch[1];
  }

  // Remove "return 0;" or "return X;"
  body = body.replace(/return\s+[^;]*;/g, '');

  const vars = {};
  const arrays = {};

  function evalExpr(expr){
    expr = expr.trim();
    // String literal
    const strMatch = expr.match(/^"([^"]*)"$/);
    if(strMatch) return strMatch[1];
    // Char literal
    const charMatch = expr.match(/^'([^'])'$/);
    if(charMatch) return charMatch[1];
    // Number
    if(/^[-+]?\d+$/.test(expr)) return parseInt(expr);
    if(/^[-+]?\d*\.\d+$/.test(expr)) return parseFloat(expr);
    // Boolean
    if(expr==='true') return true;
    if(expr==='false') return false;

    // Variable reference
    if(expr in vars) return vars[expr];

    // String method: s.length()
    const strMethodMatch = expr.match(/^(\w+)\.length\(\)$/);
    if(strMethodMatch && typeof vars[strMethodMatch[1]] === 'string'){
      return vars[strMethodMatch[1]].length;
    }

    // Built-in functions
    const builtinMatch = expr.match(/^(\w+)\(([^)]*)\)$/);
    if(builtinMatch){
      const fn = builtinMatch[1];
      const args = builtinMatch[2].split(',').map(a=>evalExpr(a.trim()));
      if(fn==='abs') return Math.abs(args[0]);
      if(fn==='min') return Math.min(args[0], args[1]);
      if(fn==='max') return Math.max(args[0], args[1]);
      if(fn==='sqrt') return Math.sqrt(args[0]);
      if(fn==='pow') return Math.pow(args[0], args[1]);
      if(fn==='ceil') return Math.ceil(args[0]);
      if(fn==='floor') return Math.floor(args[0]);
      if(fn==='gcd') { let a=args[0],b=args[1]; while(b){let t=a%b;a=b;b=t;} return Math.abs(a); }
      if(fn==='tolower') return String(args[0]).toLowerCase();
      if(fn==='toupper') return String(args[0]).toUpperCase();
    }

    // Array access: arr[idx]
    const arrMatch = expr.match(/^(\w+)\[(.+)\]$/);
    if(arrMatch && arrays[arrMatch[1]]){
      const idx = evalExpr(arrMatch[2]);
      return arrays[arrMatch[1]][idx];
    }

    // Ternary
    const ternMatch = expr.match(/^(.+?)\s*\?\s*(.+?)\s*:\s*(.+)$/);
    if(ternMatch){
      return evalExpr(ternMatch[1]) ? evalExpr(ternMatch[2]) : evalExpr(ternMatch[3]);
    }

    // --- Comparison & logical expression evaluator ---
    // Substitute known variables / array elements into a copy of the expression.
    function substVars(e){
      let s = e;
      // Resolve array element accesses arr[idx] first (idx may be a simple expression).
      // Must run before variable substitution, because arrays also register a scalar var.
      let guard = 0;
      let changed = true;
      while(changed && guard++ < 25){
        changed = false;
        s = s.replace(/(\w+)\[([^\]]+)\]/g, (mm, name, idxExpr)=>{
          if(!arrays[name]) return mm;
          const idx = evalArith(idxExpr.trim());
          if(typeof idx !== 'number' || isNaN(idx) || idx < 0 || idx >= arrays[name].length) return mm;
          changed = true;
          const v = arrays[name][idx];
          if(v === undefined || v === null) return '0';
          return typeof v==='string' ? ('"'+String(v).replace(/"/g,'\\"')+'"') : v;
        });
      }
      Object.keys(vars).forEach(k=>{
        const val = vars[k];
        const rep = typeof val==='string' ? ('"'+val.replace(/"/g,'\\"')+'"')
                    : typeof val==='boolean' ? (val?'true':'false')
                    : val;
        s = s.replace(new RegExp('\\b'+k+'\\b','g'), rep);
      });
      return s;
    }
    // Truthiness mirror of C++ (non-zero number / non-empty non-"false" string).
    function toTruthy(v){
      if(typeof v==='string') return v.length>0 && v!=='0' && v.toLowerCase()!=='false';
      if(typeof v==='boolean') return v;
      return !!v;
    }
    // Evaluate a pure arithmetic (or string concat) sub-expression, with common
    // C++ builtins injected so they also work inside comparisons.
    function evalArith(e){
      e = e.trim();
      const s = substVars(e);
      try{
        if(/^[-+*/%.\s\d()"'\w,]+$/.test(s)){
          const r = eval('(function(min,max,abs,sqrt,pow,ceil,floor,gcd,tolower,toupper){return ('+s+');})(Math.min,Math.max,Math.abs,Math.sqrt,Math.pow,Math.ceil,Math.floor,function(a,b){while(b){let t=a%b;a=b;b=t;}return Math.abs(a);},function(x){return String(x).toLowerCase();},function(x){return String(x).toUpperCase();})');
          if(typeof r==='number' && !isNaN(r)) return r;
          if(typeof r==='boolean') return r;
          if(typeof r==='string') return r;
        }
      }catch(_){}
      return undefined;
    }
    // Recursive evaluator: logical OR/AND/negation, then comparison, then arithmetic.
    function evalCmp(e){
      e = e.trim();
      if(e==='') return true;
      if(e.indexOf('||') !== -1){
        return e.split('||').some(x=>toTruthy(evalCmp(x)));
      }
      if(e.indexOf('&&') !== -1){
        return e.split('&&').every(x=>toTruthy(evalCmp(x)));
      }
      if(e[0]==='!' && e.slice(0,2)!=='!='){
        return !toTruthy(evalCmp(e.slice(1).trim()));
      }
      const ops = ['<=','>=','==','!=','<','>'];
      for(const op of ops){
        const idx = e.indexOf(op);
        if(idx > 0){
          const l = evalArith(e.slice(0, idx));
          const r = evalArith(e.slice(idx+op.length));
          if(op==='<=') return l<=r;
          if(op==='>=') return l>=r;
          if(op==='==') return l==r;
          if(op==='!=') return l!=r;
          if(op==='<')  return l<r;
          if(op==='>')  return l>r;
        }
      }
      const a = evalArith(e);
      if(a !== undefined) return a;
      // Unknown identifier: return raw string (truthy) rather than looping forever.
      return e;
    }
    return evalCmp(expr);
  }

  function processCout(line){
    // Match cout << expr << expr << ... << endl;
    const parts = line.match(/cout\s*(<<)/);
    if(!parts) return;

    let rest = line.replace(/^.*?cout\s*/,'');
    let result = '';
    let isFirst = true;

    while(rest.trim().startsWith('<<')){
      rest = rest.trim().slice(2).trim();
      let exprEnd = 0;
      let inString = false;
      let depth = 0;

      for(let i=0;i<rest.length;i++){
        if(rest[i]==='"' && rest[i-1]!=='\\') inString=!inString;
        if(rest[i]==="'" && rest[i-1]!=='\\') inString=!inString;
        if(!inString){
          if(rest[i]==='(') depth++;
          if(rest[i]===')') depth--;
          if(rest[i]==='<' && rest[i+1]==='<' && depth===0) break;
          if(rest[i]===';') break;
        }
        exprEnd = i+1;
      }
      let expr = rest.slice(0, exprEnd).trim();

      if(expr==='endl' || expr==='\\n'){
        result += '\n';
      } else if(expr===''){
        // skip
      } else {
        const val = evalExpr(expr);
        result += String(val);
      }
      rest = rest.slice(exprEnd);
    }

    output.push(result);
  }

  function processCin(line){
    // cin >> var;
    const match = line.match(/cin\s*>>\s*(\w+)/);
    if(match){
      const varName = match[1];
      // Simulate input with default values
      if(!(varName in vars)){
        vars[varName] = 0;
      }
      // Try to prompt - but since we can't do real input, use a default
      vars[varName] = prompt('请输入 '+varName+' 的值：') || '0';
      // Try to convert to number
      if(!isNaN(Number(vars[varName]))) vars[varName] = Number(vars[varName]);
    }
  }

  function processDeclaration(line){
    // int x = 5; or double y = 3.14; or string s = "hello";
    const match = line.match(/^(int|double|float|long|string|char|bool|uint)\s+(\w+)\s*=\s*([^,;]+?);$/);
    if(match){
      const type = match[1];
      const name = match[2];
      const val = evalExpr(match[3]);
      if(type==='int'||type==='uint') vars[name] = parseInt(val)||0;
      else if(type==='double'||type==='float'||type==='long') vars[name] = parseFloat(val)||0;
      else if(type==='bool') vars[name] = !!val;
      else vars[name] = val;
      return true;
    }
    // Multiple declarations WITH initializers: int a=2, b=3;
    const multiInitMatch = line.match(/^(int|double|float|long|string|char|bool|uint)\s+([^;]+);$/);
    if(multiInitMatch && multiInitMatch[2].includes('=') && !multiInitMatch[2].includes('{')){
      const type = multiInitMatch[1];
      multiInitMatch[2].split(',').forEach(n=>{
        n=n.trim();
        const eq = n.match(/^(\w+)\s*=\s*(.+)$/);
        if(eq){
          const val = evalExpr(eq[2]);
          if(type==='int'||type==='uint') vars[eq[1]] = parseInt(val)||0;
          else if(type==='double'||type==='float'||type==='long') vars[eq[1]] = parseFloat(val)||0;
          else if(type==='bool') vars[eq[1]] = !!val;
          else vars[eq[1]] = val;
        } else if(n.includes('[')){
          const arrMatch = n.match(/(\w+)\[(\d+)\]/);
          if(arrMatch){ arrays[arrMatch[1]] = new Array(parseInt(arrMatch[2])).fill(0); vars[arrMatch[1]] = 0; }
        } else {
          vars[n] = type==='int'||type==='uint'?0:type==='double'?0.0:type==='long'?0:type==='string'?'':type==='bool'?false:0;
        }
      });
      return true;
    }
    // Multiple declarations WITHOUT initializers: int a, b;
    const multiMatch = line.match(/^(int|double|float|long|string|char|bool|uint)\s+([^;]+);$/);
    if(multiMatch && !multiMatch[2].includes('=')){
      const type = multiMatch[1];
      multiMatch[2].split(',').forEach(n=>{
        n=n.trim();
        if(n.includes('[')){
          const arrMatch = n.match(/(\w+)\[(\d+)\]/);
          if(arrMatch){
            arrays[arrMatch[1]] = new Array(parseInt(arrMatch[2])).fill(0);
            vars[arrMatch[1]] = 0;
          }
        } else {
          vars[n] = type==='int'||type==='uint'?0:type==='double'?0.0:type==='long'?0:type==='string'?'':type==='bool'?false:0;
        }
      });
      return true;
    }
    // Array with init: int arr[5] = {1,2,3,4,5};
    const arrInitMatch = line.match(/^(int|double|float)\s+(\w+)\s*\[\s*\d*\s*\]\s*=\s*\{([^}]*)\};$/);
    if(arrInitMatch){
      const name = arrInitMatch[2];
      const vals = arrInitMatch[3].split(',').map(v=>{
        v=v.trim();
        return arrInitMatch[1]==='int'?parseInt(v)||0:parseFloat(v)||0;
      });
      arrays[name] = vals;
      return true;
    }
    return false;
  }

  function processAssignment(line){
    // x = expr; or x += expr; or x++; or x--;
    const assignMatch = line.match(/^(\w+)\s*=\s*(.+?);$/);
    if(assignMatch){
      vars[assignMatch[1]] = evalExpr(assignMatch[2]);
      return true;
    }
    const plusEq = line.match(/^(\w+)\s*\+=\s*(.+?);$/);
    if(plusEq){
      vars[plusEq[1]] = (vars[plusEq[1]]||0) + evalExpr(plusEq[2]);
      return true;
    }
    const minusEq = line.match(/^(\w+)\s*-=\s*(.+?);$/);
    if(minusEq){
      vars[minusEq[1]] = (vars[minusEq[1]]||0) - evalExpr(minusEq[2]);
      return true;
    }
    const multEq = line.match(/^(\w+)\s*\*=\s*(.+?);$/);
    if(multEq){
      vars[multEq[1]] = (vars[multEq[1]]||0) * evalExpr(multEq[2]);
      return true;
    }
    const incMatch = line.match(/^(\w+)\+\+;$/);
    if(incMatch){
      vars[incMatch[1]] = (vars[incMatch[1]]||0) + 1;
      return true;
    }
    const decMatch = line.match(/^(\w+)--;$/);
    if(decMatch){
      vars[decMatch[1]] = (vars[decMatch[1]]||0) - 1;
      return true;
    }
    // Array element assignment: arr[i] = val;
    const arrAssign = line.match(/^(\w+)\[(.+)\]\s*=\s*(.+?);$/);
    if(arrAssign && arrays[arrAssign[1]]){
      const idx = evalExpr(arrAssign[2]);
      arrays[arrAssign[1]][idx] = evalExpr(arrAssign[3]);
      return true;
    }
    return false;
  }

  function processFunctionDef(line, allCode){
    // returnType funcName(params) { ... }
    const match = line.match(/^(int|double|float|bool|void|string|char)\s+(\w+)\s*\(([^)]*)\)\s*\{/);
    return match;
  }

  // Extract function definitions
  const functions = {};
  const funcRegex = /(?:int|double|float|bool|void|string|char|long|uint)\s+(\w+)\s*\(([^)]*)\)\s*\{/g;
  let funcMatch;
  while((funcMatch = funcRegex.exec(code)) !== null){
    const funcName = funcMatch[1];
    const params = funcMatch[2];
    if(funcName === 'main') continue;
    // Find matching closing brace
    const startIdx = funcMatch.index + funcMatch[0].length;
    let depth = 1;
    let endIdx = startIdx;
    for(let i=startIdx;i<code.length && depth>0;i++){
      if(code[i]==='{') depth++;
      if(code[i]==='}') depth--;
      endIdx = i;
    }
    const funcBody = code.slice(startIdx, endIdx);
    const paramList = params.split(',').map(p=>p.trim()).filter(p=>p).map(p=>{
      const pm = p.match(/(\w+)\s+(\w+)/);
      return pm?{type:pm[1],name:pm[2]}:{type:'int',name:p};
    });
    functions[funcName] = {params:paramList, body:funcBody};
  }

  function callFunction(name, args){
    if(!functions[name]) return null;
    const fn = functions[name];
    const savedVars = {...vars};
    fn.params.forEach((p,i)=>{
      vars[p.name] = args[i];
    });
    let retVal = null;
    const lines = fn.body.split('\n').map(l=>l.trim()).filter(l=>l);
    for(const line of lines){
      if(line.startsWith('return ')){
        retVal = evalExpr(line.replace(/return\s+/,'').replace(/;/,''));
        break;
      }
      processStatement(line);
    }
    Object.assign(vars, savedVars);
    return retVal;
  }

  const flowControl = {break:false, continue:false};

  function processStatement(line){
    line = line.trim();
    if(!line || line.startsWith('//')) return;
    if(line==='break;'){ flowControl.break=true; return; }
    if(line==='continue;'){ flowControl.continue=true; return; }
    if(line.startsWith('cout')) { processCout(line); return; }
    if(line.startsWith('cin')) { processCin(line); return; }
    if(processDeclaration(line)) return;
    if(processAssignment(line)) return;
    // swap(a, b)
    const swapMatch = line.match(/^swap\s*\(\s*(\w+)\s*,\s*(\w+)\s*\);$/);
    if(swapMatch){
      const tmp = vars[swapMatch[1]];
      vars[swapMatch[1]] = vars[swapMatch[2]];
      vars[swapMatch[2]] = tmp;
      return;
    }
    // sort(arr, arr+n) or sort(arr, arr+n, greater<int>())
    const sortMatch = line.match(/^sort\s*\(\s*(\w+)\s*,\s*\w+\s*\+\s*(\w+)\s*[,)]/);
    if(sortMatch && arrays[sortMatch[1]]){
      let n = evalExpr(sortMatch[2]);
      let arr = arrays[sortMatch[1]].slice(0, n);
      if(line.includes('greater')){
        arr.sort((a,b)=>b-a);
      } else {
        arr.sort((a,b)=>a-b);
      }
      for(let i=0;i<n;i++) arrays[sortMatch[1]][i] = arr[i];
      return;
    }
    // memset(arr, 0, sizeof)
    const memsetMatch = line.match(/^memset\s*\(\s*(\w+)\s*,\s*(\d+)\s*,/);
    if(memsetMatch && arrays[memsetMatch[1]]){
      arrays[memsetMatch[1]].fill(parseInt(memsetMatch[2]));
      return;
    }
    if(memsetMatch && vars[memsetMatch[1]]!==undefined){
      vars[memsetMatch[1]] = parseInt(memsetMatch[2]);
      return;
    }
    // fill(arr, arr+n, val)
    const fillMatch = line.match(/^fill\s*\(\s*(\w+)\s*,\s*\w+\s*\+\s*(\w+)\s*,\s*(.+)\);$/);
    if(fillMatch && arrays[fillMatch[1]]){
      let n = evalExpr(fillMatch[2]);
      let val = evalExpr(fillMatch[3]);
      for(let i=0;i<n;i++) arrays[fillMatch[1]][i] = val;
      return;
    }
    // Function call as statement (ignore return)
    const callMatch = line.match(/^(\w+)\(([^)]*)\);$/);
    if(callMatch && functions[callMatch[1]]){
      const args = callMatch[2].split(',').map(a=>evalExpr(a.trim()));
      callFunction(callMatch[1], args);
      return;
    }
  }

  function processBlock(body){
    // Split into lines, handle nested blocks
    const tokens = tokenize(body);
    let i = 0;
    while(i < tokens.length){
      const tok = tokens[i];
      if(flowControl.break || flowControl.continue) break;
      if(tok.type === 'line'){
        processStatement(tok.content);
        if(flowControl.break || flowControl.continue) break;
        i++;
      } else if(tok.type === 'for'){
        i = processFor(tokens, i);
      } else if(tok.type === 'while'){
        i = processWhile(tokens, i);
      } else if(tok.type === 'if'){
        i = processIf(tokens, i);
      } else {
        i++;
      }
    }
  }

  function tokenize(body){
    const tokens = [];
    let pos = 0;
    while(pos < body.length){
      // Skip whitespace
      while(pos < body.length && /\s/.test(body[pos])) pos++;
      if(pos >= body.length) break;

      // Check for block keywords
      const rest = body.slice(pos);
      const forMatch = rest.match(/^for\s*\(/);
      const whileMatch = rest.match(/^while\s*\(/);
      const ifMatch = rest.match(/^if\s*\(/);
      const elseMatch = rest.match(/^else\s*\{/);
      const elseIfMatch = rest.match(/^else\s+if\s*\(/);

      if(forMatch || whileMatch || ifMatch || elseMatch || elseIfMatch){
        const type = forMatch?'for':whileMatch?'while':elseIfMatch?'elseif':elseMatch?'else':ifMatch?'if':'line';
        if(type==='elseif' || type==='if' || type==='for' || type==='while'){
          // Extract condition
          let depth = 0;
          let condStart = rest.indexOf('(');
          let condEnd = condStart;
          for(let j=condStart;j<rest.length;j++){
            if(rest[j]==='(') depth++;
            if(rest[j]===')') depth--;
            if(depth===0){ condEnd=j; break; }
          }
          const condition = rest.slice(condStart+1, condEnd);
          // Find body
          let bodyStart = condEnd+1;
          while(bodyStart<rest.length && /\s/.test(rest[bodyStart])) bodyStart++;
          if(rest[bodyStart]==='{'){
            let bdepth=1;
            let bodyEnd=bodyStart+1;
            for(;bodyEnd<rest.length && bdepth>0;bodyEnd++){
              if(rest[bodyEnd]==='{') bdepth++;
              if(rest[bodyEnd]==='}') bdepth--;
            }
            const blockBody = rest.slice(bodyStart+1, bodyEnd-1);
            tokens.push({type, condition, body:blockBody});
            pos += bodyEnd;
          } else {
            // Single statement
            const semiEnd = rest.indexOf(';', bodyStart);
            const stmt = rest.slice(bodyStart, semiEnd+1);
            tokens.push({type, condition, body:stmt});
            pos += semiEnd+1;
          }
        } else if(type==='else'){
          let bodyStart = rest.indexOf('{');
          let bdepth=1;
          let bodyEnd=bodyStart+1;
          for(;bodyEnd<rest.length && bdepth>0;bodyEnd++){
            if(rest[bodyEnd]==='{') bdepth++;
            if(rest[bodyEnd]==='}') bdepth--;
          }
          tokens.push({type:'else', body:rest.slice(bodyStart+1, bodyEnd-1)});
          pos += bodyEnd;
        }
      } else {
        // Regular statement
        const semiEnd = rest.indexOf(';');
        if(semiEnd === -1) break;
        tokens.push({type:'line', content:rest.slice(0, semiEnd+1)});
        pos += semiEnd+1;
      }
    }
    return tokens;
  }

  function processFor(tokens, idx){
    const tok = tokens[idx];
    // Parse: int i = 0; i < n; i++
    const condParts = tok.condition.split(';').map(s=>s.trim());
    if(condParts.length >= 3){
      // Init
      if(condParts[0]) processDeclaration(condParts[0]+';') || processAssignment(condParts[0]+';');
      // Loop
      let maxIter = 100000;
      while(maxIter-- > 0){
        const condVal = evalExpr(condParts[1]);
        if(!condVal) break;
        flowControl.break = false;
        flowControl.continue = false;
        processBlock(tok.body);
        if(flowControl.break){
          flowControl.break = false;
          break;
        }
        // continue or normal: do update
        if(condParts[2]) processAssignment(condParts[2]+';');
      }
    }
    return idx+1;
  }

  function processWhile(tokens, idx){
    const tok = tokens[idx];
    let maxIter = 100000;
    while(maxIter-- > 0){
      const condVal = evalExpr(tok.condition);
      if(!condVal) break;
      flowControl.break = false;
      flowControl.continue = false;
      processBlock(tok.body);
      if(flowControl.break){
        flowControl.break = false;
        break;
      }
    }
    return idx+1;
  }

  function processIf(tokens, idx){
    const tok = tokens[idx];
    const condVal = evalExpr(tok.condition);
    if(condVal){
      processBlock(tok.body);
    } else {
      // Check for else / else if
      let nextIdx = idx+1;
      while(nextIdx < tokens.length){
        const next = tokens[nextIdx];
        if(next.type === 'elseif'){
          const elseCond = evalExpr(next.condition);
          if(elseCond){
            processBlock(next.body);
            break;
          }
          nextIdx++;
        } else if(next.type === 'else'){
          processBlock(next.body);
          break;
        } else {
          break;
        }
      }
    }
    // Skip past all else/elseif chains
    let skipIdx = idx+1;
    while(skipIdx < tokens.length && (tokens[skipIdx].type==='elseif' || tokens[skipIdx].type==='else')){
      skipIdx++;
    }
    return skipIdx;
  }

  // Execute main body
  processBlock(body);

  return {output: output.join(''), errors};
}

// ===== C++ Syntax Highlighting =====
function highlightCpp(code){
  const keywords = ['int','double','float','string','char','bool','void','long','for','while','if','else','return','break','continue','true','false','using','namespace','struct','class','const','include','longlong','uint','typedef','sizeof','unsigned','auto','queue','vector','pair','map','set','stack','priority_queue','sort','swap','abs','min','max','memset','fill','gcd','define'];
  let result = escHtml(code);
  // Highlight strings
  result = result.replace(/(&quot;[^&]*?&quot;)/g, '<span class="str">$1</span>');
  result = result.replace(/(&#39;[^&]*?&#39;)/g, '<span class="str">$1</span>');
  // Highlight comments
  result = result.replace(/(\/\/[^\n]*)/g, '<span class="com">$1</span>');
  // Highlight keywords
  keywords.forEach(kw=>{
    result = result.replace(new RegExp('\\b('+kw+')\\b','g'), '<span class="kw">$1</span>');
  });
  // Highlight numbers
  result = result.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  // Highlight function names
  result = result.replace(/(\w+)(\s*\()/g, '<span class="fn">$1</span>$2');
  return result;
}

function pinNext(curr, nextId){
  if(curr.value.length===1){
    const next = document.getElementById(nextId);
    if(next) next.focus();
  }
}

function checkPin(){
  const pin = ['pin-1','pin-2','pin-3','pin-4'].map(id=>document.getElementById(id).value).join('');
  if(pin.length<4) return;
  const settings = load(SK.settings, {});
  if(!settings.parentPin){
    // First time - set password
    settings.parentPin = pin;
    save(SK.settings, settings);
    toast('密码已设置','success');
    statsUnlocked = true;
    renderStats();
  } else if(settings.parentPin === pin){
    statsUnlocked = true;
    renderStats();
    toast('已解锁','success');
  } else {
    toast('密码错误','error');
    ['pin-1','pin-2','pin-3','pin-4'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('pin-1').focus();
  }
}

function renderStatsContent(){
  const logs = load(SK.logs, []);
  const errors = load(SK.errors, []);
  const tasks = load(SK.tasks, []);
  const streak = load(SK.streak, {});
  const pomo = load(SK.pomodoro, {date:todayStr(), count:0, totalMinutes:0});

  // Subject study time (last 14 days)
  const subjectTime = {};
  SUBJECTS.forEach(s=>subjectTime[s]=0);
  const fourteenDaysAgo = formatDate(new Date(Date.now()-86400000*14));
  logs.filter(l=>l.date>=fourteenDaysAgo).forEach(l=>{
    if(subjectTime[l.subject]!==undefined) subjectTime[l.subject] += l.duration;
  });

  // Error stats
  const errorStats = {total:errors.length, mastered:errors.filter(e=>e.status==='mastered').length, reviewing:errors.filter(e=>e.status==='reviewing').length};
  const errorBySubject = {};
  SUBJECTS.forEach(s=>{errorBySubject[s]={total:0,mastered:0};});
  errors.forEach(e=>{
    if(errorBySubject[e.subject]){
      errorBySubject[e.subject].total++;
      if(e.status==='mastered') errorBySubject[e.subject].mastered++;
    }

function renderBarChart(data){
  const entries = Object.entries(data).filter(([k,v])=>v>0);
  if(entries.length===0) return '<div class="empty-state"><p>暂无学习记录<br>开始学习后这里会显示统计图表</p></div>';
  const maxVal = Math.max(...entries.map(e=>e[1]));
  const barHeight = 24;
  const chartHeight = entries.length * (barHeight+8);
  const labelWidth = 60;
  const barMaxWidth = 260;
  let html = '<svg viewBox="0 0 360 '+chartHeight+'" width="100%" style="max-width:360px">';
  entries.forEach(([subj, val], i)=>{
    const y = i*(barHeight+8);
    const w = (val/maxVal)*barMaxWidth;
    const color = SUBJECT_COLORS[subj] || '#4A90D9';
    html += `<text x="0" y="${y+barHeight-6}" font-size="13" fill="#2C3E50" font-weight="600">${subj}</text>`;
    html += `<rect x="${labelWidth}" y="${y}" width="${w}" height="${barHeight}" rx="4" fill="${color}"/>`;
    html += `<text x="${labelWidth+w+8}" y="${y+barHeight-6}" font-size="12" fill="#7A8B9C">${val}分</text>`;
  });
  html += '</svg>';
  return html;
}

function renderErrorProgress(stats, bySubject){
  const total = stats.total || 1;
  const masteredPct = Math.round(stats.mastered/total*100);
  const reviewingPct = Math.round(stats.reviewing/total*100);
  const circumference = 2*Math.PI*60;

  let html = '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">';
  html += '<svg viewBox="0 0 160 160" width="140" height="140" style="flex-shrink:0">';
  html += '<circle cx="80" cy="80" r="60" fill="none" stroke="#E0E6ED" stroke-width="16"/>';
  html += `<circle cx="80" cy="80" r="60" fill="none" stroke="#5BB85A" stroke-width="16" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-masteredPct/100)}" transform="rotate(-90 80 80)"/>`;
  html += `<text x="80" y="75" text-anchor="middle" font-size="28" font-weight="700" fill="#2C3E50">${masteredPct}%</text>`;
  html += `<text x="80" y="95" text-anchor="middle" font-size="11" fill="#7A8B9C">已掌握</text>`;
  html += '</svg>';
  html += '<div style="flex:1;min-width:140px">';
  html += `<div style="display:flex;gap:8px;margin-bottom:8px"><span class="tag tag-green">${stats.mastered} 已掌握</span><span class="tag tag-orange">${stats.reviewing} 复习中</span><span class="tag tag-gray">${stats.total} 总计</span></div>`;
  html += '<div style="font-size:13px;color:var(--c-text-light);margin-top:8px">各科掌握率：</div>';
  Object.entries(bySubject).filter(([k,v])=>v.total>0).forEach(([subj, s])=>{
    const pct = Math.round(s.mastered/s.total*100);
    const color = SUBJECT_COLORS[subj];
    html += `<div style="display:flex;align-items:center;gap:6px;margin-top:4px"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block"></span><span style="font-size:13px;flex:1">${subj}</span><span style="font-size:13px;color:var(--c-text-light)">${s.mastered}/${s.total} (${pct}%)</span></div>`;
  });
  html += '</div></div>';
  return html;
}

function renderHeatmap(data){
  let html = '<div class="heatmap-grid">';
  data.forEach(d=>{
    const m = d.minutes;
    let cls = '';
    if(m===0) cls='';
    else if(m<30) cls='l1';
    else if(m<60) cls='l2';
    else if(m<90) cls='l3';
    else cls='l4';
    html += `<div class="heatmap-cell ${cls}" title="${d.date}: ${m}分钟" style="${d.isToday?'box-shadow:0 0 0 2px var(--c-primary)':''}"></div>`;
  });
  html += '</div>';
  html += '<div class="heatmap-legend">少 <div class="heatmap-cell" style="width:12px;height:12px;display:inline-block"></div><div class="heatmap-cell l1" style="width:12px;height:12px;display:inline-block"></div><div class="heatmap-cell l2" style="width:12px;height:12px;display:inline-block"></div><div class="heatmap-cell l3" style="width:12px;height:12px;display:inline-block"></div><div class="heatmap-cell l4" style="width:12px;height:12px;display:inline-block"></div> 多</div>';
  return html;
}

function renderTodayOverview(taskDone, taskTotal, pomo, cppDone, cppTotal){
  const ptsData = getPointsData();
  const today = todayStr();
  const todayPoints = (ptsData.history||[]).filter(h=>h.time.slice(0,10)===today).reduce((s,h)=>s+h.amount, 0);
  const dcDone = Object.values(ptsData.dailyChallenges||{}).filter(v=>v).length;
  const dcTotal = DAILY_CHALLENGES.length;
  let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  html += `<div style="background:var(--c-primary-light);padding:16px;border-radius:8px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--c-primary)">${taskDone}/${taskTotal}</div><div style="font-size:12px;color:var(--c-text-light)">今日任务完成</div></div>`;
  html += `<div style="background:var(--c-accent-light);padding:16px;border-radius:8px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--c-accent)">${pomo.count}</div><div style="font-size:12px;color:var(--c-text-light)">今日番茄钟</div></div>`;
  html += `<div style="background:linear-gradient(135deg,#FFF8E1,#FFE082);padding:16px;border-radius:8px;text-align:center;cursor:pointer" onclick="switchTab('growth')"><div style="font-size:28px;font-weight:700;color:#FF8C00">${todayPoints>=0?'+':''}${todayPoints}</div><div style="font-size:12px;color:#BF6E00">今日积分</div></div>`;
  html += `<div style="background:linear-gradient(135deg,#E8EAF6,#C5CAE9);padding:16px;border-radius:8px;text-align:center;cursor:pointer" onclick="switchTab('growth')"><div style="font-size:28px;font-weight:700;color:#3949AB">${dcDone}/${dcTotal}</div><div style="font-size:12px;color:#3949AB">今日挑战</div></div>`;
  html += '</div>';
  return html;
}

function renderCppProgress(cpp){
  let html = '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  CSP_J_LESSONS.forEach(l=>{
    const done = cpp.progress[l.id] && cpp.progress[l.id].completed;
    html += `<div style="flex:1;min-width:140px;padding:12px;border-radius:8px;background:${done?'var(--c-accent-light)':'var(--c-bg)'};border:1px solid ${done?'var(--c-accent)':'var(--c-border)'}">`;
    html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">`;
    html += `<div style="width:20px;height:20px;border-radius:50%;background:${done?'var(--c-accent)':'var(--c-border)'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${done?'\\u2713':l.id}</div>`;
    html += `<span style="font-size:12px;font-weight:600">${l.title}</span></div>`;
    html += `<span style="font-size:11px;color:var(--c-text-light)">${done?'已完成':'未完成'}</span>`;
    html += `</div>`;
  });
  html += '</div>';
  return html;
}

{id:'y2',type:'choice',difficulty:'基础',knowledgePoint:'古诗词鉴赏',question:'"感时花溅泪，恨别鸟惊心"运用的修辞手法是？',options:['比喻','拟人','夸张','对偶'],answer:1,hint:{approach:'"花溅泪""鸟惊心"赋予了花和鸟人的情感和动作，这是拟人手法。花不会流泪，鸟不会心惊，诗人借花鸟表达感时伤别之情。',pitfall:'这首诗中既有拟人也有对偶（花溅泪对鸟惊心），但题目问的是主要的修辞效果。拟人是核心手法，对偶是形式上的对称。如果题目问"形式上的特点"则选对偶。',extension:'杜甫《春望》全诗："国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。"表达了忧国思家之情。'}},
{id:'y3',type:'fill',difficulty:'基础',knowledgePoint:'古诗文默写',question:'补写出下列名篇名句中的空缺部分：\n①《桃花源记》中描写桃源人生活和谐的句子：___，___。\n②《陋室铭》中点明主旨的句子：___，___。',answer:'①黄发垂髫，并怡然自乐  ②斯是陋室，惟吾德馨',hint:{approach:'①桃花源记中描写老人和小孩都快乐自在：黄发垂髫，并怡然自乐。②陋室铭开篇点题：斯是陋室，惟吾德馨。',pitfall:'易错字：①"髫"字容易写错（tiáo，儿童下垂的头发），"怡"不要写成"治"。②"馨"字下面是"香"，不要写成"罄"（空的意思）。"惟"不要写成"唯"。',extension:'古诗文默写是中考必考题，重点注意：①生僻字写法②同音字区分③句意理解。建议每天默写5句，错题反复练习。'}},
{id:'y4',type:'choice',difficulty:'中等',knowledgePoint:'现代文阅读',question:'《背影》中，作者多次写到父亲的背影，其主要作用是？',options:['表现父亲年迈体衰','作为线索贯穿全文，寄托深情','说明父亲不善言辞','为了引起读者同情'],answer:1,hint:{approach:'朱自清《背影》中，"背影"是全文的线索，四次写到背影：第一次点题、第二次买橘时的背影（重点）、第三次离别时的背影、第四次泪光中的背影。每次都寄托着作者对父亲深沉的爱。',pitfall:'不能只看到表面的"年迈体衰"。文学作品中反复出现的意象通常具有线索作用和象征意义。要从结构和情感两个层面分析。',extension:'散文中"线索"的作用：①贯穿全文结构②寄托情感③推动叙事。《背影》以"背影"为线索，将四次回忆串联，情感层层递进。'}},
{id:'y5',type:'choice',difficulty:'基础',knowledgePoint:'成语运用',question:'下列句子中成语使用正确的是？',options:['他做事总是虎头蛇尾，从不敷衍了事','这段文章语句不通顺，简直是不刊之论','他的成绩一落千丈，令人刮目相看','博物馆里陈列的文物琳琅满目，美不胜收'],answer:3,hint:{approach:'A"虎头蛇尾"指做事有始无终，与"从不敷衍"矛盾；B"不刊之论"指不可更改的言论（正确言论），不能用来形容语句不通；C"刮目相看"指用新眼光看人，不能用于成绩下降；D"琳琅满目""美不胜收"都形容美好的事物很多，使用正确。',pitfall:'望文生义是成语题最大陷阱！"不刊之论"的"刊"是"更改"不是"刊登"，指不可更改的正确言论，不是"不值得刊登的言论"。',extension:'成语常见误用类型：①望文生义②褒贬误用③对象不当④语境不合。建议积累易错成语，特别是含有"不"字的成语（如不刊之论、不寒而栗、不以为然等）。'}},
{id:'y6',type:'choice',difficulty:'中等',knowledgePoint:'文言文翻译',question:'"予独爱莲之出淤泥而不染"的正确的翻译是？',options:['我唯独喜爱莲花从淤泥中长出却不被污染','我独自喜爱莲花出淤泥却不染色','我只爱莲花从泥里出来没有染上颜色','我单独喜欢莲花开在淤泥外面很干净'],answer:0,hint:{approach:'"予"=我，"独"=唯独，"爱"=喜爱，"之"=主谓之间取消独立性（无实义），"出淤泥"=从淤泥中长出，"而"=却（转折），"不染"=不被污染（沾染）。整句：我唯独喜爱莲花从淤泥中长出却不被污染。',pitfall:'"之"在这里不是"的"而是用于主谓之间取消句子独立性，翻译时不译出！"而"表转折关系译为"却"不是"而且"。不能逐字死译，要理解整体句意。',extension:'文言翻译六字诀："留、删、换、调、补、意"。留（保留专有名词）、删（删去虚词）、换（替换古今异义）、调（调整语序）、补（补充省略）、意（意译）。'}},
{id:'y7',type:'fill',difficulty:'中等',knowledgePoint:'病句修改',question:'修改病句："通过这次实践活动，使我深受教育。"\n修改为：________________',answer:'这次实践活动，使我深受教育。（或：通过这次实践活动，我深受教育。）',hint:{approach:'"通过……使……"是典型的缺主语病句。"通过"和"使"都是介词，导致句子没有主语。修改方法：删去"通过"或删去"使"，让句子有明确的主语。',pitfall:'这是中考高频病句类型！常见缺主语的句式：①"通过……使……"②"经过……使……"③"由于……使……"。修改时删去其中一个介词即可。',extension:'病句常见类型：①语序不当②搭配不当③成分残缺④结构混乱⑤表意不明⑥不合逻辑。识别病句要从语法结构入手，先找主谓宾再看修饰成分。'}},
{id:'y8',type:'choice',difficulty:'中等',knowledgePoint:'说明文阅读',question:'《中国石拱桥》中，作者说明赵州桥"大拱"的特点时使用的主要说明方法是？',options:['作比较','列数字','打比方','下定义'],answer:1,hint:{approach:'课文原文："赵州桥非常雄伟，全长五十点八二米，两端宽九点六米，中部略窄，宽九米。"使用了大量具体数据，这是列数字的说明方法。',pitfall:'不要把"打比方"和"列数字"混淆。打比方是用比喻来说明（如"桥洞像虹"），列数字是用具体数据说明。赵州桥部分以列数字为主，也有打比方。',extension:'常见说明方法及作用：①列数字——准确具体②作比较——突出特征③打比方——生动形象④举例子——具体可信⑤分类别——条理清楚。答题时要结合具体内容分析作用。'}}
],

'英语':[
{id:'e1',type:'choice',difficulty:'基础',knowledgePoint:'现在完成时',question:'He ___ (live) here since 2010. 选择正确形式：',options:['lived','has lived','is living','lives'],answer:1,hint:{approach:'since 2010 表示从过去持续到现在，用现在完成时。主语 He 是第三人称单数，所以用 has + 过去分词 lived → has lived。',pitfall:'since + 时间点用现在完成时，for + 时间段也用现在完成时！不要用一般过去时（lived），因为动作持续到现在。区分：since 2010（时间点）vs for 13 years（时间段）。',extension:'现在完成时标志词：since + 过去时间点、for + 时间段、already/yet/just/ever/never。结构：have/has + 过去分词。'}},
{id:'e2',type:'choice',difficulty:'基础',knowledgePoint:'形容词比较级',question:'This box is ___ than that one.',options:['heavy','heavier','heaviest','more heavy'],answer:1,hint:{approach:'than 是比较级标志词，需要用比较级。heavy 是重读闭音节结尾（辅音+y），变 y 为 i 加 er → heavier。',pitfall:'heavy 的比较级是 heavier 不是 more heavy！规则：①单音节词加 -er ②以 -y 结尾变 y 为 i 加 -er ③多音节词前加 more。heavy 虽然有两个音节但属于规则②。',extension:'比较级特殊变化：good→better，bad→worse，many→more，little→less，far→farther/further。这些需要单独记忆。'}},
{id:'e3',type:'choice',difficulty:'中等',knowledgePoint:'宾语从句',question:'Could you tell me ___?',options:['where is the post office','where the post office is','where was the post office','where the post office was'],answer:1,hint:{approach:'宾语从句用陈述语序（主语+谓语），排除A和C。主句 Could you tell me 是委婉请求（并非过去时），从句用现在时即可，选 B。',pitfall:'宾语从句两大考点：①语序——必须用陈述语序（主语在前）②时态——主句现在时，从句按需要选；主句过去时，从句变相应过去时。Could you tell me 中的 could 是委婉用法不是过去时！',extension:'宾语从句连接词：①that（陈述句，可省略）②if/whether（一般疑问句）③wh-词（特殊疑问句）。语序永远是陈述语序。'}},
{id:'e4',type:'fill',difficulty:'基础',knowledgePoint:'词汇运用',question:'用所给词的适当形式填空：\n①It is ___ (sun) today. Let\'s go out.\n②She is ___ (interest) in science.',answer:'①sunny ②interested',hint:{approach:'①be动词后接形容词作表语，sun 的形容词形式是 sunny。②be interested in 是固定搭配，表示"对……感兴趣"，用 -ed 形式。',pitfall:'②区分 interested 和 interesting！interested 形容人的感受（感到有趣的），interesting 形容事物的特征（令人感兴趣的）。"我对科学感兴趣" → I am interested in science。"科学很有趣" → Science is interesting。',extension:'-ed 结尾形容词形容人（感到...的），-ing 结尾形容词形容物（令人...的）。如：bored/boring，excited/exciting，surprised/surprising。'}},
{id:'e5',type:'choice',difficulty:'中等',knowledgePoint:'被动语态',question:'The bridge ___ in 1980.',options:['built','was built','is built','has built'],answer:1,hint:{approach:'桥是被建造的，用被动语态（be + 过去分词）。时间 1980 是过去时，所以用 was built。主语 The bridge 是单数。',pitfall:'注意主动还是被动！桥不能自己建造，是被建造的，所以用被动语态。时间点是过去（1980），用过去时的被动 was/were + 过去分词。',extension:'被动语态时态公式：①一般现在时 am/is/are + done ②一般过去时 was/were + done ③现在完成时 have/has been done ④含情态动词 can/must + be done。'}},
{id:'e6',type:'choice',difficulty:'中等',knowledgePoint:'动词不定式',question:'The teacher told us ___ in class.',options:['not to talk','to not talk','not talk','don\'t talk'],answer:0,hint:{approach:'tell sb to do sth（告诉某人做某事），否定形式是 tell sb not to do sth。所以选 not to talk。',pitfall:'否定词 not 必须放在 to 的前面！不是 to not talk。这是常考固定结构。',extension:'后接 to do 的动词：want/decide/hope/plan/agree/offer/refuse + to do。后接 sb to do 的动词：tell/ask/allow/invite/want/teach + sb + to do。否定都在 to 前加 not。'}},
{id:'e7',type:'choice',difficulty:'提高',knowledgePoint:'定语从句',question:'The book ___ I bought yesterday is very interesting.',options:['that','what','who','where'],answer:0,hint:{approach:'先行词 The book 是物，用 that 或 which 引导。what 不能引导定语从句，who 修饰人，where 修饰地点。选 that。',pitfall:'what 不能引导定语从句！what 只能引导名词性从句。先行词是物时用 that/which，是人时用 who/that，是地点时用 where，是时间时用 when。',extension:'只能用 that 的情况：①先行词被最高级修饰 ②先行词被 the only/the very 修饰 ③先行词是不定代词(all/everything等) ④先行词既包含人也包含物。'}},
{id:'e8',type:'fill',difficulty:'中等',knowledgePoint:'句型转换',question:'将下列句子改为被动语态：\nPeople speak English in many countries.\n→ English ___ ___ in many countries.',answer:'is spoken',hint:{approach:'原句一般现在时，主语 people 是复数。被动语态：English (主语) + is (be动词) + spoken (speak的过去分词)。English 是不可数名词，视为单数，用 is。',pitfall:'speak 的过去分词是 spoken 不是 spoked！不规则动词的过去分词需要单独记忆。另外注意主语变化后 be 动词的单复数：English → is，books → are。',extension:'被动语态转换步骤：①找出主动句的宾语→作被动句主语②判断时态→选择be动词形式③把主动词变为过去分词④必要时用by引出动作执行者。'}},
{id:'e9',type:'choice',difficulty:'基础',knowledgePoint:'日常交际',question:'— Would you mind my opening the window?\n— ___. It\'s a bit hot here.',options:['Of course not','Yes, please','You\'re welcome','Never mind'],answer:0,hint:{approach:'"Would you mind..." 是委婉请求。回答"不介意"用 Of course not / Certainly not / Not at all。后文"It\'s a bit hot"表示同意开窗，所以不介意。',pitfall:'Would you mind 的回答容易搞反！不介意 → Of course not / Not at all（同意对方做）；介意 → Yes, you\'d better not / I\'m afraid...（不同意）。不能回答 Yes, please（矛盾）。',extension:'常见交际用语：①How about...? → Good idea/Sounds great ②May I...? → Sure/Of course ③Would you mind...? → Not at all/Of course not'}}
],

'物理':[
{id:'p1',type:'choice',difficulty:'基础',knowledgePoint:'力的合成',question:'两个力 F₁ = 3N 和 F₂ = 4N 同方向作用在同一物体上，合力为？',options:['1N','7N','5N','12N'],answer:1,hint:{approach:'同方向的两个力，合力等于两个力之和：F = F₁ + F₂ = 3N + 4N = 7N。',pitfall:'同方向相加，反方向相减！如果两力方向相反，合力 = |F₁ - F₂| = |3-4| = 1N。不要混淆同向和反向的合力计算方法。',extension:'合力范围：|F₁ - F₂| ≤ F合 ≤ F₁ + F₂。当两力同向时合力最大，反向时合力最小。两力互相垂直时合力用勾股定理：F = √(F₁² + F₂²)。'}},
{id:'p2',type:'choice',difficulty:'基础',knowledgePoint:'重力',question:'一个质量为 5kg 的物体，受到的重力约为？（g取10N/kg）',options:['0.5N','5N','50N','500N'],answer:2,hint:{approach:'重力公式 G = mg，m = 5kg，g = 10N/kg，G = 5 × 10 = 50N。',pitfall:'注意单位！质量的单位是 kg，重力的单位是 N，不要混淆。g = 10N/kg（或9.8N/kg）表示质量1kg的物体受到的重力是10N。',extension:'质量与重力的区别：①质量是物体含物质的多少，单位kg，不随位置变化②重力是地球对物体的吸引力，单位N，随位置（纬度、高度）变化。G = mg 是连接两者的桥梁。'}},
{id:'p3',type:'choice',difficulty:'中等',knowledgePoint:'牛顿第一定律',question:'关于惯性，下列说法正确的是？',options:['只有运动的物体才有惯性','惯性大小与速度有关','一切物体都有惯性','静止的物体没有惯性'],answer:2,hint:{approach:'惯性是物体保持原有运动状态不变的性质，一切物体（无论运动还是静止）都有惯性。惯性大小只与质量有关，与速度无关。',pitfall:'惯性不是力！不能说"受到惯性作用"，应该说"具有惯性"。惯性大小只与质量有关，速度大不代表惯性大。静止的物体同样有惯性（保持静止的趋势）。',extension:'牛顿第一定律（惯性定律）：一切物体在没有受到外力作用时，总保持匀速直线运动状态或静止状态。惯性是物体的固有属性，质量越大惯性越大。'}},
{id:'p4',type:'choice',difficulty:'中等',knowledgePoint:'压强',question:'将一块砖平放、侧放、竖放在地面上，哪种放法对地面压强最大？',options:['平放','侧放','竖放','一样大'],answer:2,hint:{approach:'压强公式 p = F/S。砖的重力不变，F 相同。竖放时受力面积 S 最小，所以压强 p 最大。',pitfall:'压力相同的情况下，受力面积越小，压强越大！不要认为压力大了压强就大——如果受力面积也大，压强不一定大。压强由压力和受力面积共同决定。',extension:'增大压强的方法：①增大压力②减小受力面积。减小压强的方法：①减小压力②增大受力面积。生活中：刀刃磨得很薄（减小面积增大压强）、铁轨铺枕木（增大面积减小压强）。'}},
{id:'p5',type:'choice',difficulty:'基础',knowledgePoint:'声现象',question:'下列关于声音的说法，正确的是？',options:['声音可以在真空中传播','声音的传播需要介质','声音在空气中传播最快','声音的音调与振幅有关'],answer:1,hint:{approach:'声音的传播需要介质（气体、液体、固体），真空不能传声。声音在固体中传播最快、液体次之、气体最慢。音调与频率有关，响度与振幅有关。',pitfall:'区分音调、响度、音色！音调由频率决定（高低），响度由振幅决定（大小），音色由发声体材料决定（特色）。不要把音调和响度混淆。',extension:'声速：空气中约340m/s（15°C），水中约1500m/s，钢铁中约5200m/s。回声测距：s = vt/2（声波往返，距离要除以2）。'}},
{id:'p6',type:'choice',difficulty:'中等',knowledgePoint:'浮力',question:'一个物体漂浮在液面上，下列说法正确的是？',options:['浮力大于重力','浮力等于重力','浮力小于重力','浮力与重力无关'],answer:1,hint:{approach:'漂浮条件：物体静止在液面上时，浮力等于重力（F浮 = G）。此时物体处于平衡状态，竖直方向合力为零。',pitfall:'漂浮和悬浮的区别：漂浮是物体部分露出液面，悬浮是物体完全浸没在液体中。但两种状态下都是 F浮 = G。下沉时 F浮 < G，上浮时 F浮 > G。',extension:'阿基米德原理：F浮 = ρ液 × g × V排。物体浮沉条件：①F浮 > G 上浮②F浮 = G 漂浮/悬浮③F浮 < G 下沉。也可以用密度判断：ρ物 < ρ液 上浮，ρ物 > ρ液 下沉。'}},
{id:'p7',type:'fill',difficulty:'中等',knowledgePoint:'速度计算',question:'一辆汽车以 72km/h 的速度匀速行驶，行驶 10 分钟通过的路程是 ___ 米。',answer:'12000m（或12000米）',hint:{approach:'①统一单位：72km/h = 72÷3.6 = 20m/s；10分钟 = 600秒。②路程 s = vt = 20 × 600 = 12000m。',pitfall:'单位换算是最常见的失分点！km/h → m/s 除以 3.6（即乘5/18）。1km/h = 1000m/3600s = 1/3.6 m/s。或者换算：72km/h = 72000m/3600s = 20m/s。时间也要换算成秒。',extension:'速度单位换算口诀：km/h 变 m/s，除以 3.6；m/s 变 km/h，乘以 3.6。如 36km/h = 10m/s，15m/s = 54km/h。'}},
{id:'p8',type:'choice',difficulty:'提高',knowledgePoint:'杠杆',question:'使用杠杆撬重物，动力臂是阻力臂的3倍，若阻力为150N，则动力至少为？',options:['50N','150N','450N','100N'],answer:0,hint:{approach:'杠杆平衡条件：F₁ × L₁ = F₂ × L₂。动力臂 L₁ = 3L₂，阻力 F₂ = 150N。F₁ × 3L₂ = 150 × L₂ → F₁ = 150/3 = 50N。',pitfall:'动力臂越长越省力！不要反过来算成 F₁ = 150 × 3 = 450N。动力臂是阻力臂的几倍，动力就是阻力的几分之一。',extension:'杠杆分类：①省力杠杆（动力臂>阻力臂）：钳子、撬棍②费力杠杆（动力臂<阻力臂）：镊子、筷子③等臂杠杆（动力臂=阻力臂）：天平。省力杠杆费距离，费力杠杆省距离。'}}
],

'化学':[
{id:'c1',type:'choice',difficulty:'基础',knowledgePoint:'物质变化',question:'下列变化属于化学变化的是？',options:['冰融化成水','汽油挥发','铁生锈','石蜡熔化'],answer:2,hint:{approach:'化学变化的本质是有新物质生成。铁生锈生成了氧化铁（Fe₂O₃），是新物质。其余三项只是状态变化，没有新物质生成，是物理变化。',pitfall:'判断物理变化还是化学变化的关键是"是否有新物质生成"！状态变化（熔化、凝固、汽化等）一般是物理变化。燃烧、生锈、腐败、发酵等一般是化学变化。',extension:'物理变化与化学变化的区别：物理变化只是形态/状态改变（如冰融化），化学变化有新物质生成（如铁生锈）。化学变化常伴随发光、放热、变色、产生气体、生成沉淀等现象。'}},
{id:'c2',type:'choice',difficulty:'基础',knowledgePoint:'化学式',question:'水的化学式是？',options:['H₂O','HO₂','H₂O₂','OH'],answer:0,hint:{approach:'水由氢元素和氧元素组成，一个水分子含2个氢原子和1个氧原子，化学式为 H₂O。',pitfall:'区分 H₂O（水）和 H₂O₂（过氧化氢/双氧水）！H₂O₂ 多一个氧原子，是不同的物质。下标表示原子个数，不能随意改变。',extension:'常见化学式：O₂氧气、CO₂二氧化碳、NaCl食盐、CaCO₃碳酸钙、HCl盐酸、NaOH氢氧化钠。化学式中元素符号右下角的数字表示该原子的个数。'}},
{id:'c3',type:'choice',difficulty:'中等',knowledgePoint:'元素符号',question:'"O₂"中的"2"表示的意义是？',options:['2个氧分子','每个氧分子中有2个氧原子','2个氧元素','氧气是双原子分子'],answer:1,hint:{approach:'化学式中元素符号右下角的数字表示一个分子中含有该原子的个数。"O₂"中的"2"表示每个氧分子中含有2个氧原子。',pitfall:'区分不同位置的数字含义！①元素符号前面的数字表示原子个数（如 2O 表示2个氧原子）②元素符号右下角的数字表示一个分子中的原子个数（如 O₂ 中的2）③化学式前面的数字表示分子个数（如 2O₂ 表示2个氧分子）。',extension:'化学用语中的数字：①系数（化学式前）→微粒个数②下标（元素符号右下）→分子内原子个数③上标（右上角）→离子电荷数④左上角→质量数。'}},
{id:'c4',type:'choice',difficulty:'基础',knowledgePoint:'空气成分',question:'空气中体积含量最多的气体是？',options:['氧气','氮气','二氧化碳','稀有气体'],answer:1,hint:{approach:'空气成分按体积计算：氮气(N₂)约78%，氧气(O₂)约21%，稀有气体约0.94%，二氧化碳(CO₂)约0.03%，其他气体和杂质约0.03%。氮气含量最多。',pitfall:'是按体积分数不是质量分数！氮气78%、氧气21%是最基本的记忆数据。注意二氧化碳只有0.03%，虽然量少但对生命活动至关重要。',extension:'空气是混合物，各成分体积分数固定：N₂ 78%、O₂ 21%、稀有气体0.94%、CO₂ 0.03%、其他0.03%。氧气用途：呼吸、燃烧、医疗急救；氮气用途：保护气、制氮肥。'}},
{id:'c5',type:'choice',difficulty:'中等',knowledgePoint:'化学反应类型',question:'下列反应属于化合反应的是？',options:['CaCO₃ → CaO + CO₂','2H₂ + O₂ → 2H₂O','Fe + CuSO₄ → FeSO₄ + Cu','HCl + NaOH → NaCl + H₂O'],answer:1,hint:{approach:'化合反应是两种或两种以上物质生成一种物质的反应（多变一）。2H₂ + O₂ → 2H₂O 是两种物质生成一种物质，属于化合反应。A是分解反应（一变多），C是置换反应，D是复分解反应。',pitfall:'四种基本反应类型要区分清楚！①化合反应：A + B → AB（多变一）②分解反应：AB → A + B（一变多）③置换反应：A + BC → AC + B④复分解反应：AB + CD → AD + CB。',extension:'注意：化合反应不一定是氧化还原反应（如 CaO + H₂O → Ca(OH)₂ 不是氧化还原反应），但燃烧反应既是化合反应也是氧化还原反应。反应类型可以从不同角度分类。'}},
{id:'c6',type:'fill',difficulty:'基础',knowledgePoint:'化学方程式',question:'配平化学方程式：\n___ H₂ + ___ O₂ → ___ H₂O',answer:'2 H₂ + 1 O₂ → 2 H₂O（系数1可省略：2H₂ + O₂ → 2H₂O）',hint:{approach:'配平原则：等号两边各原子总数相等。右边H₂O有2个H和1个O。左边H₂有2个H，需2个H₂才能产生4个H，对应2个H₂O。2个H₂O含2个O，需要1个O₂。所以：2H₂ + O₂ → 2H₂O。',pitfall:'配平时不能改化学式中的下标！只能添加化学式前面的系数。如不能把H₂O改成H₂O₂来配平——那变成了不同的物质。',extension:'配平方法：①观察法②最小公倍数法③奇数配偶法。配平后检查：①各原子总数两边相等②遵守质量守恒定律③系数一般取最简整数比。'}},
{id:'c7',type:'choice',difficulty:'中等',knowledgePoint:'金属活动性',question:'下列金属中，活动性最强的是？',options:['铁','铜','锌','银'],answer:2,hint:{approach:'金属活动性顺序（由强到弱）：K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au。锌(Zn)在铁(Fe)之前，铁在铜(Cu)之前，铜在银(Ag)之前。所以锌活动性最强。',pitfall:'记忆口诀：钾钙钠镁铝、锌铁锡铅(氢)、铜汞银铂金。排在前面的金属能把排在后面的金属从其盐溶液中置换出来。氢前的金属能与酸反应产生氢气。',extension:'金属活动性应用：①判断金属能否与酸反应（H前能，H后不能）②判断金属间能否发生置换反应（活泼金属置换不活泼金属）③判断金属在自然界中的存在形式（活泼金属以化合态存在）。'}},
{id:'c8',type:'choice',difficulty:'提高',knowledgePoint:'溶液',question:'将50g溶质质量分数为10%的氯化钠溶液稀释为5%，需加水？',options:['25g','50g','100g','10g'],answer:1,hint:{approach:'稀释前后溶质质量不变。原溶质 = 50g × 10% = 5g。稀释后溶液质量 = 5g ÷ 5% = 100g。需加水 = 100g - 50g = 50g。',pitfall:'稀释时溶质质量不变！不要直接用50g × (10%-5%) = 2.5g来算加水量。正确思路：溶质不变 → 设加水x克 → 5g/(50+x) = 5% → x = 50g。',extension:'溶液稀释公式：C₁ × m₁ = C₂ × m₂（浓溶液浓度×浓溶液质量 = 稀溶液浓度×稀溶液质量）。稀释就是加溶剂，溶质质量始终不变。'}}
],

'生物':[
{id:'b1',type:'choice',difficulty:'基础',knowledgePoint:'细胞结构',question:'植物细胞区别于动物细胞的最显著特征是？',options:['有细胞膜','有细胞核','有细胞壁和液泡','有线粒体'],answer:2,hint:{approach:'植物细胞特有的结构：细胞壁、叶绿体、大液泡。动物细胞没有这些结构。两者共有的结构：细胞膜、细胞核、线粒体、细胞质。',pitfall:'线粒体是动植物细胞共有的，不是植物特有！叶绿体虽然也是植物特有，但不是所有植物细胞都有（如根部细胞无叶绿体）。细胞壁和液泡是植物细胞最普遍的区分特征。',extension:'细胞各结构功能：①细胞壁——保护和支持②细胞膜——控制物质进出③细胞核——遗传信息库④叶绿体——光合作用⑤线粒体——呼吸作用⑥液泡——储存物质。'}},
{id:'b2',type:'choice',difficulty:'基础',knowledgePoint:'光合作用',question:'光合作用的场所是？',options:['线粒体','叶绿体','细胞核','液泡'],answer:1,hint:{approach:'光合作用在叶绿体中进行。叶绿体含有叶绿素，能吸收光能，将二氧化碳和水合成有机物（葡萄糖），并释放氧气。',pitfall:'区分光合作用和呼吸作用的场所！光合作用在叶绿体中进行（需要光），呼吸作用在线粒体中进行（所有活细胞都能进行，不需要光）。两者是相反但不是对立的过程。',extension:'光合作用公式：CO₂ + H₂O →(光能/叶绿体) 有机物 + O₂。呼吸作用公式：有机物 + O₂ →(酶) CO₂ + H₂O + 能量。光合作用储存能量，呼吸作用释放能量。'}},
{id:'b3',type:'choice',difficulty:'中等',knowledgePoint:'人体系统',question:'人体进行气体交换的主要器官是？',options:['鼻腔','气管','肺','心脏'],answer:2,hint:{approach:'肺是气体交换的主要器官。肺泡壁很薄（只有一层细胞），周围有丰富的毛细血管，氧气透过肺泡壁进入血液，二氧化碳从血液进入肺泡排出体外。',pitfall:'鼻腔和气管只是气体的通道，不进行气体交换！心脏是血液循环的动力器官，不直接参与气体交换。气体交换发生在肺泡与血液之间，以及血液与组织细胞之间。',extension:'呼吸过程：①肺通气（肺与外界）②肺泡内的气体交换（肺泡与血液）③气体在血液中的运输④组织内的气体交换（血液与组织细胞）。四个环节缺一不可。'}},
{id:'b4',type:'choice',difficulty:'中等',knowledgePoint:'遗传与变异',question:'人的体细胞中含有多少对染色体？',options:['23对','46对','22对','24对'],answer:0,hint:{approach:'人体细胞中含有23对（46条）染色体。其中22对是常染色体，1对是性染色体（女性XX，男性XY）。',pitfall:'是23对（46条），不是46对！体细胞染色体成对存在，23对 = 46条。生殖细胞（精子、卵细胞）中染色体减半，为23条。',extension:'染色体、DNA、基因的关系：染色体由DNA和蛋白质组成，DNA上有遗传效应的片段就是基因。体细胞染色体成对（23对），生殖细胞染色体减半（23条），受精后恢复为23对。'}},
{id:'b5',type:'choice',difficulty:'基础',knowledgePoint:'生态系统',question:'在一个生态系统中，能量流动的特点是？',options:['循环往复','单向流动、逐级递减','双向流动','不流动'],answer:1,hint:{approach:'生态系统能量流动是单向的、逐级递减的。能量沿食物链传递，每一级生物只能获得上一级能量的10%-20%，其余能量在呼吸作用中以热能散失。',pitfall:'物质是循环的，能量是单向流动的！不要混淆。物质（如碳、氧、水）可以在生物与环境之间循环，但能量流动是单向的，不能循环。',extension:'食物链起点是生产者（植物），依次是初级消费者→次级消费者→...。能量传递效率约10%-20%，所以食物链一般不超过5个营养级。营养级越高，能量越少。'}},
{id:'b6',type:'judge',difficulty:'中等',knowledgePoint:'血液循环',question:'动脉血是含氧丰富、颜色鲜红的血液，静脉血是含氧较少、颜色暗红的血液。',answer:true,hint:{approach:'动脉血和静脉血的区别在于含氧量和颜色：动脉血含氧丰富、颜色鲜红；静脉血含氧较少、颜色暗红。这是正确的描述。',pitfall:'注意：动脉血不一定在动脉中，静脉血不一定在静脉中！肺动脉中流的是静脉血（含CO₂多），肺静脉中流的是动脉血（含O₂多）。区分动脉血/静脉血看含氧量，区分动脉/静脉看血流方向（从心脏流出的是动脉，流回心脏的是静脉）。',extension:'血液循环路线：体循环：左心室→主动脉→全身毛细血管→上下腔静脉→右心房（动脉血变静脉血）。肺循环：右心室→肺动脉→肺泡毛细血管→肺静脉→左心房（静脉血变动脉血）。'}},
{id:'b7',type:'choice',difficulty:'基础',knowledgePoint:'动物运动',question:'人体的运动系统主要由什么组成？',options:['骨骼和肌肉','骨骼和关节','肌肉和关节','骨骼、关节和肌肉'],answer:3,hint:{approach:'人体的运动系统由骨、骨连结（关节）和骨骼肌三部分组成。骨起杠杆作用，关节起支点作用，骨骼肌提供动力。',pitfall:'运动系统三要素缺一不可：骨（杠杆）、关节（支点）、肌肉（动力）。不能漏掉任何一个。运动还需要神经系统的调节。',extension:'运动原理：骨骼肌收缩→牵动骨绕关节活动→产生运动。屈肘时肱二头肌收缩、肱三头肌舒张；伸肘时相反。一个动作的完成需要多组肌肉的协调配合。'}},
{id:'b8',type:'choice',difficulty:'提高',knowledgePoint:'微生物',question:'细菌和真菌在生态系统中的主要角色是？',options:['生产者','消费者','分解者','以上都是'],answer:2,hint:{approach:'细菌和真菌营腐生生活，将动植物遗体分解为无机物，归还给环境供植物再利用，在生态系统中担任分解者角色。',pitfall:'大多数细菌和真菌是分解者，但也有例外！有些细菌是生产者（如蓝细菌能光合作用），有些细菌是消费者（如结核杆菌寄生在人体内）。但题目问"主要角色"，则是分解者。',extension:'生态系统成分：①非生物部分——阳光、空气、水、温度等②生物部分——生产者（植物）、消费者（动物）、分解者（细菌、真菌）。分解者将有机物分解为无机物，是物质循环的关键环节。'}}
],

'地理':[
{id:'g1',type:'choice',difficulty:'基础',knowledgePoint:'中国疆域',question:'我国领土最南端位于？',options:['黑龙江省漠河','新疆帕米尔高原','海南省南沙群岛曾母暗沙','黑龙江省黑龙江主航道'],answer:2,hint:{approach:'中国领土四至点：最北——漠河以北黑龙江主航道中心线；最南——南沙群岛曾母暗沙；最东——黑龙江与乌苏里江汇合处；最西——新疆帕米尔高原。',pitfall:'四至点要准确记忆！最北和最东都在黑龙江省，容易混淆。最南是曾母暗沙不是海南岛本岛。最西是帕米尔高原不是西藏。',extension:'中国领土面积约960万平方公里，居世界第三。南北跨度约5500km，东西跨度约5200km，跨5个时区。陆上邻国14个，隔海相望国家6个。'}},
{id:'g2',type:'choice',difficulty:'中等',knowledgePoint:'气候类型',question:'广州的气候类型属于？',options:['温带季风气候','亚热带季风气候','热带季风气候','温带海洋性气候'],answer:1,hint:{approach:'广州位于北回归线附近，属于亚热带季风气候。夏季高温多雨，冬季温和少雨。年平均气温约21-22°C，年降水量约1600-1800mm。',pitfall:'区分三种季风气候！①热带季风气候——全年高温，分旱雨两季（如海南南部）②亚热带季风气候——夏季高温多雨，冬季温和少雨（如广州）③温带季风气候——夏季高温多雨，冬季寒冷干燥（如北京）。',extension:'中国气候特征：气候复杂多样、季风气候显著。季风区与非季风区分界线：大兴安岭—阴山—贺兰山—巴颜喀拉山—冈底斯山。季风区内雨热同期，有利于农业生产。'}},
{id:'g3',type:'choice',difficulty:'基础',knowledgePoint:'地形',question:'下列地形中，海拔一般在200米以下，地势平坦的是？',options:['高原','山地','平原','丘陵'],answer:2,hint:{approach:'五种基本地形：①平原——海拔<200m，平坦广阔②高原——海拔>500m，面积广大，顶部平坦③山地——海拔>500m，坡度陡峻④丘陵——海拔200-500m，起伏和缓⑤盆地——四周高、中间低。',pitfall:'平原和高原都是地势平坦，区别在海拔！平原<200m，高原>500m。丘陵和山地区别在坡度：丘陵起伏和缓，山地坡度陡峻。',extension:'中国地形特征：西高东低，呈阶梯状分布。第一级阶梯——青藏高原（4000m以上）；第二级阶梯——盆地和高原（1000-2000m）；第三级阶梯——平原和丘陵（500m以下）。'}},
{id:'g4',type:'choice',difficulty:'中等',knowledgePoint:'河流',question:'下列关于长江的说法，正确的是？',options:['长江是中国第一长河，注入渤海','长江发源于唐古拉山，注入东海','长江流经10个省区','长江全长约5400千米'],answer:1,hint:{approach:'长江发源于青藏高原唐古拉山脉，流经11个省区，全长约6300千米，是中国第一长河，最终注入东海。',pitfall:'注意区分长江和黄河！黄河注入渤海（不是东海），全长约5464千米，流经9个省区。长江注入东海，流经11个省区，全长约6300千米。',extension:'长江流经省区：青、藏、川、滇、渝、鄂、湘、赣、皖、苏、沪（11个）。上中游分界点——湖北宜昌；中下游分界点——江西湖口。长江被誉为"黄金水道"。'}},
{id:'g5',type:'choice',difficulty:'基础',knowledgePoint:'省级行政区',question:'下列省级行政区中，纬度最高的是？',options:['广东省','黑龙江省','海南省','新疆维吾尔自治区'],answer:1,hint:{approach:'纬度最高即最北。黑龙江省是中国最北的省份，漠河被称为"中国的北极"。广东和海南在南方，新疆虽然在西边但纬度没有黑龙江高。',pitfall:'区分纬度（南北）和经度（东西）！新疆是最西的省区之一，但不是最北的。黑龙江省既是中国最北也是最东的省份。',extension:'中国34个省级行政区：23个省、5个自治区、4个直辖市、2个特别行政区。口诀记忆："两湖两广两河山，五江云贵福吉安，四西二宁青甘陕，海内台北上重天，港澳特别行政区。"'}},
{id:'g6',type:'choice',difficulty:'中等',knowledgePoint:'人口',question:'我国人口分布的特点是？',options:['东部多西部少','西部多东部少','均匀分布','北方多南方少'],answer:0,hint:{approach:'中国人口分布以黑河—腾冲线（胡焕庸线）为界：东南半壁人口密集（约94%），西北半壁人口稀疏（约6%）。总体特征是东部多西部少。',pitfall:'人口分界线是黑河—腾冲线（胡焕庸线），不是其他线！这条线是1935年地理学家胡焕庸提出的，至今仍然适用。线东南人口稠密，线西北人口稀疏。',extension:'人口稠密的原因：东部地形平坦（平原多）、气候适宜（季风气候）、经济发达、交通便利。西部地形复杂（高原山地）、气候干旱、交通不便、经济相对落后。'}},
{id:'g7',type:'fill',difficulty:'中等',knowledgePoint:'板块构造',question:'世界两大火山地震带是___和___。',answer:'环太平洋火山地震带和地中海-喜马拉雅火山地震带',hint:{approach:'世界两大火山地震带：①环太平洋火山地震带（集中了全球约80%的地震）②地中海-喜马拉雅火山地震带（集中了约15%的地震）。',pitfall:'名称要准确！"地中海-喜马拉雅"不能只写"地中海"或只写"喜马拉雅"。环太平洋带不是"太平洋沿岸"而是"环太平洋"。',extension:'板块构造学说：地球岩石圈分为六大板块——亚欧板块、非洲板块、美洲板块、太平洋板块、印度洋板块、南极洲板块。板块交界处地壳活跃，多火山地震。中国位于亚欧板块东部，受太平洋板块和印度洋板块挤压。'}}
],

'历史':[
{id:'h1',type:'choice',difficulty:'基础',knowledgePoint:'鸦片战争',question:'鸦片战争爆发于哪一年？',options:['1839年','1840年','1842年','1856年'],answer:1,hint:{approach:'1840年6月，英国舰队封锁珠江口，鸦片战争正式爆发。1842年签订《南京条约》，鸦片战争结束。',pitfall:'区分鸦片战争的开始和结束！1840年爆发，1842年结束（签《南京条约》）。1856年是第二次鸦片战争爆发的年份。1839年是林则徐虎门销烟的年份。',extension:'鸦片战争的影响：中国从封建社会逐步沦为半殖民地半封建社会，是中国近代史的开端。《南京条约》是中国近代第一个不平等条约，内容包括割香港岛、赔款2100万银元、五口通商（广厦福宁上）、协定关税。'}},
{id:'h2',type:'choice',difficulty:'中等',knowledgePoint:'洋务运动',question:'洋务运动的口号是"自强"和"求富"，其中"求富"主要体现在？',options:['创办军事工业','创办民用工业','建立新式海军','兴办新式学堂'],answer:1,hint:{approach:'洋务运动前期（60年代起）以"自强"为口号创办军事工业（如安庆内军械所、江南制造总局）；后期（70年代起）以"求富"为口号创办民用工业（如轮船招商局、汉阳铁厂）。',pitfall:'"自强"对应军事工业，"求富"对应民用工业！不要搞混。军事工业需要大量资金，所以后期创办民用工业来"求富"以支持军事工业。',extension:'洋务运动代表人物：中央——奕訢；地方——曾国藩、李鸿章、左宗棠、张之洞。洋务运动引进了西方先进技术，创办了一批近代企业，培养了一批技术人才，但没有触动封建制度根本，最终在甲午中日战争中宣告破产。'}},
{id:'h3',type:'choice',difficulty:'基础',knowledgePoint:'辛亥革命',question:'辛亥革命最大的历史功绩是？',options:['推翻了清朝统治','结束了君主专制制度','建立了共和国','实现了民族独立'],answer:1,hint:{approach:'辛亥革命最大的功绩是推翻了延续两千多年的封建君主专制制度（帝制），使民主共和观念深入人心。虽然建立了中华民国，但没有实现真正的民族独立（半殖民地性质未变）。',pitfall:'"推翻清朝"和"结束君主专制"有区别！清朝只是一个朝代，君主专制是一种制度。辛亥革命不仅推翻了清朝，更重要的是结束了整个君主专制制度，这是根本性的变革。',extension:'辛亥革命局限性：没有完成反帝反封建的任务，没有改变中国半殖民地半封建社会的性质。胜利果实被袁世凯窃取。但它开启了中国近代民主革命的先河。'}},
{id:'h4',type:'choice',difficulty:'中等',knowledgePoint:'新文化运动',question:'新文化运动的两面旗帜（口号）是？',options:['自强与求富','民主与科学','自由与平等','独立与民主'],answer:1,hint:{approach:'新文化运动高举"民主"（德先生 Democracy）和"科学"（赛先生 Science）两面大旗，反对封建文化，提倡新文化。代表人物：陈独秀、李大钊、胡适、鲁迅。',pitfall:'不同运动的口号不同！洋务运动——自强、求富；新文化运动——民主、科学。不要混淆。"德先生"和"赛先生"是新文化运动的标志性称呼。',extension:'新文化运动分两个阶段：①前期（1915-1917）——提倡民主与科学，反对专制与迷信；提倡新道德，反对旧道德；提倡新文学，反对旧文学。②后期（1917后）——传播马克思主义，李大钊发表《我的马克思主义观》。'}},
{id:'h5',type:'choice',difficulty:'基础',knowledgePoint:'五四运动',question:'五四运动发生的直接原因是？',options:['俄国十月革命的影响','巴黎和会上中国外交失败','北洋军阀的黑暗统治','新文化运动的推动'],answer:1,hint:{approach:'五四运动的直接导火索是巴黎和会上中国外交的失败——列强将德国在山东的权益转交给日本，中国作为战胜国却遭到不公正待遇，引发学生抗议。',pitfall:'直接原因和背景原因不同！直接原因是巴黎和会外交失败（导火索）；背景原因包括北洋军阀统治、新文化运动的思想启蒙、十月革命的影响等。题目问"直接原因"要选巴黎和会。',extension:'五四运动意义：①是一次彻底的反帝反封建的爱国运动②青年学生起了先锋作用③无产阶级开始登上政治舞台④标志着中国新民主主义革命的开端。五四精神：爱国、进步、民主、科学。'}},
{id:'h6',type:'fill',difficulty:'中等',knowledgePoint:'抗日战争',question:'中国人民抗日战争开始于___年___月___日的___事变，结束于___年日本宣布无条件投降。',answer:'1931年9月18日九一八事变，1945年',hint:{approach:'抗日战争始于1931年9月18日的九一八事变（局部抗战开始），1937年7月7日七七事变（全面抗战开始），1945年8月15日日本宣布无条件投降，9月2日正式签署投降书。',pitfall:'注意区分局部抗战和全面抗战！九一八事变（1931）是14年抗战的开始，七七事变（1937）是全面抗战的开始。不要只从1937年算起——2017年教材已将抗战改为14年（1931-1945）。',extension:'抗战重大事件：①九一八事变(1931.9.18)——局部抗战开始②七七事变(1937.7.7)——全面抗战开始③台儿庄战役(1938)——正面战场重大胜利④百团大战(1940)——敌后战场主动出击⑤日本投降(1945.8.15)——抗战胜利。'}},
{id:'h7',type:'choice',difficulty:'中等',knowledgePoint:'改革开放',question:'我国改革开放首先从哪里开始？',options:['城市','农村','沿海','经济特区'],answer:1,hint:{approach:'改革开放首先从农村开始。1978年安徽凤阳小岗村率先实行家庭联产承包责任制，随后在全国推广。农村改革成功后，改革才推向城市。',pitfall:'改革先农村后城市！农村实行家庭联产承包责任制，城市进行国企改革。开放先沿海后内陆——先设深圳等经济特区，再开放沿海城市，最后开放内陆。',extension:'改革开放历程：①1978年十一届三中全会——改革开放的决策②农村：家庭联产承包责任制③1980年设深圳、珠海、汕头、厦门经济特区④1984年开放14个沿海城市⑤城市经济体制改革。改革开放是决定当代中国命运的关键抉择。'}}
],

'道法':[
{id:'d1',type:'choice',difficulty:'基础',knowledgePoint:'宪法',question:'我国的根本大法是？',options:['刑法','民法典','宪法','行政法'],answer:2,hint:{approach:'宪法是我国的根本大法，具有最高的法律效力。宪法规定了国家生活中最根本、最重要的问题，是其他法律的立法基础和立法依据。',pitfall:'宪法是根本大法，不是普通法律！宪法的法律效力最高，一切法律都不能与宪法相抵触。宪法的制定和修改程序比普通法律更严格。',extension:'宪法的特征：①内容上——规定国家根本制度②效力上——最高法律效力③程序上——制定修改更严格（全国人大2/3以上多数通过）。宪法核心价值追求：规范国家权力运行以保障公民权利。'}},
{id:'d2',type:'choice',difficulty:'基础',knowledgePoint:'公民权利',question:'下列属于公民基本权利的是？',options:['依法纳税','受教育权','保守国家秘密','遵守宪法和法律'],answer:1,hint:{approach:'公民基本权利包括：政治权利和自由、人身自由、社会经济权利、文化教育权利等。受教育权属于文化教育权利，是基本权利。A、C、D都是公民的基本义务而非权利。',pitfall:'区分权利和义务！权利是"可以做什么"（国家保障），义务是"必须做什么"（国家强制）。受教育既是权利也是义务（九年义务教育）。纳税、服兵役、保守秘密、遵守宪法法律都是义务。',extension:'公民基本义务：①维护国家统一和民族团结②遵守宪法和法律③保守国家秘密④依法服兵役⑤依法纳税。权利与义务具有一致性：享受权利的同时必须履行义务。'}},
{id:'d3',type:'choice',difficulty:'中等',knowledgePoint:'国家安全',question:'全民国家安全教育日是每年的？',options:['4月15日','3月15日','12月4日','11月1日'],answer:0,hint:{approach:'2015年7月通过的《国家安全法》将每年4月15日确定为全民国家安全教育日。3月15日是消费者权益日，12月4日是国家宪法日，11月1日是反间谍法颁布日。',pitfall:'各个重要日期不要混淆！4月15日——国家安全教育日；12月4日——国家宪法日；3月15日——消费者权益日。这些都是中考常考时间点。',extension:'国家安全包括：政治安全、国土安全、军事安全、经济安全、文化安全、社会安全、科技安全、网络安全、生态安全、资源安全、核安全等11个领域。维护国家安全是每个公民的义务。'}},
{id:'d4',type:'choice',difficulty:'中等',knowledgePoint:'人民代表大会制度',question:'我国的政体（根本政治制度）是？',options:['人民代表大会制度','社会主义制度','民族区域自治制度','中国共产党领导的多党合作和政治协商制度'],answer:0,hint:{approach:'人民代表大会制度是我国的根本政治制度（政体）。社会主义制度是我国的根本制度。民族区域自治制度和多党合作政治协商制度是基本政治制度。',pitfall:'根本制度和根本政治制度不同！根本制度——社会主义制度；根本政治制度——人民代表大会制度。基本政治制度有三个：①中国共产党领导的多党合作和政治协商制度②民族区域自治制度③基层群众自治制度。',extension:'国家机构组织原则：民主集中制。全国人民代表大会是最高国家权力机关，行使立法权、决定权、任免权、监督权。国务院是最高国家行政机关，对全国人大负责。'}},
{id:'d5',type:'choice',difficulty:'基础',knowledgePoint:'未成年人保护',question:'《未成年人保护法》规定，未成年人是指未满___周岁的公民。',options:['14周岁','16周岁','18周岁','20周岁'],answer:2,hint:{approach:'《未成年人保护法》第二条规定：未成年人是指未满十八周岁的公民。18周岁是成年的界限，18周岁以下享受未成年人保护法的特殊保护。',pitfall:'18周岁不是18虚岁！是满18周岁的实岁。注意不同法律中的年龄界限：①未满18周岁——未成年人②已满14周岁——可能承担刑事责任（八种严重犯罪）③已满16周岁——完全刑事责任能力。',extension:'未成年人保护六道防线：家庭保护、学校保护、社会保护、网络保护、政府保护、司法保护。2021年修订新增了"网络保护"和"政府保护"，体现了对未成年人全方位的保护。'}},

  }
}

function getSubjectClass(subj){

  return map[subj]||'';

// ===== Daily Training (每日训练) =====
// 每天自动生成一组新题：容易题 + 难题 + 易错题，三类齐全
let _dailySel = undefined;

function dailySeed(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){
    h ^= h<<13; h ^= h>>>17; h ^= h<<5;
    return ((h>>>0)/4294967296);
  };
}
function dailyShuffle(arr, rnd){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function dailyAllQuestions(){
  const out = [];
  Object.keys(QUESTION_BANK).forEach(subj=>{
    (QUESTION_BANK[subj]||[]).forEach(q=> out.push({id:q.id, subject:subj, difficulty:q.difficulty}));
  });
  return out;
}
function dailyFindQuestion(id){
  for(const subj in QUESTION_BANK){
    const f = (QUESTION_BANK[subj]||[]).find(x=>x.id===id);
    if(f) return Object.assign({subject:subj}, f);
  }
  return null;
}
function dailyMistakePool(){
  return load(SK.mistakePool, [])||[];
}
function dailyUpdateMistake(id, subject, correct){
  let pool = load(SK.mistakePool, [])||[];
  let e = pool.find(x=>x.id===id);
  if(!e){ e = {id:id, subject:subject, wrong:0}; pool.push(e); }
  e.subject = subject;
  e.wrong = correct ? Math.max(0,(e.wrong||0)-1) : (e.wrong||0)+1;
  save(SK.mistakePool, pool);
}
function dailyErrorProneCandidates(){
  const errors = load(SK.errors, [])||[];
  const ids = new Set(dailyAllQuestions().map(q=>q.id));
  const out = [];
  errors.forEach(e=>{
    const qid = e.practiceId || e.questionId;
    if(qid && ids.has(qid)){
      let subj = e.subject;
      if(!(QUESTION_BANK[subj]||[]).some(x=>x.id===qid)){
        for(const s in QUESTION_BANK){ if((QUESTION_BANK[s]||[]).some(x=>x.id===qid)){ subj=s; break; } }
      }
      if(subj) out.push({id:qid, subject:subj, wrong:9999});
    }
  });
  dailyMistakePool().forEach(p=>{ if(ids.has(p.id)) out.push({id:p.id, subject:p.subject, wrong:p.wrong||0}); });
  const map = {};
  out.forEach(o=>{ if(!map[o.id] || o.wrong>map[o.id].wrong) map[o.id]=o; });
  return Object.values(map);
}
function dailyGenerate(today){
  const all = dailyAllQuestions();
  const rnd = dailySeed(today);
  const easyPool = all.filter(q=>q.difficulty==='基础');
  const hardPool = all.filter(q=>q.difficulty==='提高' || q.difficulty==='中等');
  const hardReal = all.filter(q=>q.difficulty==='提高');
  const candidates = dailyErrorProneCandidates();
  const used = new Set();
  const picked = [];
  function pick(pool, n, kind){
    let arr = dailyShuffle(pool.filter(q=>!used.has(q.id)), rnd);
    const t = arr.slice(0, n);
    t.forEach(q=>{ used.add(q.id); picked.push({id:q.id, subject:q.subject, kind:kind}); });
    return t.length;
  }
  // 容易题 3 (基础)
  let ne = pick(easyPool, 3, 'easy');
  if(ne<3) pick(all, 3-ne, 'easy');
  // 难题 3 (优先提高，再中等)
  let nh = pick(hardReal, 3, 'hard');
  if(nh<3) nh += pick(hardPool, 3-nh, 'hard');
  if(nh<3) pick(all, 3-nh, 'hard');
  // 易错题 3 (错题本/错题库优先，不足用中等/提高补充)
  let nm = pick(candidates, 3, 'mistake');
  if(nm<3) nm += pick(hardPool, 3-nm, 'mistake');
  if(nm<3) pick(all, 3-nm, 'mistake');
  const items = dailyShuffle(picked, rnd);
  return { date:today, items:items, results:{}, completed:false, score:0, awarded:false };
}
function getDailyTraining(){
  const today = todayStr();
  let dt = load(SK.dailyTraining, null);
  if(!dt || dt.date!==today){
    dt = dailyGenerate(today);
    save(SK.dailyTraining, dt);
  }
  return dt;
}

      + '<button class="btn btn-primary btn-sm" onclick="startDailyTraining()">查看 / 重新挑战</button>'

    + '<span class="db-progress">进度 ' + answered + '/' + total + '</span>'
    + '</div>'
    + '<button class="btn btn-primary btn-sm" onclick="startDailyTraining()">' + (answered>0?'继续今日训练':'开始今日训练') + '</button>'

function startDailyTraining(){
  const dt = getDailyTraining();
  let idx = dt.items.findIndex(i=> !(dt.results && dt.results[i.id]));
  if(idx<0) idx = 0;
  renderDailyModal(idx);
}
function renderDailyModal(idx){
  const dt = getDailyTraining();
  const item = dt.items[idx];
  const q = dailyFindQuestion(item.id);
  if(!q){ closeModal(); return; }
  const total = dt.items.length;
  _dailySel = undefined;
  const kindMap = {easy:'容易题', hard:'难题', mistake:'易错题'};
  const kindCss = {easy:'dq-tag-easy', hard:'dq-tag-hard', mistake:'dq-tag-mistake'};
  const kindIcon = {easy:'🌱', hard:'🔥', mistake:'⚠️'};
  let body = '';
  if(q.type==='choice'){
    q.options.forEach((o,i)=>{
      body += '<button class="dq-opt" id="dq-opt-'+idx+'-'+i+'" onclick="dailySelect('+idx+','+i+')"><span class="dq-key">'+String.fromCharCode(65+i)+'</span>'+dqEscape(o)+'</button>';
    });
  } else if(q.type==='judge'){
    body += '<button class="dq-opt" id="dq-opt-'+idx+'-t" onclick="dailySelect('+idx+',true)">✓ 正确</button>';
    body += '<button class="dq-opt" id="dq-opt-'+idx+'-f" onclick="dailySelect('+idx+',false)">✗ 错误</button>';
  } else {
    body += '<input class="dq-fill" id="dq-fill-'+idx+'" placeholder="输入你的答案…" onkeydown="if(event.key===\'Enter\')dailySubmit('+idx+')">';
  }
  const dots = dt.items.map((it,i)=>'<span class="dq-dot '+(i===it.id?'cur':'')+' '+((dt.results&&dt.results[it.id])?(dt.results[it.id].correct?'ok':'bad'):'')+'"></span>').join('');
  const html = '<div class="dq-modal">'
    + '<div class="dq-head">'
    + '<div><span class="dq-tag '+kindCss[item.kind]+'">'+kindIcon[item.kind]+' '+kindMap[item.kind]+'</span> <span class="dq-subj">'+dqEscape(q.subject)+' · '+dqEscape(q.knowledgePoint)+'</span></div>'
    + '<div class="dq-count">'+(idx+1)+' / '+total+'</div>'
    + '</div>'
    + '<div class="dq-dots">'+dots+'</div>'
    + '<div class="dq-q">'+dqEscape(q.question)+'</div>'
    + '<div class="dq-opts">'+body+'</div>'
    + '<div class="dq-actions">'
    + '<button class="btn btn-ghost btn-sm" onclick="dailyShowHint('+idx+')">💡 看提示</button>'
    + '<button class="btn btn-primary btn-sm" id="dq-submit-'+idx+'" onclick="dailySubmit('+idx+')" disabled>提交</button>'
    + '</div>'
    + '<div id="dq-feedback-'+idx+'"></div>'
    + '</div>';
  showModal(html);
}
function dailySelect(idx, val){
  _dailySel = val;
  const q = dailyFindQuestion(getDailyTraining().items[idx].id);
  if(q.type==='choice'){
    q.options.forEach((o,i)=>{ const el=document.getElementById('dq-opt-'+idx+'-'+i); if(el) el.classList.toggle('sel', i===val); });
    const sb=document.getElementById('dq-submit-'+idx); if(sb) sb.disabled=false;
  } else if(q.type==='judge'){
    const t=document.getElementById('dq-opt-'+idx+'-t'), f=document.getElementById('dq-opt-'+idx+'-f');
    if(t) t.classList.toggle('sel', val===true);
    if(f) f.classList.toggle('sel', val===false);
    const sb=document.getElementById('dq-submit-'+idx); if(sb) sb.disabled=false;
  }
}
function dailyFillMatch(user, correct){
  const c = String(correct).toLowerCase().replace(/\s/g,'');
  const u = String(user).toLowerCase().replace(/\s/g,'');
  if(!u) return null;
  if(c.indexOf(u)>=0 || u.indexOf(c)>=0) return true;
  if(typeof checkFillAnswer==='function') return checkFillAnswer(u,c);
  return false;
}
function dailySubmit(idx){
  const dt = getDailyTraining();
  const item = dt.items[idx];
  const q = dailyFindQuestion(item.id);
  let isCorrect = false;
  let userVal = _dailySel;
  if(q.type==='choice'){ if(typeof _dailySel==='number') isCorrect = (_dailySel===q.answer); }
  else if(q.type==='judge'){ if(typeof _dailySel==='boolean') isCorrect = (_dailySel===q.answer); }
  else {
    const inp=document.getElementById('dq-fill-'+idx);
    const v=inp?inp.value.trim():'';
    const r=dailyFillMatch(v, q.answer);
    if(r===null){ toast('请输入答案','warning'); return; }
    isCorrect=r; userVal=v;
  }
  if(q.type!=='fill' && _dailySel===undefined){ toast('请先选择答案','warning'); return; }
  practiceState.answered.add(item.id);
  practiceState.answeredMap[item.id] = (q.type==='fill') ? userVal : _dailySel;
  if(isCorrect) practiceState.correctIds.add(item.id); else practiceState.wrongIds.add(item.id);
  savePracticeState();
  addStudyLog(item.subject, 'practice', 5);
  if(isCorrect){
    const pts = q.difficulty==='基础'?5:q.difficulty==='中等'?8:12;
    addPoints(pts, 'practice_correct', '每日训练答对('+q.subject+')');
  } else {
    addPoints(2, 'practice_wrong', '每日训练答错(鼓励分)');
  }
  dailyUpdateMistake(item.id, item.subject, isCorrect);
  dt.results[item.id] = {correct:isCorrect, choice:_dailySel};
  const answered = Object.keys(dt.results).length;
  if(answered>=dt.items.length){
    dt.completed = true;
    if(!dt.awarded){ dt.score = (dt.score||0)+10; dt.awarded=true; addPoints(10,'daily_complete','完成今日训练'); }
  }
  save(SK.dailyTraining, dt);
  checkPerfectDay();
  const fb = document.getElementById('dq-feedback-'+idx);
  let hintHtml = '';
  if(q.hint){
    hintHtml = '<div class="dq-hint"><div class="dqh-title">📖 解析</div>'
      + '<div><b>思路：</b>'+dqEscape(q.hint.approach||'')+'</div>'
      + '<div><b>易错点：</b>'+dqEscape(q.hint.pitfall||'')+'</div>'
      + (q.hint.extension?'<div><b>拓展：</b>'+dqEscape(q.hint.extension)+'</div>':'')
      + '</div>';
  }
  const correctAns = q.type==='choice' ? String.fromCharCode(65+q.answer)+'. '+q.options[q.answer] : (q.type==='judge'?(q.answer?'正确':'错误'):q.answer);
  let fbHtml = '<div class="dq-result '+(isCorrect?'ok':'bad')+'">'
    + '<div class="dqr-line">'+(isCorrect?'✅ 回答正确！':'❌ 回答错误')+'</div>'
    + '<div class="dqr-ans">正确答案：'+dqEscape(correctAns)+'</div>'
    + hintHtml
    + (!isCorrect?'<button class="btn btn-outline btn-sm" onclick="addToErrorsFromPractice(\''+item.id+'\',\''+item.subject+'\')">📝 加入错题本</button>':'')
    + (idx+1<dt.items.length
        ? '<button class="btn btn-primary btn-sm" onclick="renderDailyModal('+(idx+1)+')">下一题 →</button>'
        : '<button class="btn btn-primary btn-sm" onclick="finishDailyTraining()">完成今日训练 🎉</button>')
    + '</div>';
  if(fb) fb.innerHTML = fbHtml;
}
function dailyShowHint(idx){
  const dt = getDailyTraining();
  const q = dailyFindQuestion(dt.items[idx].id);
  const fb = document.getElementById('dq-feedback-'+idx);
  if(!fb||!q||!q.hint) return;
  fb.innerHTML = '<div class="dq-hint"><div class="dqh-title">💡 提示</div><div>'+dqEscape(q.hint.approach||'')+'</div></div>';
}
function finishDailyTraining(){
  const dt = getDailyTraining();
  closeModal();
  renderPractice();
  const correct = Object.values(dt.results||{}).filter(r=>r&&r.correct).length;
  toast('🎉 今日训练完成！答对 '+correct+'/'+dt.items.length+(dt.awarded?'，+10 积分':''),'success');
}
function dqEscape(s){
  return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
