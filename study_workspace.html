<title>学习台</title>
<style>
/* ===== CSS Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-primary:#4F7DF0;--c-primary-dark:#3A63C8;--c-primary-light:#EAF0FE;
  --c-accent:#22B8A6;--c-accent-light:#E4F6F3;
  --c-warning:#F5A623;--c-warning-light:#FFF5E5;
  --c-danger:#E74C3C;--c-danger-light:#FDECEA;
  --c-purple:#6C5CE7;--c-purple-light:#EFEDFD;
  --c-bg:#F0F4F8;--c-card:#FFFFFF;--c-text:#2C3E50;--c-text-light:#7A8B9C;
  --c-border:#E0E6ED;--c-border-light:#EDF0F4;
  --radius:12px;--radius-sm:8px;
  --shadow:0 2px 8px rgba(0,0,0,0.06);--shadow-lg:0 4px 20px rgba(0,0,0,0.1);
  --sidebar-w:200px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--c-bg);color:var(--c-text);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;border:1.5px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 14px;width:100%;outline:none;transition:border-color .2s;background:#fff;color:var(--c-text)}
input:focus,textarea:focus,select:focus{border-color:var(--c-primary)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#C5CED9;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== Layout ===== */
#app{display:flex;height:100vh;height:100dvh}
#sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#3A7BC8 0%,#2C6BB5 100%);display:flex;flex-direction:column;padding:16px 0;flex-shrink:0;z-index:100;transition:transform .3s}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 20px 20px;color:#fff}
.sidebar-logo svg{width:32px;height:32px;flex-shrink:0}
.sidebar-logo span{font-size:16px;font-weight:700;letter-spacing:.5px}
.nav-items{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:0 12px;overflow-y:auto;overflow-x:hidden}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);color:rgba(255,255,255,.75);font-size:14px;font-weight:500;transition:all .2s;min-height:44px;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.nav-item .badge{margin-left:auto;background:var(--c-danger);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1)}
.sync-status{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.6);font-size:12px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#5BB85A}
.sync-dot.offline{background:#F5A623}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:52px;background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.topbar-title{font-size:17px;font-weight:700;color:var(--c-text)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.topbar-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);background:var(--c-primary-light);color:var(--c-primary);font-size:13px;font-weight:600;transition:all .2s;min-height:36px}
.topbar-btn:hover{background:#D6E8FA}
.topbar-btn svg{width:16px;height:16px}

#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px}
.tab-page{display:none}
.tab-page.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== Components ===== */
.card{background:var(--c-card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-title svg{width:20px;height:20px;color:var(--c-primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:all .2s;min-height:40px;white-space:nowrap}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-primary:hover{background:var(--c-primary-dark)}
.btn-accent{background:var(--c-accent);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--c-border);color:var(--c-text)}
.btn-outline:hover{border-color:var(--c-primary);color:var(--c-primary)}
.btn-danger{background:var(--c-danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px;min-height:32px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn-icon svg{width:18px;height:18px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;gap:4px}
.tag-blue{background:var(--c-primary-light);color:var(--c-primary)}
.tag-green{background:var(--c-accent-light);color:var(--c-accent)}
.tag-orange{background:var(--c-warning-light);color:var(--c-warning)}
.tag-red{background:var(--c-danger-light);color:var(--c-danger)}
.tag-purple{background:var(--c-purple-light);color:var(--c-purple)}
.tag-gray{background:#F0F0F0;color:#888}
.empty-state{text-align:center;padding:40px 20px;color:var(--c-text-light)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.empty-state p{font-size:14px}

/* ===== Modal ===== */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:center;animation:fadeIn .2s}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);width:90%;max-width:600px;max-height:86vh;overflow-y:auto;animation:slideUp .3s}
.modal-confirm-body{font-size:15px;line-height:1.7;padding:10px 14px 18px;color:var(--c-text)}
.modal-confirm-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.parent-task-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:var(--radius-sm);background:var(--c-bg);border:1px solid var(--c-border-light)}
.ptr-main{flex:1;min-width:0}
.ptr-content{font-size:14px;color:var(--c-text);word-break:break-word}
.ptr-meta{display:flex;gap:6px;align-items:center;margin-top:4px}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--c-border)}
.modal-title{font-size:17px;font-weight:700}
.modal-body{padding:22px 28px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:18px 28px;border-top:1px solid var(--c-border)}
.modal-close{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--c-text-light);transition:all .2s}
.modal-close:hover{background:var(--c-bg);color:var(--c-text)}
.modal-close svg{width:20px;height:20px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--c-text);margin-bottom:6px}
.form-row{display:flex;gap:12px}
.form-row>.form-group{flex:1}
.seg{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1.5px solid var(--c-border);border-radius:var(--radius-sm);cursor:pointer;font-size:14px;transition:all .15s}
.seg input{width:auto;padding:0;margin:0}
.seg:has(input:checked){border-color:var(--c-primary);background:var(--c-primary-light);color:var(--c-primary);font-weight:600}
.interest-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1.5px solid var(--c-border);border-radius:999px;cursor:pointer;font-size:13px;transition:all .15s;user-select:none}
.chip input{width:auto;padding:0;margin:0}
.chip:has(input:checked){border-color:var(--c-primary);background:var(--c-primary-light);color:var(--c-primary);font-weight:600}
.welcome-interests{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wtag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--c-primary-light);color:var(--c-primary);font-size:12px;font-weight:600}

/* ===== Toast ===== */
#toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:12px 18px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;animation:slideInRight .3s;max-width:320px;border-left:4px solid var(--c-primary)}
.toast.success{border-left-color:var(--c-accent)}
.toast.error{border-left-color:var(--c-danger)}
.toast.warning{border-left-color:var(--c-warning)}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== Today Page ===== */
.today-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.overdue-list{display:flex;flex-direction:column;gap:8px}
.overdue-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius-sm);background:var(--c-danger-light);border-left:3px solid var(--c-danger)}
.overdue-item .oi-info{flex:1}
.overdue-item .oi-subject{font-size:13px;font-weight:700;color:var(--c-danger)}
.overdue-item .oi-content{font-size:13px;color:var(--c-text);margin-top:2px}
.today-task-list{display:flex;flex-direction:column;gap:8px}
.today-task-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius-sm);background:var(--c-bg);border:1px solid var(--c-border-light);transition:all .2s}
.today-task-item.done{opacity:.5}
.today-task-item.done .tti-content{text-decoration:line-through}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--c-border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s}
.task-check.done{background:var(--c-accent);border-color:var(--c-accent)}
.task-check.done svg{width:14px;height:14px;color:#fff}
.task-check svg{display:none}
.task-check.done svg{display:block}
.tti-content{flex:1;font-size:14px}
.tti-meta{display:flex;gap:6px;align-items:center}
.priority-dot{width:8px;height:8px;border-radius:50%}
.priority-dot.p0{background:var(--c-danger)}
.priority-dot.p1{background:var(--c-warning)}
.priority-dot.p2{background:var(--c-text-light)}

/* ===== Schedule ===== */
.schedule-table{width:100%;border-collapse:collapse;font-size:12px}
.schedule-table th,.schedule-table td{border:1px solid var(--c-border-light);padding:6px 4px;text-align:center;min-width:50px}
.schedule-table th{background:var(--c-primary-light);color:var(--c-primary);font-weight:700;padding:8px 4px}
.schedule-table td{height:38px;font-size:11px;color:var(--c-text)}
.schedule-table td.today-col{background:var(--c-warning-light)}
.schedule-table .subject-chinese{background:#FFF5E5}
.schedule-table .subject-math{background:#E8F2FC}
.schedule-table .subject-english{background:#E8F8E8}
.schedule-table .subject-physics{background:#F3EDFC}
.schedule-table .subject-biology{background:#FDECEA}
.schedule-table .subject-geography{background:#E0F5F5}
.schedule-table .subject-history{background:#FFF0E5}
.schedule-table .subject-ethics{background:#F5F0FF}
.schedule-table .subject-chemistry{background:#FFEEEE}
.schedule-table .subject-pe{background:#E8F8F0}
.schedule-table .subject-art{background:#FFF5F5}
.schedule-table .subject-it{background:#F0F5FF}
/* 课程表编辑弹窗内的输入控件 */
.schedule-table.schedule-edit th{background:var(--c-primary-light);color:var(--c-primary);font-weight:700}
.schedule-table.schedule-edit td{background:#fff;height:auto;padding:3px 3px}
.schedule-table .sch-subj{width:100%;min-width:46px;box-sizing:border-box;border:1px solid var(--c-border-light);border-radius:4px;padding:4px 3px;font-size:11px;text-align:center;color:var(--c-text);background:#FAFAFA}
.schedule-table .sch-subj:focus{outline:none;border-color:var(--c-primary);background:#fff}
.schedule-table .sch-period{white-space:nowrap}
.schedule-table .sch-time{width:62px;box-sizing:border-box;border:1px solid var(--c-border-light);border-radius:4px;padding:3px 4px;font-size:11px;color:var(--c-text);background:#FAFAFA;margin-top:3px}
.schedule-table .sch-time:focus{outline:none;border-color:var(--c-primary);background:#fff}
.schedule-edit-tip{font-size:12px;color:var(--c-text-light);margin-bottom:14px;line-height:1.6}
.schedule-table .subject-empty{background:#FAFAFA;color:#CCC}

/* ===== Pomodoro ===== */
.pomodoro-card{text-align:center}
.pomodoro-display{width:200px;height:200px;margin:0 auto 20px;position:relative}
.pomodoro-time{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.pomodoro-time .pt-min{font-size:48px;font-weight:800;color:var(--c-primary);line-height:1}
.pomodoro-time .pt-label{font-size:13px;color:var(--c-text-light);margin-top:4px}
.pomodoro-controls{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.pomodoro-stats{display:flex;gap:20px;justify-content:center}
.pomo-stat{text-align:center}
.pomo-stat .ps-num{font-size:24px;font-weight:700;color:var(--c-primary)}
.pomo-stat .ps-label{font-size:12px;color:var(--c-text-light)}

/* ===== Error Notebook ===== */
.error-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.subject-filter{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.subject-chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;background:#fff;border:1.5px solid var(--c-border);color:var(--c-text-light);min-height:36px;display:flex;align-items:center}
.subject-chip:hover{border-color:var(--c-primary)}
.subject-chip.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.error-list{display:flex;flex-direction:column;gap:12px}
.error-item{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border-left:4px solid var(--c-primary);transition:all .2s}
.error-item.status-reviewing{border-left-color:var(--c-warning)}
.error-item.status-mastered{border-left-color:var(--c-accent);opacity:.7}
.error-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.error-item-subject{font-size:13px;font-weight:700}
.error-item-kp{font-size:13px;color:var(--c-text-light);margin-bottom:6px}
.error-item-question{font-size:14px;color:var(--c-text);margin-bottom:8px;white-space:pre-wrap;word-break:break-all}
.error-item-answer{font-size:13px;color:var(--c-text-light);background:var(--c-bg);padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:8px;white-space:pre-wrap;word-break:break-all}
.error-item-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.error-item-actions{display:flex;gap:6px}
.review-badge{font-size:11px;color:var(--c-text-light);display:flex;align-items:center;gap:4px}
.review-badge svg{width:14px;height:14px}

/* ===== C++ Module ===== */
.cpp-layout{display:grid;grid-template-columns:240px 1fr;gap:16px;height:calc(100vh - 140px)}
.cpp-sidebar{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;overflow-y:auto}
.cpp-lesson-item{padding:12px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.cpp-lesson-item:hover{background:var(--c-bg)}
.cpp-lesson-item.active{background:var(--c-primary-light);color:var(--c-primary)}
.cpp-lesson-num{width:28px;height:28px;border-radius:50%;background:var(--c-border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.cpp-lesson-item.completed .cpp-lesson-num{background:var(--c-accent);color:#fff}
.cpp-lesson-item.active .cpp-lesson-num{background:var(--c-primary);color:#fff}
.cpp-lesson-title{font-size:13px;font-weight:500;line-height:1.3}
.cpp-content{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;overflow-y:auto;display:flex;flex-direction:column}
.cpp-lesson-header{margin-bottom:16px}
.cpp-lesson-header h2{font-size:20px;font-weight:700;margin-bottom:4px}
.cpp-lesson-header p{font-size:13px;color:var(--c-text-light)}
.cpp-section{margin-bottom:20px}
.cpp-section h3{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--c-primary)}
.cpp-section p{font-size:14px;line-height:1.7;margin-bottom:8px;color:var(--c-text)}
.cpp-code-block{background:#1E2A3A;color:#A8B8C8;border-radius:var(--radius-sm);padding:14px 16px;font-family:"Fira Code",Consolas,"Courier New",monospace;font-size:13px;line-height:1.6;overflow-x:auto;margin:8px 0;white-space:pre}
.cpp-code-block .kw{color:#C792EA}
.cpp-code-block .str{color:#C3E88D}
.cpp-code-block .num{color:#F78C6C}
.cpp-code-block .com{color:#5C6B7A;font-style:italic}
.cpp-code-block .fn{color:#82AAFF}
.cpp-code-block .type{color:#FFCB6B}
.code-editor{background:#1E2A3A;color:#A8B8C8;border-radius:var(--radius-sm);padding:14px 16px;font-family:"Fira Code",Consolas,"Courier New",monospace;font-size:13px;line-height:1.6;border:none;width:100%;min-height:200px;resize:vertical;outline:none;tab-size:4;white-space:pre;overflow-x:auto}
.code-output{background:#0D1117;color:#C9D1D9;border-radius:var(--radius-sm);padding:14px 16px;font-family:"Fira Code",Consolas,"Courier New",monospace;font-size:13px;line-height:1.6;min-height:100px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.code-output .output-label{color:#58A6FF;font-size:12px;margin-bottom:8px;display:block}
.code-output .error-line{color:#F85149}
.code-toolbar{display:flex;gap:8px;margin:8px 0}
.cpp-projects{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.project-card{background:var(--c-bg);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all .2s;border:2px solid transparent}
.project-card:hover{border-color:var(--c-primary)}
.project-card h4{font-size:14px;font-weight:700;margin-bottom:4px}
.project-card p{font-size:12px;color:var(--c-text-light)}
.cpp-problem-desc{background:#F8F9FB;border:1px solid #E2E8F0;border-radius:var(--radius-sm);padding:16px;font-size:14px;line-height:1.8;color:var(--c-text);margin:8px 0}
.cpp-problem-desc strong{color:var(--c-primary)}
.cpp-sample-io{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.cpp-sample-block{background:#1E2A3A;border-radius:var(--radius-sm);overflow:hidden}
.cpp-sample-label{background:#2A3A4A;color:#8899AA;font-size:11px;font-weight:600;padding:6px 12px;text-transform:uppercase;letter-spacing:.5px}
.cpp-sample-content{color:#C3E88D;font-family:"Fira Code",Consolas,monospace;font-size:13px;padding:10px 12px;white-space:pre-wrap;word-break:break-all}
.cpp-difficulty{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-left:8px}
.cpp-difficulty.easy{background:#E8F5E9;color:#2E7D32}
.cpp-difficulty.medium{background:#FFF3E0;color:#E65100}
.cpp-difficulty.hard{background:#FFEBEE;color:#C62828}
.cpp-hint-box{background:#FFF8E1;border:1px solid #FFE082;border-radius:var(--radius-sm);padding:14px;margin:8px 0}
.cpp-hint-box h4{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cpp-hint-box p{font-size:13px;line-height:1.7;color:var(--c-text)}
.cpp-algo-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600;margin-right:4px}
.cpp-complexity{display:flex;gap:16px;margin:8px 0;padding:8px 12px;background:var(--c-bg);border-radius:var(--radius-sm)}
.cpp-complexity span{font-size:13px}
.cpp-complexity strong{color:var(--c-primary)}

/* ===== Statistics ===== */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.stat-chart-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.stat-chart-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.stat-chart-title svg{width:18px;height:18px;color:var(--c-primary)}
.heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heatmap-cell{aspect-ratio:1;border-radius:3px;background:var(--c-border-light)}
.heatmap-cell.l1{background:#C8E6C9}
.heatmap-cell.l2{background:#81C784}
.heatmap-cell.l3{background:#4CAF50}
.heatmap-cell.l4{background:#2E7D32}
.heatmap-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--c-text-light);margin-top:8px}
.parent-lock{text-align:center;padding:40px 20px}
.parent-lock svg{width:56px;height:56px;color:var(--c-text-light);margin-bottom:16px}
.parent-lock h3{font-size:18px;font-weight:700;margin-bottom:8px}
.parent-lock p{font-size:14px;color:var(--c-text-light);margin-bottom:20px}
.pin-input{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.pin-digit{width:48px;height:56px;text-align:center;font-size:24px;font-weight:700;border:2px solid var(--c-border);border-radius:var(--radius-sm)}
.pin-digit:focus{border-color:var(--c-primary)}

/* ===== Practice / Question Bank ===== */
.practice-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.practice-filter{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.difficulty-filter{display:flex;gap:6px;align-items:center}
.difficulty-chip{padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;background:#fff;border:1.5px solid var(--c-border);color:var(--c-text-light)}
.difficulty-chip:hover{border-color:var(--c-primary)}
.difficulty-chip.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.practice-progress-bar{height:8px;background:var(--c-border-light);border-radius:4px;overflow:hidden;margin-bottom:16px}
.practice-progress-fill{height:100%;background:linear-gradient(90deg,var(--c-primary),var(--c-accent));border-radius:4px;transition:width .5s}
.practice-stats-row{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.practice-stat{background:#fff;border-radius:var(--radius-sm);padding:10px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.practice-stat .ps-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.practice-stat .ps-icon.correct{background:var(--c-accent-light);color:var(--c-accent)}
.practice-stat .ps-icon.wrong{background:var(--c-danger-light);color:var(--c-danger)}
.practice-stat .ps-icon.total{background:var(--c-primary-light);color:var(--c-primary)}
.practice-stat .ps-val{font-size:18px;font-weight:700}
.practice-stat .ps-lbl{font-size:11px;color:var(--c-text-light)}
.question-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 28px;margin-bottom:16px;border-top:4px solid var(--c-primary)}
.question-card.math{border-top-color:#4A90D9}.question-card.chinese{border-top-color:#F5A623}
.question-card.english{border-top-color:#5BB85A}.question-card.physics{border-top-color:#8E5BD9}
.question-card.chemistry{border-top-color:#E74C3C}.question-card.biology{border-top-color:#26A69A}
.question-card.geography{border-top-color:#42A5F5}.question-card.history{border-top-color:#FF7043}
.question-card.ethics{border-top-color:#AB47BC}
.question-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.question-meta .qm-subject{font-size:13px;font-weight:700}
.question-meta .qm-type{font-size:11px;color:var(--c-text-light);background:var(--c-bg);padding:2px 8px;border-radius:10px}
.question-meta .qm-difficulty{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.qm-difficulty.basic{background:var(--c-accent-light);color:var(--c-accent)}
.qm-difficulty.medium{background:var(--c-warning-light);color:var(--c-warning)}
.qm-difficulty.hard{background:var(--c-danger-light);color:var(--c-danger)}
.question-text{font-size:15px;line-height:1.7;color:var(--c-text);margin-bottom:16px;white-space:pre-wrap}
.question-text .code-inline{background:#1E2A3A;color:#A8B8C8;padding:2px 6px;border-radius:4px;font-family:Consolas,monospace;font-size:13px}
.option-list{display:flex;flex-direction:column;gap:10px}
.option-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-sm);border:2px solid var(--c-border);cursor:pointer;transition:all .2s;min-height:48px}
.option-item:hover{border-color:var(--c-primary);background:var(--c-primary-light)}
.option-item.selected{border-color:var(--c-primary);background:var(--c-primary-light)}
.option-item.correct-answer{border-color:var(--c-accent);background:var(--c-accent-light)}
.option-item.wrong-answer{border-color:var(--c-danger);background:var(--c-danger-light)}
.option-letter{width:32px;height:32px;border-radius:50%;background:var(--c-border-light);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;transition:all .2s}
.option-item.selected .option-letter{background:var(--c-primary);color:#fff}
.option-item.correct-answer .option-letter{background:var(--c-accent);color:#fff}
.option-item.wrong-answer .option-letter{background:var(--c-danger);color:#fff}
.option-text{font-size:14px;flex:1}
.fill-input-area{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.fill-input-area input{max-width:300px}
.judge-options{display:flex;gap:12px}
.judge-btn{flex:1;max-width:200px;padding:14px;border-radius:var(--radius-sm);border:2px solid var(--c-border);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.judge-btn:hover{border-color:var(--c-primary)}
.judge-btn.correct-answer{border-color:var(--c-accent);background:var(--c-accent-light);color:var(--c-accent)}
.judge-btn.wrong-answer{border-color:var(--c-danger);background:var(--c-danger-light);color:var(--c-danger)}
.answer-feedback{margin-top:16px;padding:20px 24px;border-radius:var(--radius-sm);animation:fadeIn .3s}
.answer-feedback.correct{background:var(--c-accent-light);border-left:4px solid var(--c-accent)}
.answer-feedback.wrong{background:var(--c-danger-light);border-left:4px solid var(--c-danger)}
.feedback-header{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:8px}
.feedback-header.correct{color:var(--c-accent)}
.feedback-header.wrong{color:var(--c-danger)}
.feedback-header svg{width:20px;height:20px}
.hint-panel{margin-top:12px;background:#FFFBF0;border:1px solid #F5E6C8;border-radius:var(--radius-sm);padding:20px 24px;animation:fadeIn .3s}
.hint-panel-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#B8860B;margin-bottom:10px}
.hint-panel-title svg{width:18px;height:18px}
.hint-section{margin-bottom:12px}
.hint-section:last-child{margin-bottom:0}
.hint-label{font-size:12px;font-weight:700;color:#B8860B;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.hint-content{font-size:13px;line-height:1.7;color:var(--c-text)}
.hint-content .highlight{background:#FFF3CD;padding:1px 4px;border-radius:3px;font-weight:600}
.question-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.no-more-questions{text-align:center;padding:40px 20px;color:var(--c-text-light)}
.no-more-questions svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.subject-questions-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.subject-questions-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.subject-questions-title .sq-color-dot{width:12px;height:12px;border-radius:50%}

/* ===== Gamification ===== */
.points-badge{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(255,165,0,.3);cursor:pointer;transition:transform .2s}
.points-badge:hover{transform:scale(1.05)}
.points-badge svg{width:16px;height:16px}
.level-badge{display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.points-float{position:fixed;top:80px;right:30px;font-size:24px;font-weight:800;color:#FFD700;text-shadow:0 2px 8px rgba(255,215,0,.5);z-index:9999;pointer-events:none;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{opacity:0;transform:translateY(-80px) scale(1)}}
.level-up-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:32px 48px;border-radius:20px;text-align:center;z-index:10000;box-shadow:0 8px 40px rgba(102,126,234,.5);animation:bannerPop .6s ease-out}
@keyframes bannerPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}60%{transform:translate(-50%,-50%) scale(1.1)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.level-up-banner .lu-icon{font-size:48px;margin-bottom:8px}
.level-up-banner .lu-title{font-size:24px;font-weight:800;margin-bottom:4px}
.level-up-banner .lu-sub{font-size:14px;opacity:.9}
.growth-overview{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.growth-hero{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:var(--radius);padding:24px;color:#fff;text-align:center;position:relative;overflow:hidden}
.growth-hero::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;background:rgba(255,255,255,.1);border-radius:50%}
.growth-hero::after{content:'';position:absolute;bottom:-30px;left:-10px;width:80px;height:80px;background:rgba(255,255,255,.08);border-radius:50%}
.growth-hero .gh-level{font-size:14px;opacity:.9;margin-bottom:4px}
.growth-hero .gh-level-num{font-size:48px;font-weight:800;line-height:1}
.growth-hero .gh-title{font-size:18px;font-weight:700;margin-top:4px}
.growth-hero .gh-points{font-size:13px;opacity:.85;margin-top:8px}
.level-progress-wrap{margin-top:12px;background:rgba(255,255,255,.2);height:10px;border-radius:5px;overflow:hidden}
.level-progress-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FFA500);border-radius:5px;transition:width .5s ease}
.level-progress-text{font-size:11px;opacity:.8;margin-top:4px}
.growth-stat-card{background:#fff;border-radius:var(--radius);padding:20px;text-align:center;border:1px solid var(--c-border-light)}
.growth-stat-card .gs-icon{font-size:32px;margin-bottom:8px}
.growth-stat-card .gs-val{font-size:28px;font-weight:800;color:var(--c-text)}
.growth-stat-card .gs-lbl{font-size:12px;color:var(--c-text-light);margin-top:2px}
.challenge-card{background:#fff;border-radius:var(--radius);padding:16px;border:1px solid var(--c-border-light);display:flex;align-items:center;gap:12px;transition:all .2s}
.challenge-card.done{background:var(--c-green-light);border-color:var(--c-green)}
.challenge-card .cc-icon{font-size:28px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--c-bg);border-radius:10px}
.challenge-card.done .cc-icon{background:var(--c-green)}
.challenge-card .cc-info{flex:1}
.challenge-card .cc-title{font-size:14px;font-weight:600}
.challenge-card .cc-desc{font-size:12px;color:var(--c-text-light)}
.challenge-card .cc-reward{font-size:13px;font-weight:700;color:#FF8C00;flex-shrink:0}
.challenge-card.done .cc-reward{color:var(--c-green)}
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.achievement-badge{background:#fff;border-radius:var(--radius);padding:16px 8px;text-align:center;border:2px solid var(--c-border-light);transition:all .2s;position:relative}
.achievement-badge.unlocked{border-color:#FFD700;background:linear-gradient(180deg,#FFFDE7,#fff)}
.achievement-badge.locked{opacity:.45;filter:grayscale(.8)}
.achievement-badge .ab-icon{font-size:36px;margin-bottom:6px}
.achievement-badge .ab-name{font-size:12px;font-weight:600;color:var(--c-text)}
.achievement-badge .ab-desc{font-size:10px;color:var(--c-text-light);margin-top:2px}
.achievement-badge .ab-check{position:absolute;top:6px;right:6px;width:18px;height:18px;background:var(--c-green);border-radius:50%;display:flex;align-items:center;justify-content:center}
.achievement-badge .ab-check svg{width:12px;height:12px;color:#fff}
.points-history{max-height:300px;overflow-y:auto}
.points-history-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--c-border-light)}
.points-history-item .ph-info{font-size:13px}
.points-history-item .ph-time{font-size:11px;color:var(--c-text-light)}
.points-history-item .ph-amount{font-weight:700;font-size:15px}
.points-history-item .ph-amount.plus{color:var(--c-green)}
.points-history-item .ph-amount.minus{color:var(--c-danger)}
.reward-shop-item{background:#fff;border-radius:var(--radius);padding:16px;border:1px solid var(--c-border-light);display:flex;align-items:center;gap:12px}
.reward-shop-item .rs-icon{font-size:28px;flex-shrink:0}
.reward-shop-item .rs-info{flex:1}
.reward-shop-item .rs-name{font-size:14px;font-weight:600}
.reward-shop-item .rs-cost{font-size:12px;color:#FF8C00;font-weight:700}
.reward-shop-item .rs-btn{flex-shrink:0}
.sidebar-level-bar{padding:8px 16px;background:var(--c-bg)}
.sidebar-level-bar .slb-info{display:flex;justify-content:space-between;font-size:11px;color:var(--c-text-light);margin-bottom:4px}
.sidebar-level-bar .slb-track{height:6px;background:var(--c-border-light);border-radius:3px;overflow:hidden}
.sidebar-level-bar .slb-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FFA500);border-radius:3px;transition:width .5s}

/* ===== Responsive ===== */
@media(max-width:900px){
  .today-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr}
  .cpp-layout{grid-template-columns:1fr;height:auto}
  .cpp-sidebar{max-height:200px}
  .cpp-projects{grid-template-columns:1fr}
}
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{width:100%}
  .mobile-menu-btn{display:flex!important}
  .schedule-table{font-size:10px}
  .schedule-table th,.schedule-table td{padding:4px 2px;min-width:40px}
  .pomodoro-display{width:180px;height:180px}
  .pomodoro-time .pt-min{font-size:40px}
}
.mobile-menu-btn{display:none;width:40px;height:40px;align-items:center;justify-content:center;border-radius:var(--radius-sm)}
.mobile-menu-btn svg{width:22px;height:22px}
#sidebar-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:99}
#sidebar-overlay.show{display:block}
/* ===== Daily Training (每日训练) ===== */
.daily-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1px solid #fde68a;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.daily-banner.done{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#a7f3d0}
.daily-banner .db-left{font-size:14px;color:var(--c-text)}
.daily-banner .db-mid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--c-text-light)}
.daily-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.daily-pill.easy{background:#e8f5e9;color:#2e7d32}
.daily-pill.hard{background:#fdecea;color:#c0392b}
.daily-pill.mistake{background:#fff3e0;color:#ef6c00}
.db-progress{margin-left:4px;font-weight:600;color:var(--c-text)}
.dq-modal{max-width:560px}
.dq-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.dq-tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.dq-tag-easy{background:#e8f5e9;color:#2e7d32}
.dq-tag-hard{background:#fdecea;color:#c0392b}
.dq-tag-mistake{background:#fff3e0;color:#ef6c00}
.dq-subj{font-size:12px;color:var(--c-text-light)}
.dq-count{font-size:13px;color:var(--c-text-light);font-weight:600}
.dq-dots{display:flex;gap:6px;margin-bottom:12px}
.dq-dot{width:9px;height:9px;border-radius:50%;background:var(--c-border-light)}
.dq-dot.cur{background:var(--c-primary)}
.dq-dot.ok{background:#2e7d32}
.dq-dot.bad{background:#c0392b}
.dq-q{font-size:16px;font-weight:600;line-height:1.6;white-space:pre-wrap;margin-bottom:14px}
.dq-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.dq-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--c-border-light);border-radius:var(--radius);background:#fff;cursor:pointer;text-align:left;font-size:14px;transition:all .15s}
.dq-opt:hover{border-color:var(--c-primary)}
.dq-opt.sel{border-color:var(--c-primary);background:#eef4ff}
.dq-key{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--c-primary);color:#fff;font-size:13px;font-weight:700;flex:none}
.dq-fill{width:100%;padding:12px 14px;border:2px solid var(--c-border-light);border-radius:var(--radius);font-size:14px}
.dq-fill:focus{outline:none;border-color:var(--c-primary)}
.dq-actions{display:flex;gap:10px;justify-content:flex-end;margin-bottom:8px}
.dq-result{margin-top:8px;padding:14px;border-radius:var(--radius);background:#f8fafc;border:1px solid var(--c-border-light)}
.dq-result.ok{border-color:#a7f3d0;background:#ecfdf5}
.dq-result.bad{border-color:#fecaca;background:#fef2f2}
.dqr-line{font-weight:700;margin-bottom:6px}
.dqr-ans{font-size:13px;color:var(--c-text);margin-bottom:8px}
.dq-hint{margin-top:8px;font-size:13px;line-height:1.6;color:var(--c-text-light)}
.dqh-title{font-weight:700;color:var(--c-text);margin-bottom:4px}
.dq-result .btn{margin-top:10px;margin-right:8px}


/* ===== News & Knowledge Module ===== */
.news-daily-banner{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#E3F2FD,#F3E5F5);border:1px solid #D1C4E9;border-radius:var(--radius);padding:16px 20px;margin-bottom:16px}
.news-daily-banner .ndb-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.news-daily-banner .ndb-badge{background:#fff;color:#5e35b1;font-weight:700;font-size:12px;padding:6px 12px;border-radius:20px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.news-daily-banner .ndb-title{font-size:16px;font-weight:700;color:var(--c-text)}
.news-daily-banner .ndb-meta{font-size:12px;color:var(--c-text-light);margin-top:2px}
.news-daily-banner .ndb-tip{font-size:12px;color:#6a4ca5;margin-top:4px;line-height:1.5}
.news-toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.news-search{width:100%;padding:11px 14px;border:1px solid var(--c-border);border-radius:var(--radius-sm);font-size:14px;outline:none;background:var(--c-bg);box-sizing:border-box}
.news-search:focus{border-color:var(--c-primary)}
.news-cats{display:flex;flex-wrap:wrap;gap:8px}
.news-cat{padding:6px 14px;border:1px solid var(--c-border);background:var(--c-bg);border-radius:20px;font-size:13px;cursor:pointer;color:var(--c-text-light);transition:all .15s}
.news-cat:hover{border-color:var(--c-primary);color:var(--c-primary)}
.news-cat.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff;font-weight:600}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.news-card{background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:8px}
.news-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--c-primary)}
.news-card.featured{border-color:var(--c-accent);box-shadow:0 0 0 2px rgba(255,152,0,.15)}
.news-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.news-tag{color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}
.news-feat-flag{font-size:11px;font-weight:700;color:#ef6c00;background:#FFF3E0;padding:3px 8px;border-radius:12px}
.news-read-flag{font-size:11px;font-weight:700;color:#2e7d32;background:#E8F5E9;padding:3px 8px;border-radius:12px;margin-left:auto}
.news-card-title{font-size:15px;font-weight:700;color:var(--c-text);line-height:1.4}
.news-card-summary{font-size:13px;color:var(--c-text-light);line-height:1.6;flex:1}
.news-card-foot{font-size:12px;color:var(--c-text-light)}
.news-detail-wrap{padding:0 20px 20px}
.news-detail-cover{height:150px;margin:0 -20px 16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.news-detail-cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 22%,rgba(255,255,255,.20),transparent 46%),radial-gradient(circle at 82% 78%,rgba(255,255,255,.12),transparent 42%)}
.ndc-emoji{font-size:62px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.22))}
.ndc-cat{position:absolute;left:16px;bottom:14px;z-index:1;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.28);padding:4px 12px;border-radius:12px}
.news-detail-body{font-size:15px;line-height:2;color:var(--c-text);max-width:600px;margin:0 auto}
.news-detail-body p{margin:0 0 14px;text-align:justify}
.news-card-cover{height:96px;margin:-16px -16px 12px;border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.news-card-cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 22% 24%,rgba(255,255,255,.20),transparent 46%),radial-gradient(circle at 82% 78%,rgba(255,255,255,.12),transparent 42%)}
.ncc-emoji{font-size:42px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.22))}

.welcome-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;color:#fff;box-shadow:var(--shadow)}
.welcome-hero-left{flex:1;min-width:0}
.welcome-badge{display:inline-block;font-size:12px;font-weight:600;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:20px;margin-bottom:8px}
.welcome-title{font-size:22px;font-weight:800;margin-bottom:6px;text-shadow:0 1px 2px rgba(0,0,0,.08)}
.welcome-sub{font-size:14px;opacity:.95}
.welcome-hero-emoji{font-size:46px;flex-shrink:0;line-height:1}
@media(max-width:600px){.welcome-title{font-size:18px}.welcome-hero-emoji{font-size:38px}}

.bridge-hero{background:linear-gradient(135deg,#E3F2FD,#E8F5E9);border:1px solid #BBDEFB;border-radius:var(--radius);padding:22px;margin-bottom:16px}
.bridge-hero-badge{display:inline-block;font-size:12px;font-weight:700;color:#1565C0;background:#BBDEFB;border-radius:12px;padding:3px 12px;margin-bottom:10px}
.bridge-hero h2{font-size:22px;font-weight:800;color:var(--c-text);margin-bottom:6px}
.bridge-hero p{font-size:14px;color:var(--c-text-light);line-height:1.7;max-width:680px}
.bridge-section{margin-bottom:14px}
.bridge-list{margin:0;padding-left:20px}
.bridge-list li{font-size:14px;line-height:1.8;color:var(--c-text);margin-bottom:4px}
.bridge-note{font-size:13px;color:var(--c-text-light);background:var(--c-bg);border-radius:var(--radius-sm);padding:12px 14px;line-height:1.7}

.news-detail-meta{font-size:12px;color:var(--c-text-light);margin-bottom:12px}
@media(max-width:600px){.news-grid{grid-template-columns:1fr}}


/* ============================================================
   活泼童趣主题（覆盖层 · 不影响功能）
   ============================================================ */
:root{
  --c-primary:#5B8DEF;--c-primary-dark:#3F6FD6;--c-primary-light:#EAF1FF;
  --c-accent:#2ED8A7;--c-accent-light:#E2FBF4;
  --c-warning:#FF9F43;--c-warning-light:#FFF1E0;
  --c-danger:#FF6B6B;--c-danger-light:#FFE9E9;
  --c-purple:#9B6DFF;--c-purple-light:#F1EAFF;
  --c-pink:#FF6B9D;--c-pink-light:#FFEAF2;
  --c-yellow:#FFD166;--c-yellow-light:#FFF7E0;
  --c-bg:#FFF6FB;
  --c-card:#FFFFFF;--c-text:#3A3550;--c-text-light:#9A93AE;
  --c-border:#EFE6F5;--c-border-light:#F6F0FB;
  --radius:20px;--radius-sm:14px;
  --shadow:0 8px 24px rgba(123,97,255,.10);--shadow-lg:0 14px 38px rgba(123,97,255,.18);
  --sidebar-w:212px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Yuanti SC","Microsoft YaHei",sans-serif;
}
html,body{font-family:var(--font)}
body{
  background:
    radial-gradient(circle at 12% 16%, #FFE6F4 0, transparent 40%),
    radial-gradient(circle at 88% 10%, #E6F0FF 0, transparent 38%),
    radial-gradient(circle at 80% 90%, #E3FBF2 0, transparent 42%),
    linear-gradient(160deg,#FFF7FB 0%, #F2F7FF 100%);
  background-attachment:fixed;
}
/* ===== Sidebar：彩虹渐变 + 圆角药丸导航 ===== */
#sidebar{
  background:linear-gradient(165deg,#7C5CFF 0%, #5B8DEF 55%, #2ED8A7 120%);
  border-radius:0 26px 26px 0;
  box-shadow:6px 0 30px rgba(124,92,255,.22);
  padding:18px 12px;
}
.sidebar-logo span{letter-spacing:1px}
.nav-item{border-radius:999px;padding:11px 16px;font-weight:600}
.nav-item:hover{background:rgba(255,255,255,.16);transform:translateX(3px)}
.nav-item.active{background:#fff;color:#6C5CE7;font-weight:800;box-shadow:0 8px 18px rgba(0,0,0,.14)}
.nav-item.active svg{color:#6C5CE7}
.nav-item .badge{background:var(--c-pink);box-shadow:0 2px 8px rgba(255,107,157,.5);border-radius:999px}
.sidebar-footer{border-top:1px solid rgba(255,255,255,.18)}
.sync-status{color:rgba(255,255,255,.82)}
.sync-dot{background:#7CF0B0;box-shadow:0 0 8px rgba(124,240,176,.7)}
/* ===== Topbar：悬浮玻璃卡 ===== */
#topbar{
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:none;
  border-radius:0 0 24px 24px;
  box-shadow:0 6px 20px rgba(123,97,255,.08);
  margin:0 14px;
  height:60px;
}
.topbar-title{font-weight:800;font-size:18px;background:linear-gradient(90deg,#7C5CFF,#5B8DEF);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar-btn{background:var(--c-primary-light);color:var(--c-primary);border-radius:999px;font-weight:700;box-shadow:0 3px 10px rgba(91,141,239,.18);min-height:36px}
.topbar-btn:hover{background:var(--c-primary);color:#fff;transform:translateY(-1px)}
.level-badge{border-radius:999px;font-weight:800;padding:6px 13px;background:linear-gradient(135deg,#FFD166,#FF9F43);color:#fff;box-shadow:0 3px 10px rgba(255,159,67,.35);cursor:pointer}
.points-badge{border-radius:999px;font-weight:800;padding:6px 13px;background:linear-gradient(135deg,#7C5CFF,#5B8DEF);color:#fff;box-shadow:0 3px 10px rgba(124,92,255,.3)}
/* ===== Content ===== */
#content{padding:22px 22px 44px}
/* ===== Card：大圆角 + 柔阴影 + 悬浮 ===== */
.card{
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1.5px solid var(--c-border-light);
  padding:22px;
  background:#fff;
  transition:transform .2s ease, box-shadow .2s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-header{margin-bottom:14px}
.card-title{font-weight:800;font-size:16px;color:var(--c-text)}
.card-title svg{color:var(--c-primary)}
/* ===== Button 圆润渐变 ===== */
.btn{border-radius:999px;font-weight:700;padding:11px 22px;min-height:42px}
.btn-primary{background:linear-gradient(135deg,#5B8DEF,#7C5CFF);color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.3)}
.btn-primary:hover{background:linear-gradient(135deg,#7C5CFF,#5B8DEF);transform:translateY(-1px)}
.btn-outline{border:2px solid var(--c-border);color:var(--c-text);background:#fff}
.btn-outline:hover{border-color:var(--c-primary);color:var(--c-primary);background:var(--c-primary-light)}
.btn-sm{border-radius:999px;padding:7px 16px;min-height:34px}
/* ===== Tag / Badge 彩色圆 ===== */
.tag{border-radius:999px;font-weight:700;padding:4px 12px}
.tag-blue{background:var(--c-primary-light);color:var(--c-primary)}
.tag-gray{background:#F0ECF8;color:var(--c-purple)}
.badge{background:var(--c-pink);color:#fff;border-radius:999px}
/* ===== Welcome Hero：明快渐变 + emoji 浮动 ===== */
.welcome-hero{
  background:linear-gradient(135deg,#FF9F43 0%, #FF6B9D 50%, #9B6DFF 100%);
  border-radius:24px;
  box-shadow:0 14px 34px rgba(255,107,157,.28);
  padding:26px 28px;
}
.welcome-greet{color:#fff !important}
.welcome-title{font-size:24px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.14)}
.welcome-sub{opacity:.95;font-weight:500}
.welcome-hero-emoji{font-size:62px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18));animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome-interests .wtag{background:rgba(255,255,255,.92);color:#FF6B9D;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* ===== 兴趣 chips / seg 圆润 ===== */
.chip,.seg{border-radius:999px;font-weight:600}
.chip:has(input:checked){box-shadow:0 4px 12px rgba(91,141,239,.25)}
.seg:has(input:checked){box-shadow:0 4px 12px rgba(91,141,239,.25)}
/* ===== 题库训练 / 新闻 / 常识 卡片 ===== */
.question-card{border-radius:var(--radius);border-top:5px solid var(--c-primary);box-shadow:var(--shadow);transition:transform .2s ease, box-shadow .2s ease}
.question-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.news-card{border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .2s ease, box-shadow .2s ease}
.news-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--c-primary-light)}
/* ===== 番茄钟环色 ===== */
.pomodoro-display #pomo-ring{stroke:var(--c-primary)}
/* ===== 成长 / 统计卡片 ===== */
.growth-stat-card,.challenge-card,.stat-chart-card{border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .2s ease, box-shadow .2s ease}
.growth-stat-card:hover,.challenge-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
/* ===== 滚动条 ===== */
::-webkit-scrollbar-thumb{background:#D9CCF2;border-radius:999px}
/* ===== 弹窗更圆 ===== */
.modal-overlay{background:rgba(58,53,80,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:20px}
.modal{border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-header{border-bottom:1px solid var(--c-border-light)}
.modal-footer{border-top:1px solid var(--c-border-light)}
.modal-title{font-weight:800}
/* ===== 输入聚焦 ===== */
input:focus,textarea:focus,select:focus{border-color:var(--c-primary);box-shadow:0 0 0 3px var(--c-primary-light)}
/* ===== 做菜 / 生活实践模块 ===== */
.cooking-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#FFB36B,#FF7E9D);border-radius:var(--radius);padding:20px;color:#fff;box-shadow:var(--shadow)}
.cooking-hero-emoji{font-size:54px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.cooking-hero-text h2{margin:6px 0 4px;font-size:20px}
.cooking-hero-text p{margin:0;opacity:.92;font-size:13px}
.cooking-hero-badge{display:inline-block;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.cooking-safety{margin:12px 0;background:#FFF6E6;color:#B26A00;border:1px solid #FFE0A3;border-radius:14px;padding:10px 14px;font-size:13px}
.cooking-section-title{font-size:15px;font-weight:700;margin:18px 0 10px;color:var(--c-text)}
.cooking-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cooking-card{background:#fff;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid var(--c-border)}
.cooking-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(255,122,109,.25)}
.cooking-cover{height:84px;display:flex;align-items:center;justify-content:center;font-size:40px}
.cooking-card-body{padding:10px 12px}
.cooking-card-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.cooking-done-tag{font-size:11px;background:#E6F7EE;color:#1BA672;padding:1px 6px;border-radius:999px}
.cooking-card-meta{font-size:12px;color:var(--c-text-light);margin-top:4px}
.cooking-tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cooking-tip{display:flex;gap:10px;background:#fff;border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow);border:1px solid var(--c-border)}
.cooking-tip-emoji{font-size:22px}
.cooking-tip-title{font-weight:700;font-size:13px;margin-bottom:2px}
.cooking-tip-text{font-size:12px;color:var(--c-text-light);line-height:1.5}
.cooking-detail-hero{display:flex;align-items:center;gap:14px;color:#fff;padding:18px;border-radius:var(--radius)}
.cooking-detail-hero h3{margin:0;font-size:18px}
.cooking-detail-hero p{margin:4px 0 0;font-size:12px;opacity:.9}
.cooking-detail-block{margin-top:14px}
.cooking-detail-label{font-weight:700;font-size:14px;margin-bottom:8px}
.cooking-ing{display:flex;flex-wrap:wrap;gap:8px}
.cooking-ing-chip{background:#FFF1E6;color:#C45B1E;padding:5px 10px;border-radius:999px;font-size:12px}
.cooking-steps{margin:0;padding-left:0;list-style:none}
.cooking-steps li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--c-border);font-size:13px;line-height:1.6}
.step-num{flex:0 0 22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#FF9A5A,#FF6B6B);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cooking-detail-tip{margin-top:14px;background:#FFF6E6;color:#B26A00;border-radius:12px;padding:10px 12px;font-size:13px}
.cooking-detail .btn{margin-top:14px;width:100%}
/* ===== 首页新闻/常识快捷入口 ===== */
.home-info-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.home-info-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid var(--c-border);border-top:4px solid var(--c-primary)}
.home-info-card.hi-knowledge{border-top-color:#FFB36B}
.home-info-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.hi-icon{font-size:30px;flex:0 0 auto}
.hi-body{flex:1;min-width:0}
.hi-label{font-size:12px;font-weight:700;color:var(--c-text-light)}
.hi-title{font-size:14px;font-weight:700;color:var(--c-text);margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-meta{font-size:12px;color:var(--c-text-light)}
.hi-go{font-size:22px;color:var(--c-text-light);flex:0 0 auto}
@media(max-width:560px){.home-info-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
      <span id="gradeHeader">学习台</span>
    </div>
    <div class="nav-items">
      <button class="nav-item active" data-tab="today" onclick="switchTab('today')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        今日学习台
        <span class="badge" id="today-badge" style="display:none">0</span>
      </button>
      <button class="nav-item" data-tab="errors" onclick="switchTab('errors')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        全科错题本
        <span class="badge" id="error-badge" style="display:none">0</span>
      </button>
      <button class="nav-item" data-tab="practice" onclick="switchTab('practice')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        题库训练
        <span class="badge" id="practice-badge" style="display:none">0</span>
      </button>
      <button class="nav-item" data-tab="news" onclick="switchTab('news')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h13a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V5z"/><path d="M17 7h3v12a2 2 0 01-2 2"/><line x1="7" y1="9" x2="14" y2="9"/><line x1="7" y1="13" x2="14" y2="13"/><line x1="7" y1="17" x2="11" y2="17"/></svg>
        读新闻
      </button>
      <button class="nav-item" data-tab="knowledge" onclick="switchTab('knowledge')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0012 2z"/></svg>
        懂常识
      </button>

      <button class="nav-item" data-tab="cpp" onclick="switchTab('cpp')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        C++编程备考
      </button>
      <button class="nav-item" data-tab="cooking" onclick="switchTab('cooking')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11h16M6 11c0-4 3-7 6-7s6 3 6 7M9 21h6M9 17h6"/></svg>
        生活实践·做菜
      </button>
      <button class="nav-item" data-tab="upbridge" onclick="switchTab('upbridge')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/></svg>
        重点内容与公式
      </button>
      <button class="nav-item" data-tab="stats" onclick="switchTab('stats')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        学习统计
      </button>
      <button class="nav-item" data-tab="growth" onclick="switchTab('growth')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        成长中心
        <span class="badge" id="growth-badge" style="display:none;background:#FF8C00">0</span>
      </button>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-level-bar" id="sidebar-level-bar"></div>
      <div class="sync-status">
        <span class="sync-dot" id="sync-dot"></span>
        <span id="sync-text">已同步</span>
      </div>
    </div>
  </nav>
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title" id="topbar-title">今日学习台</span>
      </div>
      <div class="topbar-actions">
        <div class="level-badge" id="level-badge" style="cursor:pointer" onclick="switchTab('growth')">⭐ Lv.1</div>
        <div class="points-badge" id="points-badge" onclick="switchTab('growth')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          0
        </div>
        <button class="topbar-btn" onclick="exportData()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出备份
        </button>
        <button class="topbar-btn" onclick="document.getElementById('import-file').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          导入恢复
        </button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
        <span class="topbar-btn" id="childBadge" style="cursor:default">未设置孩子</span>
        <button class="topbar-btn" onclick="openChildManager()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/></svg>
          孩子
        </button>
      </div>
    </div>

    <div id="content">
      <!-- ===== TAB: Today ===== -->
      <div class="tab-page active" id="tab-today">
        <div id="welcome-banner"></div>
        <div id="home-info-shortcuts"></div>
        <div class="today-grid">
          <div class="card" id="overdue-card">
            <div class="card-header">
              <div class="card-title" style="color:var(--c-danger)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                今天要处理
              </div>
              <button class="btn btn-sm btn-primary" onclick="openTaskModal()">+ 添加任务</button>
            </div>
            <div id="overdue-list"></div>
            <div id="today-task-list" style="margin-top:12px"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                番茄钟
              </div>
              <span class="tag tag-blue" id="pomo-mode-tag">学习中</span>
            </div>
            <div class="pomodoro-card">
              <div class="pomodoro-display">
                <svg viewBox="0 0 200 200" width="200" height="200">
                  <circle cx="100" cy="100" r="90" fill="none" stroke="#E0E6ED" stroke-width="10"/>
                  <circle id="pomo-ring" cx="100" cy="100" r="90" fill="none" stroke="#4F7DF0" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.48" stroke-dashoffset="0" transform="rotate(-90 100 100)" transition="stroke-dashoffset 1s"/>
                </svg>
                <div class="pomodoro-time">
                  <div class="pt-min" id="pomo-min">25:00</div>
                  <div class="pt-label" id="pomo-label">点击开始专注</div>
                </div>
              </div>
              <div class="pomodoro-controls">
                <button class="btn btn-primary" id="pomo-start-btn" onclick="togglePomodoro()">开始专注</button>
                <button class="btn btn-outline" onclick="resetPomodoro()">重置</button>
              </div>
              <div class="pomodoro-stats">
                <div class="pomo-stat"><div class="ps-num" id="pomo-count">0</div><div class="ps-label">今日番茄</div></div>
                <div class="pomo-stat"><div class="ps-num" id="pomo-total">0</div><div class="ps-label">专注分钟</div></div>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              本周课程表（广州公立学校 · 开学后使用 · 现在可先规划）
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="tag tag-gray" id="schedule-day-label"></span>
              <button class="btn btn-sm btn-outline" onclick="openScheduleModal()">编辑</button>
            </div>
          </div>
          <div style="overflow-x:auto">
            <table class="schedule-table" id="schedule-table"></table>
          </div>
        </div>
      </div>

      <!-- ===== TAB: Errors ===== -->
      <div class="tab-page" id="tab-errors">
        <div class="error-toolbar">
          <div class="subject-filter" id="subject-filter"></div>
          <button class="btn btn-primary" onclick="openErrorModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加错题
          </button>
        </div>
        <div id="error-list" class="error-list"></div>
      </div>

      <!-- ===== TAB: Practice ===== -->
      <div class="tab-page" id="tab-practice">
        <div id="practice-content"></div>
      </div>

      <!-- ===== TAB: C++ ===== -->
      <div class="tab-page" id="tab-cpp">

function getActiveChild(){
  const raw = _lsGet(SK.activeChild);
  if(!raw) return null;
  try { const cid = JSON.parse(raw); const list = loadArr(SK.children, []); return list.find(c=>c.id===cid) || null; } catch(e){ return null; }
}
function computeGradeInfo(birthDate){
  if(!birthDate){ const ac = getActiveChild(); birthDate = ac ? ac.birthDate : '2013-09-01'; }
  const bd = new Date(birthDate + 'T00:00:00');
  const now = new Date();
  const birthYear = bd.getFullYear();
  const turnsSix = birthYear + 6;
  const startYear = (bd.getMonth() < 7 || (bd.getMonth() === 7 && bd.getDate() <= 31)) ? turnsSix : turnsSix + 1;
  const sepYear = (now.getMonth() < 8) ? now.getFullYear() - 1 : now.getFullYear();
  let grade = 1 + (sepYear - startYear);
  const summer = (now.getMonth() === 6 || now.getMonth() === 7);
  function label(g){
    if (g <= 0) return '学前';
    if (g <= 6) return '一二三四五六'.charAt(g-1) + '年级';
    if (g <= 9) return '初' + '一二三'.charAt(g-7);
    if (g <= 12) return '高' + '一二三'.charAt(g-10);
    return '已毕业';
  }
  let fromLabel, toLabel;
  if (summer){
    fromLabel = label(grade);
    toLabel = label(grade + 1);
  } else {
    fromLabel = grade > 1 ? label(grade - 1) : '';
    toLabel = label(grade);
  }
  const bridgeLabel = fromLabel ? (fromLabel + '升' + toLabel) : toLabel;
  const arrowLabel  = fromLabel ? (fromLabel + ' → ' + toLabel) : toLabel;
  const displayLabel = summer ? bridgeLabel : toLabel;
  const stage = grade <= 6 ? '小学' : grade <= 9 ? '初中' : grade <= 12 ? '高中' : '毕业';
  return { grade, fromLabel, toLabel, bridgeLabel, arrowLabel, displayLabel, stage, summer };
}
function refreshGrade(){ const ac = getActiveChild(); GRADE_INFO = ac ? computeGradeInfo(ac.birthDate) : computeGradeInfo(); applyGradeLabels(); renderChildBadge(); }

  const el = document.getElementById('childBadge');

}

// Some WebView configs block localStorage on file:// origins; fall back to memory so the app never crashes.
const _memStore = {};
const _lsAvailable = (function(){ try{ const k='__wb_probe__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
function _lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in _memStore)? _memStore[k]:null; } }
function _lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ _memStore[k]=v; } }
function _lsDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete _memStore[k]; } }
// 按孩子的数据键（tasks/errors/logs/积分/打卡/每日训练/刷题 等随孩子隔离）；其余为全局共享
const CHILD_DATA_KEYS = new Set([SK.tasks, SK.errors, SK.logs, SK.dailyTraining, SK.mistakePool, SK.points, SK.streak, SK.practice, SK.pomodoro, SK.analytics]);
function _childNs(key){
  let ac = _lsGet(SK.activeChild);
  try { ac = ac ? JSON.parse(ac) : null; } catch(e){ ac = null; }
  return (ac && CHILD_DATA_KEYS.has(key)) ? (key + ':' + ac) : key;
}
function has(key){ const v=_lsGet(_childNs(key)); return v!==null && v!==undefined; }
// 读取本地数据：带 JSON 容错 + 类型兜底。
// 历史版本曾把阅读记录初始化成对象 {}、把练习记录存成 null，
// 旧数据会让 load(x,[]) 返回 {} 从而在 .filter/.map 处整段崩溃（新闻/常识白屏的真凶）。
function load(key, def){
  const v = _lsGet(_childNs(key));
  if(v===null || v===undefined) return def;
  var p; try{ p = JSON.parse(v); }catch(e){ return def; }
  if(p===null || p===undefined) return def;
  // 期望数组却存了非数组 → 返回空数组
  if(Array.isArray(def) && !Array.isArray(p)) return [];
  // 期望普通对象却存了数组/标量 → 返回默认值
  if(def && typeof def==='object' && !Array.isArray(def) && (typeof p!=='object' || Array.isArray(p))) return def;
  return p;
}
function save(key, val){ _lsSet(_childNs(key), JSON.stringify(val)); }
// 数组专用读取（等价于 load 的数组兜底，保留以便调用点语义清晰）
function loadArr(key, def){ var v = load(key, Array.isArray(def)?def:[]); return Array.isArray(v) ? v : []; }
function remove(key){ _lsDel(_childNs(key)); }

    total:0, history:[], achievements:[], dailyChallenges:{}, lastDailyDate:'',
    rewards:[
      {id:'r1', name:'看30分钟动画片', cost:100, icon:'📺'},
      {id:'r2', name:'玩30分钟游戏', cost:150, icon:'🎮'},

    ],

  });
