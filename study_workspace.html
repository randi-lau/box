function savePointsData(data){ save(SK.points, data); }

function getLevelInfo(totalPoints){
  let level = LEVELS[0];
  let nextLevel = null;
  for(let i=0;i<LEVELS.length;i++){
    if(totalPoints >= LEVELS[i].min){
      level = LEVELS[i];
      nextLevel = LEVELS[i+1] || null;
    }
  }
  const currentMin = level.min;
  const nextMin = nextLevel ? nextLevel.min : level.min;
  const progress = nextLevel ? Math.min(100, Math.round((totalPoints - currentMin) / (nextMin - currentMin) * 100)) : 100;
  const remaining = nextLevel ? (nextMin - totalPoints) : 0;
  return { level:level.lv, name:level.name, icon:level.icon, progress, remaining, nextLevel };
}

function getStatsSnapshot(){
  const tasks = loadArr(SK.tasks, []);
  const practice = load(SK.practice, {answered:[], correctIds:[], wrongIds:[]});
  const pomo = load(SK.pomodoro, {date:todayStr(), count:0, totalMinutes:0});
  const cpp = load(SK.cpp, {progress:{}});
  const errors = loadArr(SK.errors, []);
  const streak = load(SK.streak, {});
  const logs = loadArr(SK.logs, []);
  const today = todayStr();

  const tasksDone = tasks.filter(t=>t.status==='done').length;
  const todayTasks = tasks.filter(t=>t.status==='done' && t.date===today).length;
  const practiceCorrect = (practice.correctIds||[]).length;
  const todayCorrect = logs.filter(l=>l.date===today && l.type==='practice').length;
  const pomoCount = pomo.count || 0;
  const todayPomo = pomo.date===today ? pomo.count : 0;
  const cppLessons = Object.values(cpp.progress||{}).filter(p=>p.completed).length;
  const todayCpp = Object.values(cpp.progress||{}).filter(p=>p.completed && p.completedAt && p.completedAt.slice(0,10)===today).length;
  const errorsMastered = errors.filter(e=>e.status==='mastered').length;
  const todayErrorReview = logs.filter(l=>l.date===today && l.type==='error_review').length;

  // Subjects practiced
  const subjectsPracticed = new Set();
  (practice.answered||[]).forEach(qid=>{
    SUBJECTS.forEach(subj=>{
      if((activeBank()[subj]||[]).some(q=>q.id===qid)) subjectsPracticed.add(subj);
    });
  });

  // Max streak
  const streakDates = Object.keys(streak).sort();
  let maxStreak = 0;
  let curStreak = 0;
  let prevDate = null;
  streakDates.forEach(d=>{
    if(prevDate){
      const diff = daysBetween(prevDate, d);
      if(diff===1) curStreak++;
      else curStreak = 1;
    } else {
      curStreak = 1;
    }
    if(curStreak > maxStreak) maxStreak = curStreak;
    prevDate = d;
  });

  // Perfect days: from points history
  const ptsData = getPointsData();
  const perfectDays = (ptsData.history||[]).filter(h=>h.action==='perfect_day').length;

  // Current level
  const levelInfo = getLevelInfo(ptsData.total);
  const newsReadLog = loadArr(SK.newsRead, []);
  const newsReads = newsReadLog.length;
  const todayNews = newsReadLog.filter(r=>r.date===today).length;
  const knowledgeReadLog = loadArr(SK.knowledgeRead, []);
  const knowledgeReads = knowledgeReadLog.length;
  const todayKnowledge = knowledgeReadLog.filter(r=>r.date===today).length;


  return {
    tasksDone, todayTasks, practiceCorrect, todayCorrect,
    pomoCount, todayPomo, cppLessons, todayCpp,
    errorsMastered, todayErrorReview,
    subjectsPracticed: subjectsPracticed.size,
    maxStreak, perfectDays,
    level: levelInfo.level,
    newsReads, todayNews, knowledgeReads, todayKnowledge,

    todayCorrectCount: logs.filter(l=>l.date===today && l.type==='practice').length
  };
}

function addPoints(amount, action, detail, ref){
  const data = getPointsData();
  data.total += amount;
  data.history.unshift({ id:uid(), amount, action, detail, time:new Date().toISOString(), ref: ref||null });
  if(data.history.length > 200) data.history = data.history.slice(0, 200);
  savePointsData(data);

  // Check for level up
  const prevLevel = data._prevLevel || 1;
  const newLevelInfo = getLevelInfo(data.total);
  if(newLevelInfo.level > prevLevel){
    data._prevLevel = newLevelInfo.level;
    savePointsData(data);
    showLevelUp(newLevelInfo);
  } else {
    data._prevLevel = newLevelInfo.level;
    savePointsData(data);
  }

  // Check achievements
  checkAchievements();

  // Check daily challenges
  checkDailyChallenges();

  // Show floating points animation
  showPointsFloat(amount);

  // Update topbar badge
  updatePointsBadge();
}

function showPointsFloat(amount){
  const el = document.createElement('div');
  el.className = 'points-float';
  el.textContent = (amount>0?'+':'') + amount + ' 积分';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1500);
}

function showLevelUp(levelInfo){
  const el = document.createElement('div');
  el.className = 'level-up-banner';
  el.innerHTML = `
    <div class="lu-icon">${levelInfo.icon}</div>
    <div class="lu-title">恭喜升级！</div>
    <div class="lu-sub">达到 ${levelInfo.level} 级 · ${levelInfo.name}</div>
  `;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .5s'; el.style.opacity='0'; setTimeout(()=>el.remove(),500); }, 2500);
}

function checkAchievements(){
  const data = getPointsData();
  const stats = getStatsSnapshot();
  let unlocked = [...(data.achievements||[])];
  let newOnes = [];
  ACHIEVEMENTS.forEach(a=>{
    if(!unlocked.includes(a.id) && a.check(stats)){
      unlocked.push(a.id);
      newOnes.push(a);
    }
  });
  if(newOnes.length > 0){
    data.achievements = unlocked;
    savePointsData(data);
    newOnes.forEach((a, i)=>{
      setTimeout(()=>{
        toast('🏆 解锁成就：'+a.name+'！', 'success');
      }, i * 600);
    });
  }
}

function checkDailyChallenges(){
  const data = getPointsData();
  const today = todayStr();
  // Reset daily challenges if new day
  if(data.lastDailyDate !== today){
    data.dailyChallenges = {};
    data.lastDailyDate = today;
    savePointsData(data);
  }
  const stats = getStatsSnapshot();
  let completed = {...(data.dailyChallenges||{})};
  let newCompletions = [];
  DAILY_CHALLENGES.forEach(dc=>{
    if(!completed[dc.id] && dc.check(stats)){
      completed[dc.id] = true;
      newCompletions.push(dc);
    }
  });
  if(newCompletions.length > 0){
    data.dailyChallenges = completed;
    savePointsData(data);
    newCompletions.forEach((dc, i)=>{
      setTimeout(()=>{
        toast('🎉 每日挑战完成：'+dc.name+'！+'+dc.reward+'积分', 'success');
      }, i * 600);
    });
    // Award points for daily challenges
    const totalReward = newCompletions.reduce((s,dc)=>s+dc.reward, 0);
    if(totalReward > 0){
      const d2 = getPointsData();
      d2.total += totalReward;
      d2.history.unshift({ id:uid(), amount:totalReward, action:'daily_challenge', detail:'每日挑战奖励', time:new Date().toISOString() });
      savePointsData(d2);
    }
  }
}

function checkPerfectDay(){
  const stats = getStatsSnapshot();
  if(stats.todayTasks >= 3 && stats.todayPomo >= 4 && stats.todayCorrectCount >= 10){
    const data = getPointsData();
    const today = todayStr();
    // Check if already got perfect day today
    if(data.history && data.history.some(h=>h.action==='perfect_day' && h.time.slice(0,10)===today)) return;
    data.total += 50;
    data.history.unshift({ id:uid(), amount:50, action:'perfect_day', detail:'完美一天！3任务+4番茄+10题', time:new Date().toISOString() });
    savePointsData(data);
    toast('✨ 完美一天！+50积分奖励！', 'success');
    showPointsFloat(50);
    updatePointsBadge();
  }
}

function updatePointsBadge(){
  const data = getPointsData();
  const info = getLevelInfo(data.total);
  const badge = document.getElementById('points-badge');
  if(badge){
    badge.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${data.total}`;
  }
  const lvBadge = document.getElementById('level-badge');
  if(lvBadge){
    lvBadge.innerHTML = `${info.icon} Lv.${info.level}`;
  }
  // Update sidebar level bar
  const slb = document.getElementById('sidebar-level-bar');
  if(slb){
    slb.innerHTML = `
      <div class="slb-info"><span>${info.icon} ${info.name}</span><span>${data.total}积分</span></div>
      <div class="slb-track"><div class="slb-fill" style="width:${info.progress}%"></div></div>
    `;
  }
}

function redeemReward(rewardId){
  const data = getPointsData();
  const reward = (data.rewards||[]).find(r=>r.id===rewardId);
  if(!reward) return;
  if(data.total < reward.cost){ toast('积分不足，继续努力！','warning'); return; }
  data.total -= reward.cost;
  data.redeemedRewards.unshift({ id:uid(), rewardId:reward.id, name:reward.name, cost:reward.cost, time:new Date().toISOString() });
  data.history.unshift({ id:uid(), amount:-reward.cost, action:'redeem', detail:'兑换：'+reward.name, time:new Date().toISOString() });
  savePointsData(data);
  toast('兑换成功！'+reward.name+'，请找家长兑现~','success');
  showPointsFloat(-reward.cost);
  updatePointsBadge();
  renderGrowth();
}

function saveReward(rewardId){
const name = document.getElementById('reward-name')?.value?.trim();
const cost = parseInt(document.getElementById('reward-cost')?.value);
const icon = (document.getElementById('reward-icon')?.value || '').trim() || '🎁';
if(!name || !cost || cost<1){ toast('请填写奖励名称和所需积分','error'); return; }
const data = getPointsData();
if(!data.rewards) data.rewards = [];
if(rewardId){
  const r = (data.rewards||[]).find(x=>x.id===rewardId);
  if(r){ r.name=name; r.cost=cost; r.icon=icon; }
} else {
  data.rewards.push({ id:uid(), name, cost, icon });
}
savePointsData(data);
closeModal();
toast(rewardId?'奖励已更新':'奖励已添加','success');
renderGrowth();
}

async function deleteReward(rewardId){
if(!(await confirmDialog('确定删除该奖励吗？', {danger:true}))) return;
const data = getPointsData();
data.rewards = (data.rewards||[]).filter(r=>r.id!==rewardId);
savePointsData(data);
toast('奖励已删除','success');
renderGrowth();
}

function switchTab(tab){
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelector('.nav-item[data-tab="'+tab+'"]').classList.add('active');
  const titles = {today:'今日学习台',errors:'全科错题本',practice:'题库训练',news:'读新闻',knowledge:'懂常识',cpp:'CSP-J编程备考',upbridge: activeStage() + '重点内容与公式',cooking:'生活实践 · 做菜',stats:'学习统计',growth:'成长中心'};
  document.getElementById('topbar-title').textContent = titles[tab];
  if(tab==='today') renderToday();
  if(tab==='errors') renderErrors();
  if(tab==='practice') renderPractice();
  if(tab==='news') renderNews();
  if(tab==='knowledge') renderKnowledge();
  if(tab==='cpp') renderCpp();
  if(tab==='cooking') renderCooking();
  if(tab==='upbridge') renderUpBridge();
  if(tab==='stats') renderStats();
  if(tab==='growth') renderGrowth();
  if(window.innerWidth<=768) closeSidebar();
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-overlay').classList.toggle('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('show'); }

function renderToday(){
  const tasks = loadArr(SK.tasks, []);
  const today = todayStr();
  // Capture which tasks were overdue BEFORE rolling them over to today,
  // otherwise the "逾期未完成" section can never show them.
  const overdueIds = tasks.filter(t=>t.status==='pending' && t.date < today).map(t=>t.id);
  // Roll over yesterday's incomplete tasks to today (keep them actionable)
  tasks.forEach(t=>{
    if(t.status==='pending' && t.date < today){
      t.date = today;
    }
  });
  save(SK.tasks, tasks);

  const overdueItems = tasks.filter(t=>t.status==='pending' && overdueIds.includes(t.id));
  const todayTasks = tasks.filter(t=>t.date === today);

  // Badge
  const pendingCount = tasks.filter(t=>t.status==='pending').length;
  const badge = document.getElementById('today-badge');
  if(pendingCount>0){ badge.textContent=pendingCount; badge.style.display='flex'; } else { badge.style.display='none'; }

  // Overdue list
  const ol = document.getElementById('overdue-list');
  if(overdueItems.length===0 && todayTasks.filter(t=>t.status==='pending').length===0){
    ol.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><p>今日任务已全部完成！</p></div>';
  } else {
    let html = '';
    if(overdueItems.length>0){
      html += '<div style="font-size:12px;color:var(--c-danger);font-weight:600;margin-bottom:6px">逾期未完成</div>';
      html += overdueItems.map(t=>`
        <div class="overdue-item">
          <div class="oi-info">
            <div class="oi-subject">${t.subject} · ${t.type||'作业'}</div>
            <div class="oi-content">${escHtml(t.content)}</div>
          </div>
          <button class="btn btn-sm btn-danger" onclick="completeTask('${t.id}')">完成</button>
        </div>
      `).join('');
    }
    const todayPending = todayTasks.filter(t=>t.status==='pending' && !overdueIds.includes(t.id));
    if(todayPending.length>0){
      html += '<div style="font-size:12px;color:var(--c-text-light);font-weight:600;margin:8px 0 6px">今日待办</div>';
      html += '<div class="today-task-list">';
      html += todayPending.map(t=>`
        <div class="today-task-item">
          <div class="task-check" onclick="completeTask('${t.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div class="tti-content">${escHtml(t.content)}</div>
          <div class="tti-meta">
            <span class="priority-dot ${t.priority.toLowerCase()}"></span>
            <span class="tag tag-gray" style="font-size:11px">${t.subject}</span>
          </div>
        </div>
      `).join('');
      html += '</div>';
    }
    ol.innerHTML = html;
  }

  // Today task list (completed)
  const tl = document.getElementById('today-task-list');
  const todayDone = todayTasks.filter(t=>t.status==='done');
  if(todayDone.length>0){
    tl.innerHTML = '<div style="font-size:12px;color:var(--c-text-light);font-weight:600;margin-bottom:6px">已完成</div>' + todayDone.map(t=>`
      <div class="today-task-item done">
        <div class="task-check done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="tti-content">${escHtml(t.content)}</div>
        <div class="tti-meta"><span class="tag tag-green" style="font-size:11px">${t.subject}</span></div>
      </div>
    `).join('');
  } else { tl.innerHTML = ''; }

  // Pomodoro
  renderPomodoroStats();
  renderWelcome();
  renderHomeInfoShortcuts();
  // Schedule
  renderSchedule();
}

// 家长后台可编辑的「任务完成状态」开关（可撤销，自动同步积分与学习记录）
function setTaskStatus(id, status){
  const tasks = loadArr(SK.tasks, []);
  const t = tasks.find(x=>x.id===id);
  if(!t || t.status===status) return;
  if(status==='done'){
    t.status='done';
    save(SK.tasks, tasks);
    const logs = loadArr(SK.logs, []);
    logs.push({id:uid(), date:todayStr(), subject:t.subject, duration:25, type:t.type||'study', createdAt:new Date().toISOString(), taskId:t.id});
    save(SK.logs, logs);
    updateStreak();
    addPoints(10, 'task_complete', '完成任务：'+(t.content||'').slice(0,20), 'task:'+t.id);
    toast('任务完成！+10积分 +25分钟学习记录', 'success');
    checkPerfectDay();
  } else {
    t.status='pending';
    save(SK.tasks, tasks);
    let logs = loadArr(SK.logs, []);
    logs = logs.filter(l=>l.taskId!==id);
    save(SK.logs, logs);
    const data = getPointsData();
    const hi = data.history.findIndex(h=>h.ref==='task:'+id && h.action==='task_complete');
    if(hi>=0){
      data.total -= data.history[hi].amount;
      data.history.splice(hi,1);
      data._prevLevel = getLevelInfo(data.total).level;
      savePointsData(data);
    }
    refreshStreakToday();
    updatePointsBadge();
    toast('已撤销该任务的完成状态', 'info');
  }
  renderToday();
  if(statsUnlocked) renderStatsContent();
}

function refreshStreakToday(){
  const logs = loadArr(SK.logs, []);
  const today = todayStr();
  const streak = load(SK.streak, {});
  if(logs.some(l=>l.date===today)){ streak[today]=true; }
  else { delete streak[today]; }
  save(SK.streak, streak);
}

function completeTask(id){
  setTaskStatus(id, 'done');
}

// ===== Pomodoro =====
let pomoTimer = null;
let pomoMode = 'work'; // work | break
let pomoSeconds = 0;
let pomoRunning = false;

function renderPomodoroStats(){
  const pomo = load(SK.pomodoro, {date:todayStr(), count:0, totalMinutes:0});
  if(pomo.date !== todayStr()){ pomo.date=todayStr(); pomo.count=0; pomo.totalMinutes=0; save(SK.pomodoro, pomo); }
  document.getElementById('pomo-count').textContent = pomo.count;
  document.getElementById('pomo-total').textContent = pomo.totalMinutes;
}

function togglePomodoro(){
  if(pomoRunning){
    pausePomodoro();
  } else {
    startPomodoro();
  }
}

function startPomodoro(){
  const settings = load(SK.settings, {});
  if(pomoSeconds===0){
    pomoSeconds = (pomoMode==='work' ? settings.pomodoroWork||25 : settings.pomodoroBreak||5) * 60;
  }
  pomoRunning = true;
  document.getElementById('pomo-start-btn').textContent = '暂停';
  document.getElementById('pomo-label').textContent = pomoMode==='work' ? '专注中...' : '休息中...';
  pomoTimer = setInterval(()=>{
    pomoSeconds--;
    updatePomodoroDisplay();
    if(pomoSeconds<=0){
      completePomodoroCycle();
    }
  }, 1000);
  updatePomodoroDisplay();
}

function pausePomodoro(){
  pomoRunning = false;
  clearInterval(pomoTimer);
  document.getElementById('pomo-start-btn').textContent = '继续';
  document.getElementById('pomo-label').textContent = '已暂停';
}

function resetPomodoro(){
  clearInterval(pomoTimer);
  pomoRunning = false;
  pomoMode = 'work';
  pomoSeconds = 0;
  document.getElementById('pomo-start-btn').textContent = '开始专注';
  document.getElementById('pomo-mode-tag').textContent = '学习中';
  document.getElementById('pomo-mode-tag').className = 'tag tag-blue';
  document.getElementById('pomo-label').textContent = '点击开始专注';
  updatePomodoroDisplay();
}

function completePomodoroCycle(){
  clearInterval(pomoTimer);
  pomoRunning = false;
  if(pomoMode==='work'){
    const pomo = load(SK.pomodoro, {date:todayStr(), count:0, totalMinutes:0});
    pomo.count++;
    pomo.totalMinutes += (load(SK.settings, {}).pomodoroWork||25);
    save(SK.pomodoro, pomo);
    updateStreak();
    // Award points
    addPoints(15, 'pomodoro', '完成一个番茄钟');
    toast('番茄完成！+15积分 休息5分钟', 'success');
    checkPerfectDay();
    pomoMode = 'break';
    pomoSeconds = (load(SK.settings, {}).pomodoroBreak||5) * 60;
    document.getElementById('pomo-mode-tag').textContent = '休息中';
    document.getElementById('pomo-mode-tag').className = 'tag tag-green';
    document.getElementById('pomo-start-btn').textContent = '开始休息';
  } else {
    toast('休息结束，继续专注吧！', 'info');
    pomoMode = 'work';
    pomoSeconds = 0;
    document.getElementById('pomo-mode-tag').textContent = '学习中';
    document.getElementById('pomo-mode-tag').className = 'tag tag-blue';
    document.getElementById('pomo-start-btn').textContent = '开始专注';
  }
  document.getElementById('pomo-label').textContent = pomoMode==='work' ? '点击开始专注' : '点击开始休息';
  updatePomodoroDisplay();
  renderPomodoroStats();
}

function updatePomodoroDisplay(){
  const m = Math.floor(pomoSeconds/60);
  const s = pomoSeconds%60;
  document.getElementById('pomo-min').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const settings = load(SK.settings, {});
  const total = (pomoMode==='work' ? settings.pomodoroWork||25 : settings.pomodoroBreak||5) * 60;
  const progress = pomoSeconds / total;
  const circumference = 565.48;
  document.getElementById('pomo-ring').style.strokeDashoffset = circumference * (1 - progress);
  const color = pomoMode==='work' ? '#4A90D9' : '#5BB85A';
  document.getElementById('pomo-ring').setAttribute('stroke', color);
  document.querySelector('.pt-min').style.color = color;
}

function updateStreak(){
  const streak = load(SK.streak, {});
  const today = todayStr();
  streak[today] = true;
  save(SK.streak, streak);
}

  // Error list
  let filtered = errorFilter==='all' ? errors : errors.filter(e=>e.subject===errorFilter);
  // Sort: overdue first, then by nextReviewDate
  filtered.sort((a,b)=>{
    if(a.status==='mastered' && b.status!=='mastered') return 1;
    if(a.status!=='mastered' && b.status==='mastered') return -1;
    return (a.nextReviewDate||'').localeCompare(b.nextReviewDate||'');
  });

  const el = document.getElementById('error-list');
  if(filtered.length===0){
    el.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>暂无错题记录<br>点击"添加错题"开始记录</p></div>';
    return;
  }

  el.innerHTML = filtered.map(e=>{
    const isOverdue = e.status!=='mastered' && (e.nextReviewDate||'') <= today;
    const statusTag = e.status==='mastered' ? '<span class="tag tag-green">已掌握</span>' :
      isOverdue ? '<span class="tag tag-red">需复习</span>' : '<span class="tag tag-orange">复习中</span>';
    const color = SUBJECT_COLORS[e.subject] || '#4A90D9';
    return `
      <div class="error-item status-${e.status}">
        <div class="error-item-header">
          <div style="display:flex;gap:8px;align-items:center">
            <span class="error-item-subject" style="color:${color}">${e.subject}</span>
            ${statusTag}
          </div>
          <div class="error-item-actions">
            ${e.status!=='mastered' ? `<button class="btn btn-sm btn-accent" onclick="markMastered('${e.id}')">标记掌握</button>` : ''}
            <button class="btn btn-sm btn-outline" onclick="editError('${e.id}')">编辑</button>
            <button class="btn btn-sm btn-outline" style="color:var(--c-danger)" onclick="deleteError('${e.id}')">删除</button>
          </div>
        </div>
        <div class="error-item-kp">知识点：${escHtml(e.knowledgePoint)} · 错误类型：${escHtml(e.errorType||'未分类')}</div>
        <div class="error-item-question">Q: ${escHtml(e.question)}</div>
        ${e.answer ? `<div class="error-item-answer">A: ${escHtml(e.answer)}</div>` : ''}
        <div class="error-item-footer">
          <div class="review-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1018 0 9 9 0 00-18 0z"/><polyline points="12 6 12 12 16 14"/></svg>
            已复习${e.reviewCount||0}次 · 下次复习：${e.nextReviewDate||'未安排'}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function setErrorFilter(s){ errorFilter=s; renderErrors(); }

function openErrorModal(id){
  const errors = loadArr(SK.errors, []);
  const e = id ? errors.find(x=>x.id===id) : null;
  const html = `
    <div class="modal-header">
      <div class="modal-title">${e?'编辑错题':'添加错题'}</div>
      <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">科目</label>
          <select id="err-subject">${SUBJECTS.map(s=>`<option value="${s}" ${e&&e.subject===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="form-group">
          <label class="form-label">错误类型</label>
          <select id="err-type">
            ${['概念不清','计算错误','审题失误','记忆不牢','语法错误','逻辑错误','其他'].map(t=>`<option value="${t}" ${e&&e.errorType===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">知识点</label>
        <input type="text" id="err-kp" value="${e?escAttr(e.knowledgePoint):''}" placeholder="如：一次函数图像">
      </div>
      <div class="form-group">
        <label class="form-label">错题内容</label>
        <textarea id="err-question" style="min-height:100px" placeholder="输入题目内容">${e?escHtml(e.question):''}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">正确答案/解析</label>
        <textarea id="err-answer" style="min-height:80px" placeholder="输入正确答案和解题思路">${e?escHtml(e.answer):''}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">复习状态</label>
          <select id="err-status">
            <option value="reviewing" ${!e||e.status==='reviewing'?'selected':''}>复习中</option>
            <option value="mastered" ${e&&e.status==='mastered'?'selected':''}>已掌握</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">下次复习日期</label>
          <input type="date" id="err-review-date" value="${e?e.nextReviewDate:todayStr()}">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveError('${id||''}')">保存</button>
    </div>
  `;
  showModal(html);
}

function saveError(id){
  const errors = loadArr(SK.errors, []);
  const data = {
    subject: document.getElementById('err-subject').value,
    errorType: document.getElementById('err-type').value,
    knowledgePoint: document.getElementById('err-kp').value.trim(),
    question: document.getElementById('err-question').value.trim(),
    answer: document.getElementById('err-answer').value.trim(),
    status: document.getElementById('err-status').value,
    nextReviewDate: document.getElementById('err-review-date').value
  };
  if(!data.knowledgePoint || !data.question){ toast('请填写知识点和题目内容','error'); return; }
  if(id){
    const e = errors.find(x=>x.id===id);
    if(e){ Object.assign(e, data); e.reviewCount = e.reviewCount||0; }
  } else {
    errors.push({id:uid(), ...data, reviewCount:0, createdAt:new Date().toISOString()});
  }
  save(SK.errors, errors);
  closeModal();
  if(!id){
    addPoints(3, 'add_error', '添加错题：'+data.knowledgePoint.slice(0,15));
    toast('错题已保存 +3积分','success');
  } else {
    toast('错题已保存','success');
  }
  renderErrors();
}

function editError(id){ openErrorModal(id); }

async function deleteError(id){
  if(!(await confirmDialog('确定删除这道错题吗？', {danger:true}))) return;
  const errors = loadArr(SK.errors, []).filter(e=>e.id!==id);
  save(SK.errors, errors);
  toast('已删除','success');
  renderErrors();
}

function markMastered(id){
  const errors = loadArr(SK.errors, []);
  const e = errors.find(x=>x.id===id);
  if(e){
    const wasMastered = e.status==='mastered';
    e.status='mastered';
    e.reviewCount=(e.reviewCount||0)+1;
    // Next review in 14 days
    e.nextReviewDate = formatDate(new Date(Date.now()+86400000*14));
    save(SK.errors, errors);
    if(!wasMastered){
      addPoints(10, 'error_mastered', '掌握错题：'+(e.knowledgePoint||'').slice(0,20));
      toast('已标记为掌握！+10积分 14天后提醒复习','success');
    } else {
      toast('已标记为掌握！14天后提醒复习','success');
    }
    renderErrors();
  }
}

// ===== C++ Simulator (simplified) =====
function simulateCpp(code){
  const output = [];
  const errors = [];

  // Remove comments
  code = code.replace(/\/\/[^\n]*/g, '');
  code = code.replace(/\/\*[\s\S]*?\*\//g, '');

  // Process #define macros
  const defines = {};
  const defineRegex = /^#\s*define\s+(\w+)\s+(.+)$/gm;
  let dm;
  while((dm = defineRegex.exec(code)) !== null){
    defines[dm[1]] = dm[2].trim();
  }
  Object.keys(defines).forEach(k=>{
    code = code.replace(new RegExp('\\b'+k+'\\b','g'), defines[k]);
  });

  // Remove preprocessor directives
  code = code.replace(/^#\s*[^\n]*/gm, '');

  // Normalize long long, unsigned, size_t
  code = code.replace(/\blong\s+long\b/g, 'longlong');
  code = code.replace(/\bunsigned\s+int\b/g, 'uint');
  code = code.replace(/\bunsigned\b/g, 'uint');
  code = code.replace(/\bsize_t\b/g, 'int');
  code = code.replace(/\blonglong\b/g, 'long');

  // Extract main function body
  const mainMatch = code.match(/int\s+main\s*\(\s*\)\s*\{([\s\S]*)\}/);
  if(!mainMatch){
    // Try with int main() with args
    const mainMatch2 = code.match(/int\s+main\s*\([^)]*\)\s*\{([\s\S]*)\}/);
    if(!mainMatch2){
      errors.push('错误：找不到 main 函数');
      return {output:'', errors};
    }
    var body = mainMatch2[1];
  } else {
    var body = mainMatch[1];
  }

  // Remove "return 0;" or "return X;"
  body = body.replace(/return\s+[^;]*;/g, '');

  const vars = {};
  const arrays = {};

  function evalExpr(expr){
    expr = expr.trim();
    // String literal
    const strMatch = expr.match(/^"([^"]*)"$/);
    if(strMatch) return strMatch[1];
    // Char literal
    const charMatch = expr.match(/^'([^'])'$/);
    if(charMatch) return charMatch[1];
    // Number
    if(/^[-+]?\d+$/.test(expr)) return parseInt(expr);
    if(/^[-+]?\d*\.\d+$/.test(expr)) return parseFloat(expr);
    // Boolean
    if(expr==='true') return true;
    if(expr==='false') return false;

    // Variable reference
    if(expr in vars) return vars[expr];

    // String method: s.length()
    const strMethodMatch = expr.match(/^(\w+)\.length\(\)$/);
    if(strMethodMatch && typeof vars[strMethodMatch[1]] === 'string'){
      return vars[strMethodMatch[1]].length;
    }

    // Built-in functions
    const builtinMatch = expr.match(/^(\w+)\(([^)]*)\)$/);
    if(builtinMatch){
      const fn = builtinMatch[1];
      const args = builtinMatch[2].split(',').map(a=>evalExpr(a.trim()));
      if(fn==='abs') return Math.abs(args[0]);
      if(fn==='min') return Math.min(args[0], args[1]);
      if(fn==='max') return Math.max(args[0], args[1]);
      if(fn==='sqrt') return Math.sqrt(args[0]);
      if(fn==='pow') return Math.pow(args[0], args[1]);
      if(fn==='ceil') return Math.ceil(args[0]);
      if(fn==='floor') return Math.floor(args[0]);
      if(fn==='gcd') { let a=args[0],b=args[1]; while(b){let t=a%b;a=b;b=t;} return Math.abs(a); }
      if(fn==='tolower') return String(args[0]).toLowerCase();
      if(fn==='toupper') return String(args[0]).toUpperCase();
    }

    // Array access: arr[idx]
    const arrMatch = expr.match(/^(\w+)\[(.+)\]$/);
    if(arrMatch && arrays[arrMatch[1]]){
      const idx = evalExpr(arrMatch[2]);
      return arrays[arrMatch[1]][idx];
    }

    // Ternary
    const ternMatch = expr.match(/^(.+?)\s*\?\s*(.+?)\s*:\s*(.+)$/);
    if(ternMatch){
      return evalExpr(ternMatch[1]) ? evalExpr(ternMatch[2]) : evalExpr(ternMatch[3]);
    }

    // --- Comparison & logical expression evaluator ---
    // Substitute known variables / array elements into a copy of the expression.
    function substVars(e){
      let s = e;
      // Resolve array element accesses arr[idx] first (idx may be a simple expression).
      // Must run before variable substitution, because arrays also register a scalar var.
      let guard = 0;
      let changed = true;
      while(changed && guard++ < 25){
        changed = false;
        s = s.replace(/(\w+)\[([^\]]+)\]/g, (mm, name, idxExpr)=>{
          if(!arrays[name]) return mm;
          const idx = evalArith(idxExpr.trim());
          if(typeof idx !== 'number' || isNaN(idx) || idx < 0 || idx >= arrays[name].length) return mm;
          changed = true;
          const v = arrays[name][idx];
          if(v === undefined || v === null) return '0';
          return typeof v==='string' ? ('"'+String(v).replace(/"/g,'\\"')+'"') : v;
        });
      }
      Object.keys(vars).forEach(k=>{
        const val = vars[k];
        const rep = typeof val==='string' ? ('"'+val.replace(/"/g,'\\"')+'"')
                    : typeof val==='boolean' ? (val?'true':'false')
                    : val;
        s = s.replace(new RegExp('\\b'+k+'\\b','g'), rep);
      });
      return s;
    }
    // Truthiness mirror of C++ (non-zero number / non-empty non-"false" string).
    function toTruthy(v){
      if(typeof v==='string') return v.length>0 && v!=='0' && v.toLowerCase()!=='false';
      if(typeof v==='boolean') return v;
      return !!v;
    }
    // Evaluate a pure arithmetic (or string concat) sub-expression, with common
    // C++ builtins injected so they also work inside comparisons.
    function evalArith(e){
      e = e.trim();
      const s = substVars(e);
      try{
        if(/^[-+*/%.\s\d()"'\w,]+$/.test(s)){
          const r = eval('(function(min,max,abs,sqrt,pow,ceil,floor,gcd,tolower,toupper){return ('+s+');})(Math.min,Math.max,Math.abs,Math.sqrt,Math.pow,Math.ceil,Math.floor,function(a,b){while(b){let t=a%b;a=b;b=t;}return Math.abs(a);},function(x){return String(x).toLowerCase();},function(x){return String(x).toUpperCase();})');
          if(typeof r==='number' && !isNaN(r)) return r;
          if(typeof r==='boolean') return r;
          if(typeof r==='string') return r;
        }
      }catch(_){}
      return undefined;
    }
    // Recursive evaluator: logical OR/AND/negation, then comparison, then arithmetic.
    function evalCmp(e){
      e = e.trim();
      if(e==='') return true;
      if(e.indexOf('||') !== -1){
        return e.split('||').some(x=>toTruthy(evalCmp(x)));
      }
      if(e.indexOf('&&') !== -1){
        return e.split('&&').every(x=>toTruthy(evalCmp(x)));
      }
      if(e[0]==='!' && e.slice(0,2)!=='!='){
        return !toTruthy(evalCmp(e.slice(1).trim()));
      }
      const ops = ['<=','>=','==','!=','<','>'];
      for(const op of ops){
        const idx = e.indexOf(op);
        if(idx > 0){
          const l = evalArith(e.slice(0, idx));
          const r = evalArith(e.slice(idx+op.length));
          if(op==='<=') return l<=r;
          if(op==='>=') return l>=r;
          if(op==='==') return l==r;
          if(op==='!=') return l!=r;
          if(op==='<')  return l<r;
          if(op==='>')  return l>r;
        }
      }
      const a = evalArith(e);
      if(a !== undefined) return a;
      // Unknown identifier: return raw string (truthy) rather than looping forever.
      return e;
    }
    return evalCmp(expr);
  }

  function processCout(line){
    // Match cout << expr << expr << ... << endl;
    const parts = line.match(/cout\s*(<<)/);
    if(!parts) return;

    let rest = line.replace(/^.*?cout\s*/,'');
    let result = '';
    let isFirst = true;

    while(rest.trim().startsWith('<<')){
      rest = rest.trim().slice(2).trim();
      let exprEnd = 0;
      let inString = false;
      let depth = 0;

      for(let i=0;i<rest.length;i++){
        if(rest[i]==='"' && rest[i-1]!=='\\') inString=!inString;
        if(rest[i]==="'" && rest[i-1]!=='\\') inString=!inString;
        if(!inString){
          if(rest[i]==='(') depth++;
          if(rest[i]===')') depth--;
          if(rest[i]==='<' && rest[i+1]==='<' && depth===0) break;
          if(rest[i]===';') break;
        }
        exprEnd = i+1;
      }
      let expr = rest.slice(0, exprEnd).trim();

      if(expr==='endl' || expr==='\\n'){
        result += '\n';
      } else if(expr===''){
        // skip
      } else {
        const val = evalExpr(expr);
        result += String(val);
      }
      rest = rest.slice(exprEnd);
    }

    output.push(result);
  }

  function processCin(line){
    // cin >> var;
    const match = line.match(/cin\s*>>\s*(\w+)/);
    if(match){
      const varName = match[1];
      // Simulate input with default values
      if(!(varName in vars)){
        vars[varName] = 0;
      }
      // Try to prompt - but since we can't do real input, use a default
      vars[varName] = prompt('请输入 '+varName+' 的值：') || '0';
      // Try to convert to number
      if(!isNaN(Number(vars[varName]))) vars[varName] = Number(vars[varName]);
    }
  }

  function processDeclaration(line){
    // int x = 5; or double y = 3.14; or string s = "hello";
    const match = line.match(/^(int|double|float|long|string|char|bool|uint)\s+(\w+)\s*=\s*([^,;]+?);$/);
    if(match){
      const type = match[1];
      const name = match[2];
      const val = evalExpr(match[3]);
      if(type==='int'||type==='uint') vars[name] = parseInt(val)||0;
      else if(type==='double'||type==='float'||type==='long') vars[name] = parseFloat(val)||0;
      else if(type==='bool') vars[name] = !!val;
      else vars[name] = val;
      return true;
    }
    // Multiple declarations WITH initializers: int a=2, b=3;
    const multiInitMatch = line.match(/^(int|double|float|long|string|char|bool|uint)\s+([^;]+);$/);
    if(multiInitMatch && multiInitMatch[2].includes('=') && !multiInitMatch[2].includes('{')){
      const type = multiInitMatch[1];
      multiInitMatch[2].split(',').forEach(n=>{
        n=n.trim();
        const eq = n.match(/^(\w+)\s*=\s*(.+)$/);
        if(eq){
          const val = evalExpr(eq[2]);
          if(type==='int'||type==='uint') vars[eq[1]] = parseInt(val)||0;
          else if(type==='double'||type==='float'||type==='long') vars[eq[1]] = parseFloat(val)||0;
          else if(type==='bool') vars[eq[1]] = !!val;
          else vars[eq[1]] = val;
        } else if(n.includes('[')){
          const arrMatch = n.match(/(\w+)\[(\d+)\]/);
          if(arrMatch){ arrays[arrMatch[1]] = new Array(parseInt(arrMatch[2])).fill(0); vars[arrMatch[1]] = 0; }
        } else {
          vars[n] = type==='int'||type==='uint'?0:type==='double'?0.0:type==='long'?0:type==='string'?'':type==='bool'?false:0;
        }
      });
      return true;
    }
    // Multiple declarations WITHOUT initializers: int a, b;
    const multiMatch = line.match(/^(int|double|float|long|string|char|bool|uint)\s+([^;]+);$/);
    if(multiMatch && !multiMatch[2].includes('=')){
      const type = multiMatch[1];
      multiMatch[2].split(',').forEach(n=>{
        n=n.trim();
        if(n.includes('[')){
          const arrMatch = n.match(/(\w+)\[(\d+)\]/);
          if(arrMatch){
            arrays[arrMatch[1]] = new Array(parseInt(arrMatch[2])).fill(0);
            vars[arrMatch[1]] = 0;
          }
        } else {
          vars[n] = type==='int'||type==='uint'?0:type==='double'?0.0:type==='long'?0:type==='string'?'':type==='bool'?false:0;
        }
      });
      return true;
    }
    // Array with init: int arr[5] = {1,2,3,4,5};
    const arrInitMatch = line.match(/^(int|double|float)\s+(\w+)\s*\[\s*\d*\s*\]\s*=\s*\{([^}]*)\};$/);
    if(arrInitMatch){
      const name = arrInitMatch[2];
      const vals = arrInitMatch[3].split(',').map(v=>{
        v=v.trim();
        return arrInitMatch[1]==='int'?parseInt(v)||0:parseFloat(v)||0;
      });
      arrays[name] = vals;
      return true;
    }
    return false;
  }

  function processAssignment(line){
    // x = expr; or x += expr; or x++; or x--;
    const assignMatch = line.match(/^(\w+)\s*=\s*(.+?);$/);
    if(assignMatch){
      vars[assignMatch[1]] = evalExpr(assignMatch[2]);
      return true;
    }
    const plusEq = line.match(/^(\w+)\s*\+=\s*(.+?);$/);
    if(plusEq){
      vars[plusEq[1]] = (vars[plusEq[1]]||0) + evalExpr(plusEq[2]);
      return true;
    }
    const minusEq = line.match(/^(\w+)\s*-=\s*(.+?);$/);
    if(minusEq){
      vars[minusEq[1]] = (vars[minusEq[1]]||0) - evalExpr(minusEq[2]);
      return true;
    }
    const multEq = line.match(/^(\w+)\s*\*=\s*(.+?);$/);
    if(multEq){
      vars[multEq[1]] = (vars[multEq[1]]||0) * evalExpr(multEq[2]);
      return true;
    }
    const incMatch = line.match(/^(\w+)\+\+;$/);
    if(incMatch){
      vars[incMatch[1]] = (vars[incMatch[1]]||0) + 1;
      return true;
    }
    const decMatch = line.match(/^(\w+)--;$/);
    if(decMatch){
      vars[decMatch[1]] = (vars[decMatch[1]]||0) - 1;
      return true;
    }
    // Array element assignment: arr[i] = val;
    const arrAssign = line.match(/^(\w+)\[(.+)\]\s*=\s*(.+?);$/);
    if(arrAssign && arrays[arrAssign[1]]){
      const idx = evalExpr(arrAssign[2]);
      arrays[arrAssign[1]][idx] = evalExpr(arrAssign[3]);
      return true;
    }
    return false;
  }

  function processFunctionDef(line, allCode){
    // returnType funcName(params) { ... }
    const match = line.match(/^(int|double|float|bool|void|string|char)\s+(\w+)\s*\(([^)]*)\)\s*\{/);
    return match;
  }

  // Extract function definitions
  const functions = {};
  const funcRegex = /(?:int|double|float|bool|void|string|char|long|uint)\s+(\w+)\s*\(([^)]*)\)\s*\{/g;
  let funcMatch;
  while((funcMatch = funcRegex.exec(code)) !== null){
    const funcName = funcMatch[1];
    const params = funcMatch[2];
    if(funcName === 'main') continue;
    // Find matching closing brace
    const startIdx = funcMatch.index + funcMatch[0].length;
    let depth = 1;
    let endIdx = startIdx;
    for(let i=startIdx;i<code.length && depth>0;i++){
      if(code[i]==='{') depth++;
      if(code[i]==='}') depth--;
      endIdx = i;
    }
    const funcBody = code.slice(startIdx, endIdx);
    const paramList = params.split(',').map(p=>p.trim()).filter(p=>p).map(p=>{
      const pm = p.match(/(\w+)\s+(\w+)/);
      return pm?{type:pm[1],name:pm[2]}:{type:'int',name:p};
    });
    functions[funcName] = {params:paramList, body:funcBody};
  }

  function callFunction(name, args){
    if(!functions[name]) return null;
    const fn = functions[name];
    const savedVars = {...vars};
    fn.params.forEach((p,i)=>{
      vars[p.name] = args[i];
    });
    let retVal = null;
    const lines = fn.body.split('\n').map(l=>l.trim()).filter(l=>l);
    for(const line of lines){
      if(line.startsWith('return ')){
        retVal = evalExpr(line.replace(/return\s+/,'').replace(/;/,''));
        break;
      }
      processStatement(line);
    }
    Object.assign(vars, savedVars);
    return retVal;
  }

  const flowControl = {break:false, continue:false};

  function processStatement(line){
    line = line.trim();
    if(!line || line.startsWith('//')) return;
    if(line==='break;'){ flowControl.break=true; return; }
    if(line==='continue;'){ flowControl.continue=true; return; }
    if(line.startsWith('cout')) { processCout(line); return; }
    if(line.startsWith('cin')) { processCin(line); return; }
    if(processDeclaration(line)) return;
    if(processAssignment(line)) return;
    // swap(a, b)
    const swapMatch = line.match(/^swap\s*\(\s*(\w+)\s*,\s*(\w+)\s*\);$/);
    if(swapMatch){
      const tmp = vars[swapMatch[1]];
      vars[swapMatch[1]] = vars[swapMatch[2]];
      vars[swapMatch[2]] = tmp;
      return;
    }
    // sort(arr, arr+n) or sort(arr, arr+n, greater<int>())
    const sortMatch = line.match(/^sort\s*\(\s*(\w+)\s*,\s*\w+\s*\+\s*(\w+)\s*[,)]/);
    if(sortMatch && arrays[sortMatch[1]]){
      let n = evalExpr(sortMatch[2]);
      let arr = arrays[sortMatch[1]].slice(0, n);
      if(line.includes('greater')){
        arr.sort((a,b)=>b-a);
      } else {
        arr.sort((a,b)=>a-b);
      }
      for(let i=0;i<n;i++) arrays[sortMatch[1]][i] = arr[i];
      return;
    }
    // memset(arr, 0, sizeof)
    const memsetMatch = line.match(/^memset\s*\(\s*(\w+)\s*,\s*(\d+)\s*,/);
    if(memsetMatch && arrays[memsetMatch[1]]){
      arrays[memsetMatch[1]].fill(parseInt(memsetMatch[2]));
      return;
    }
    if(memsetMatch && vars[memsetMatch[1]]!==undefined){
      vars[memsetMatch[1]] = parseInt(memsetMatch[2]);
      return;
    }
    // fill(arr, arr+n, val)
    const fillMatch = line.match(/^fill\s*\(\s*(\w+)\s*,\s*\w+\s*\+\s*(\w+)\s*,\s*(.+)\);$/);
    if(fillMatch && arrays[fillMatch[1]]){
      let n = evalExpr(fillMatch[2]);
      let val = evalExpr(fillMatch[3]);
      for(let i=0;i<n;i++) arrays[fillMatch[1]][i] = val;
      return;
    }
    // Function call as statement (ignore return)
    const callMatch = line.match(/^(\w+)\(([^)]*)\);$/);
    if(callMatch && functions[callMatch[1]]){
      const args = callMatch[2].split(',').map(a=>evalExpr(a.trim()));
      callFunction(callMatch[1], args);
      return;
    }
  }

  function processBlock(body){
    // Split into lines, handle nested blocks
    const tokens = tokenize(body);
    let i = 0;
    while(i < tokens.length){
      const tok = tokens[i];
      if(flowControl.break || flowControl.continue) break;
      if(tok.type === 'line'){
        processStatement(tok.content);
        if(flowControl.break || flowControl.continue) break;
        i++;
      } else if(tok.type === 'for'){
        i = processFor(tokens, i);
      } else if(tok.type === 'while'){
        i = processWhile(tokens, i);
      } else if(tok.type === 'if'){
        i = processIf(tokens, i);
      } else {
        i++;
      }
    }
  }

  function tokenize(body){
    const tokens = [];
    let pos = 0;
    while(pos < body.length){
      // Skip whitespace
      while(pos < body.length && /\s/.test(body[pos])) pos++;
      if(pos >= body.length) break;

      // Check for block keywords
      const rest = body.slice(pos);
      const forMatch = rest.match(/^for\s*\(/);
      const whileMatch = rest.match(/^while\s*\(/);
      const ifMatch = rest.match(/^if\s*\(/);
      const elseMatch = rest.match(/^else\s*\{/);
      const elseIfMatch = rest.match(/^else\s+if\s*\(/);

      if(forMatch || whileMatch || ifMatch || elseMatch || elseIfMatch){
        const type = forMatch?'for':whileMatch?'while':elseIfMatch?'elseif':elseMatch?'else':ifMatch?'if':'line';
        if(type==='elseif' || type==='if' || type==='for' || type==='while'){
          // Extract condition
          let depth = 0;
          let condStart = rest.indexOf('(');
          let condEnd = condStart;
          for(let j=condStart;j<rest.length;j++){
            if(rest[j]==='(') depth++;
            if(rest[j]===')') depth--;
            if(depth===0){ condEnd=j; break; }
          }
          const condition = rest.slice(condStart+1, condEnd);
          // Find body
          let bodyStart = condEnd+1;
          while(bodyStart<rest.length && /\s/.test(rest[bodyStart])) bodyStart++;
          if(rest[bodyStart]==='{'){
            let bdepth=1;
            let bodyEnd=bodyStart+1;
            for(;bodyEnd<rest.length && bdepth>0;bodyEnd++){
              if(rest[bodyEnd]==='{') bdepth++;
              if(rest[bodyEnd]==='}') bdepth--;
            }
            const blockBody = rest.slice(bodyStart+1, bodyEnd-1);
            tokens.push({type, condition, body:blockBody});
            pos += bodyEnd;
          } else {
            // Single statement
            const semiEnd = rest.indexOf(';', bodyStart);
            const stmt = rest.slice(bodyStart, semiEnd+1);
            tokens.push({type, condition, body:stmt});
            pos += semiEnd+1;
          }
        } else if(type==='else'){
          let bodyStart = rest.indexOf('{');
          let bdepth=1;
          let bodyEnd=bodyStart+1;
          for(;bodyEnd<rest.length && bdepth>0;bodyEnd++){
            if(rest[bodyEnd]==='{') bdepth++;
            if(rest[bodyEnd]==='}') bdepth--;
          }
          tokens.push({type:'else', body:rest.slice(bodyStart+1, bodyEnd-1)});
          pos += bodyEnd;
        }
      } else {
        // Regular statement
        const semiEnd = rest.indexOf(';');
        if(semiEnd === -1) break;
        tokens.push({type:'line', content:rest.slice(0, semiEnd+1)});
        pos += semiEnd+1;
      }
    }
    return tokens;
  }

  function processFor(tokens, idx){
    const tok = tokens[idx];
    // Parse: int i = 0; i < n; i++
    const condParts = tok.condition.split(';').map(s=>s.trim());
    if(condParts.length >= 3){
      // Init
      if(condParts[0]) processDeclaration(condParts[0]+';') || processAssignment(condParts[0]+';');
      // Loop
      let maxIter = 100000;
      while(maxIter-- > 0){
        const condVal = evalExpr(condParts[1]);
        if(!condVal) break;
        flowControl.break = false;
        flowControl.continue = false;
        processBlock(tok.body);
        if(flowControl.break){
          flowControl.break = false;
          break;
        }
        // continue or normal: do update
        if(condParts[2]) processAssignment(condParts[2]+';');
      }
    }
    return idx+1;
  }

  function processWhile(tokens, idx){
    const tok = tokens[idx];
    let maxIter = 100000;
    while(maxIter-- > 0){
      const condVal = evalExpr(tok.condition);
      if(!condVal) break;
      flowControl.break = false;
      flowControl.continue = false;
      processBlock(tok.body);
      if(flowControl.break){
        flowControl.break = false;
        break;
      }
    }
    return idx+1;
  }

  function processIf(tokens, idx){
    const tok = tokens[idx];
    const condVal = evalExpr(tok.condition);
    if(condVal){
      processBlock(tok.body);
    } else {
      // Check for else / else if
      let nextIdx = idx+1;
      while(nextIdx < tokens.length){
        const next = tokens[nextIdx];
        if(next.type === 'elseif'){
          const elseCond = evalExpr(next.condition);
          if(elseCond){
            processBlock(next.body);
            break;
          }
          nextIdx++;
        } else if(next.type === 'else'){
          processBlock(next.body);
          break;
        } else {
          break;
        }
      }
    }
    // Skip past all else/elseif chains
    let skipIdx = idx+1;
    while(skipIdx < tokens.length && (tokens[skipIdx].type==='elseif' || tokens[skipIdx].type==='else')){
      skipIdx++;
    }
    return skipIdx;
  }

  // Execute main body
  processBlock(body);

  return {output: output.join(''), errors};
}

// ===== C++ Syntax Highlighting =====
function highlightCpp(code){
  const keywords = ['int','double','float','string','char','bool','void','long','for','while','if','else','return','break','continue','true','false','using','namespace','struct','class','const','include','longlong','uint','typedef','sizeof','unsigned','auto','queue','vector','pair','map','set','stack','priority_queue','sort','swap','abs','min','max','memset','fill','gcd','define'];
  let result = escHtml(code);
  // Highlight strings
  result = result.replace(/(&quot;[^&]*?&quot;)/g, '<span class="str">$1</span>');
  result = result.replace(/(&#39;[^&]*?&#39;)/g, '<span class="str">$1</span>');
  // Highlight comments
  result = result.replace(/(\/\/[^\n]*)/g, '<span class="com">$1</span>');
  // Highlight keywords
  keywords.forEach(kw=>{
    result = result.replace(new RegExp('\\b('+kw+')\\b','g'), '<span class="kw">$1</span>');
  });
  // Highlight numbers
  result = result.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  // Highlight function names
  result = result.replace(/(\w+)(\s*\()/g, '<span class="fn">$1</span>$2');
  return result;
}

function pinNext(curr, nextId){
  if(curr.value.length===1){
    const next = document.getElementById(nextId);
    if(next) next.focus();
  }
}

function checkPin(){
  const pin = ['pin-1','pin-2','pin-3','pin-4'].map(id=>document.getElementById(id).value).join('');
  if(pin.length<4) return;
  const settings = load(SK.settings, {});
  if(!settings.parentPin){
    // First time - set password
    settings.parentPin = pin;
    save(SK.settings, settings);
    toast('密码已设置','success');
    statsUnlocked = true;
    renderStats();
  } else if(settings.parentPin === pin){
    statsUnlocked = true;
    renderStats();
    toast('已解锁','success');
  } else {
    toast('密码错误','error');
    ['pin-1','pin-2','pin-3','pin-4'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('pin-1').focus();
  }
}

    if(subjectTime[l.subject]!==undefined) subjectTime[l.subject] += l.duration;

  // Error stats
  const errorStats = {total:errors.length, mastered:errors.filter(e=>e.status==='mastered').length, reviewing:errors.filter(e=>e.status==='reviewing').length};

          错题掌握进度

        ${renderErrorProgress(errorStats, errorBySubject)}
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-chart-card">
        <div class="stat-chart-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          学习打卡热力图（近28天）
        </div>
        ${renderHeatmap(heatmapData)}
      </div>
      <div class="stat-chart-card">
        <div class="stat-chart-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          今日学习概览

      <div class="card-header">

function parentTaskEditorHtml(){
  const today = todayStr();
  const tasks = loadArr(SK.tasks, []);
  const list = tasks.filter(t=> t.date <= today).slice().sort((a,b)=> (a.status==='done')-(b.status==='done'));
  const pendingN = list.filter(t=>t.status!=='done').length;
  let rows;
  if(list.length===0){
    rows = '<div class="empty-state"><p>今日暂无待办任务</p></div>';
  } else {
    rows = '<div style="display:flex;flex-direction:column;gap:8px">' + list.map(t=>{
      const done = t.status==='done';
      const overdue = t.date < today;
      const statusTag = done
        ? '<span class="tag tag-green" style="font-size:11px">已完成</span>'
        : (overdue ? '<span class="tag tag-red" style="font-size:11px">'+escHtml(t.date)+' 到期</span>' : '<span style="font-size:11px;color:var(--c-text-light)">今天到期</span>');
      return '<div class="parent-task-row">'
        + '<div class="ptr-main">'
        + '<div class="ptr-content">'+escHtml(t.content)+'</div>'
        + '<div class="ptr-meta"><span class="tag tag-gray" style="font-size:11px">'+escHtml(t.subject)+'</span>'+statusTag+'</div>'
        + '</div>'
        + '<button class="btn btn-sm '+(done?'btn-outline':'btn-primary')+'" onclick="setTaskStatus(\''+t.id+'\',\''+(done?'pending':'done')+'\')">'+(done?'↩ 标为未完成':'✓ 标记完成')+'</button>'
        + '</div>';
    }).join('') + '</div>';
  }
  return '<div class="card" style="margin-bottom:20px">'
    + '<div class="card-header"><div class="card-title">📝 待办任务完成状态（家长可编辑）</div><span class="tag tag-orange">'+pendingN+' 项未完成</span></div>'
    + '<div style="font-size:12px;color:var(--c-text-light);margin-bottom:10px">小朋友可能误点「完成」，家长可在此更正每项的「已完成 / 未完成」；撤销完成会自动扣回对应积分与学习记录。</div>'
    + rows
    + '</div>';
}

function renderBarChart(data){
  const entries = Object.entries(data).filter(([k,v])=>v>0);
  if(entries.length===0) return '<div class="empty-state"><p>暂无学习记录<br>开始学习后这里会显示统计图表</p></div>';
  const maxVal = Math.max(...entries.map(e=>e[1]));
  const barHeight = 24;
  const chartHeight = entries.length * (barHeight+8);
  const labelWidth = 60;
  const barMaxWidth = 260;
  let html = '<svg viewBox="0 0 360 '+chartHeight+'" width="100%" style="max-width:360px">';
  entries.forEach(([subj, val], i)=>{
    const y = i*(barHeight+8);
    const w = (val/maxVal)*barMaxWidth;
    const color = SUBJECT_COLORS[subj] || '#4A90D9';
    html += `<text x="0" y="${y+barHeight-6}" font-size="13" fill="#2C3E50" font-weight="600">${subj}</text>`;
    html += `<rect x="${labelWidth}" y="${y}" width="${w}" height="${barHeight}" rx="4" fill="${color}"/>`;
    html += `<text x="${labelWidth+w+8}" y="${y+barHeight-6}" font-size="12" fill="#7A8B9C">${val}分</text>`;
  });
  html += '</svg>';
  return html;
}

function renderErrorProgress(stats, bySubject){
  const total = stats.total || 1;
  const masteredPct = Math.round(stats.mastered/total*100);
  const reviewingPct = Math.round(stats.reviewing/total*100);
  const circumference = 2*Math.PI*60;

  let html = '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">';
  html += '<svg viewBox="0 0 160 160" width="140" height="140" style="flex-shrink:0">';
  html += '<circle cx="80" cy="80" r="60" fill="none" stroke="#E0E6ED" stroke-width="16"/>';
  html += `<circle cx="80" cy="80" r="60" fill="none" stroke="#5BB85A" stroke-width="16" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-masteredPct/100)}" transform="rotate(-90 80 80)"/>`;
  html += `<text x="80" y="75" text-anchor="middle" font-size="28" font-weight="700" fill="#2C3E50">${masteredPct}%</text>`;
  html += `<text x="80" y="95" text-anchor="middle" font-size="11" fill="#7A8B9C">已掌握</text>`;
  html += '</svg>';
  html += '<div style="flex:1;min-width:140px">';
  html += `<div style="display:flex;gap:8px;margin-bottom:8px"><span class="tag tag-green">${stats.mastered} 已掌握</span><span class="tag tag-orange">${stats.reviewing} 复习中</span><span class="tag tag-gray">${stats.total} 总计</span></div>`;
  html += '<div style="font-size:13px;color:var(--c-text-light);margin-top:8px">各科掌握率：</div>';
  Object.entries(bySubject).filter(([k,v])=>v.total>0).forEach(([subj, s])=>{
    const pct = Math.round(s.mastered/s.total*100);
    const color = SUBJECT_COLORS[subj];
    html += `<div style="display:flex;align-items:center;gap:6px;margin-top:4px"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block"></span><span style="font-size:13px;flex:1">${subj}</span><span style="font-size:13px;color:var(--c-text-light)">${s.mastered}/${s.total} (${pct}%)</span></div>`;
  });
  html += '</div></div>';
  return html;
}

function renderHeatmap(data){
  let html = '<div class="heatmap-grid">';
  data.forEach(d=>{
    const m = d.minutes;
    let cls = '';
    if(m===0) cls='';
    else if(m<30) cls='l1';
    else if(m<60) cls='l2';
    else if(m<90) cls='l3';
    else cls='l4';
    html += `<div class="heatmap-cell ${cls}" title="${d.date}: ${m}分钟" style="${d.isToday?'box-shadow:0 0 0 2px var(--c-primary)':''}"></div>`;
  });
  html += '</div>';
  html += '<div class="heatmap-legend">少 <div class="heatmap-cell" style="width:12px;height:12px;display:inline-block"></div><div class="heatmap-cell l1" style="width:12px;height:12px;display:inline-block"></div><div class="heatmap-cell l2" style="width:12px;height:12px;display:inline-block"></div><div class="heatmap-cell l3" style="width:12px;height:12px;display:inline-block"></div><div class="heatmap-cell l4" style="width:12px;height:12px;display:inline-block"></div> 多</div>';
  return html;
}

function renderTodayOverview(taskDone, taskTotal, pomo, cppDone, cppTotal){
  const ptsData = getPointsData();
  const today = todayStr();
  const todayPoints = (ptsData.history||[]).filter(h=>h.time.slice(0,10)===today).reduce((s,h)=>s+h.amount, 0);
  const dcDone = Object.values(ptsData.dailyChallenges||{}).filter(v=>v).length;
  const dcTotal = DAILY_CHALLENGES.length;
  let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  html += `<div style="background:var(--c-primary-light);padding:16px;border-radius:8px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--c-primary)">${taskDone}/${taskTotal}</div><div style="font-size:12px;color:var(--c-text-light)">今日任务完成</div></div>`;
  html += `<div style="background:var(--c-accent-light);padding:16px;border-radius:8px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--c-accent)">${pomo.count}</div><div style="font-size:12px;color:var(--c-text-light)">今日番茄钟</div></div>`;
  html += `<div style="background:linear-gradient(135deg,#FFF8E1,#FFE082);padding:16px;border-radius:8px;text-align:center;cursor:pointer" onclick="switchTab('growth')"><div style="font-size:28px;font-weight:700;color:#FF8C00">${todayPoints>=0?'+':''}${todayPoints}</div><div style="font-size:12px;color:#BF6E00">今日积分</div></div>`;
  html += `<div style="background:linear-gradient(135deg,#E8EAF6,#C5CAE9);padding:16px;border-radius:8px;text-align:center;cursor:pointer" onclick="switchTab('growth')"><div style="font-size:28px;font-weight:700;color:#3949AB">${dcDone}/${dcTotal}</div><div style="font-size:12px;color:#3949AB">今日挑战</div></div>`;
  html += '</div>';
  return html;
}

function renderCppProgress(cpp){
  let html = '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  activeCspLessons().forEach(l=>{
    const done = cpp.progress[l.id] && cpp.progress[l.id].completed;
    html += `<div style="flex:1;min-width:140px;padding:12px;border-radius:8px;background:${done?'var(--c-accent-light)':'var(--c-bg)'};border:1px solid ${done?'var(--c-accent)':'var(--c-border)'}">`;
    html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">`;
    html += `<div style="width:20px;height:20px;border-radius:50%;background:${done?'var(--c-accent)':'var(--c-border)'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${done?'\\u2713':l.id}</div>`;
    html += `<span style="font-size:12px;font-weight:600">${l.title}</span></div>`;
    html += `<span style="font-size:11px;color:var(--c-text-light)">${done?'已完成':'未完成'}</span>`;
    html += `</div>`;
  });
  html += '</div>';
  return html;
}
